{
 id:'rp5', title:'Consumption and forecast error', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'Forecast error tells you whether the forecast underlying a supply plan is consistent with subsequent, reported, actual consumption. The larger the error, the less the forecast resembles actual consumption. A plan built on a poor forecast will be wrong no matter how carefully the shipments are scheduled.'},
  {t:'p',c:'Two types of consumption are required to calculate a forecast error metric. The first is the actual consumption, that is what was either dispensed or issued and reported. The second is the forecast consumption, that is what was expected to be consumed. Forecast error reflects the gap between actual and forecast consumption, which QAT reports monthly and by planning unit.'},
  {t:'h',c:'The three error metrics'},
  {t:'table',head:['Metric','Full name','How it works','Best used for','Key limitation'],rows:[
   ['WAPE','Weighted absolute percentage error','Total absolute error divided by total actual demand','Aggregate forecasting, volume-weighted business impact','Can hide poor accuracy at the individual item level'],
   ['MAPE','Mean absolute percentage error','Average of individual percentage errors for each point','Comparing relative accuracy across different scales','Undefined if actuals are zero; inflates on low-volume data'],
   ['RMSE','Root mean square error','Square root of the average of squared errors','Penalising large, costly misses such as stockouts','Measured in original units, so hard to compare across scales, and sensitive to outliers']
  ]},
  {t:'p',c:'The advantage of weighted absolute percentage error (WAPE) is that results are not easily skewed by products or months with low consumption. With mean absolute percentage error (MAPE) percentage errors are weighted equally, so absolute errors in months where consumption is low can inflate the error metric, and a small absolute difference in another period can be lost for products or periods when volume is high.'},
  {t:'widget',kind:'error'},
  {t:'note',b:'What a high error means',
   c:'Forecast error is not a scoring exercise. A high error means that forecast assumptions should be reviewed and, when possible, improved at the next quantification workshop — and that is the useful outcome of measuring forecast error.'},
  {t:'h',c:'Reading the consumption report'},
  {t:'p',c:'A forecast consistently above the actuals indicates that the product is being over-forecast. This ties up funding that could have been used elsewhere, and tends to appear later as wastage, expiries and consumed warehouse space. Consistent under-forecasting appears instead as stockouts.'}
 ],
 exercises:[
  {type:'mcq', tag:'Interpret',
   q:'A QAT consumption report shows the forecast bar well above the actual consumption bar in every month of the year. What is the right reading?',
   options:['The product is being consumed faster than expected','The product is consistently over-forecast and should be reviewed at the next quantification',
            'Actual consumption has not been reported','The forecast error threshold is set too low'],
   answer:1,
   explain:'Over-forecasting procures product that is not needed. The funding is tied up, and the stock often ends as expiry. The action is to flag it for review at the next quantification workshop.'},
  {type:'mcq', tag:'Judgement',
   q:'A product has a poor MAPE but an acceptable WAPE. What does that suggest?',
   options:['The errors are concentrated in low-volume months','The largest months were badly forecast',
            'The forecast is biased high throughout','The two were calculated over different periods'],
   answer:0,
   explain:'MAPE weights every month equally, so a large percentage error on a tiny month can skew the statistic. WAPE weights by volume, which may be the more relevant view, for example when funding is the concern.'},
  {type:'mcq', tag:'Quiz',
   q:'Which metric is measured in the original units of the product rather than as a percentage?',
   options:['WAPE','MAPE','RMSE','All three'],
   answer:2,
   explain:'RMSE is expressed in the original units, which makes it hard to compare across products of different scales, and it is sensitive to outliers. Its strength is that it penalises large, costly misses.'},
  {type:'mcq', tag:'Quiz',
   q:'Forecast error on the dashboard is shown in red. What does that mean?',
   options:['The calculation failed','The error is above the threshold, 50% by default',
            'The forecast has not been selected','The data is from a draft version'],
   answer:1,
   explain:'Red means above threshold. A program administrator can set the threshold per planning unit. A caution icon, by contrast, means there was not enough data to calculate the error metric.'}
 ]
},
{
 id:'rp6', title:'The Expiries Report', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'Expiry is the quiet cost in a supply plan. Nothing goes wrong on the day it occurs; the decision that caused it was an over-order a year or two earlier, and the report is where it finally becomes visible.'},
  {t:'h',c:'How QAT calculates expiries'},
  {t:'p',c:'Expiries are calculated at batch level, and in QAT every batch begins with a shipment — or, less commonly, with a positive adjustment.'},
  {t:'table',head:['Setting','Default','Alternative'],rows:[
   ['Expiry date','The product\u2019s shelf life applied to the receive date','A supply planner specifies the date'],
   ['Consumption order','FEFO — first expiry, first out','A supply planner nominates specific batches']
  ]},
  {t:'p',c:'FEFO stands for first expiry, first out: the batch closest to expiring is drawn down first. The opposite approach, LEFO, stands for last expiry, first out, and is discouraged because it increases waste — the same stock meeting the same demand produces more expiries.'},
  {t:'p',c:'Whatever is not consumed or adjusted away before its expiry date becomes expired stock.'},
  {t:'h',c:'The Expiries Report'},
  {t:'p',c:'The Expiries Report sits under Inventory in the Reports menu, alongside Cost of Inventory, Inventory Turns and Stock Adjustment. It lists the planning units projected to expire across the selected report period, with the expired quantity in planning units and the cost, calculated as that quantity multiplied by the planning unit price.'},
  {t:'p',c:'Like other reports it can be run for one program or several, filtered by planning unit, and exported to PDF or CSV. Because the quantities are projections rather than records, the report changes as consumption data arrives — a product expected to expire may not if consumption picks up.'},
  {t:'h',c:'Where else expiry appears'},
  {t:'list',items:[
   'The dashboard Overview gives the total cost of expiries per program over the next 18 months, and a dash where there are none.',
   'The Program Spotlight lists each planning unit projected to expire within the selected report period, with quantity and cost.',
   'The Supply Plan Report marks a projected expiry on the graph with an orange triangle, and carries a Projected Expired Stock column in the tabular view.',
   'The Stock Status Matrix marks the affected cell with a warning triangle.'
  ]},
  {t:'widget',kind:'batches'},
  {t:'note',b:'Read expiry alongside overstock',c:'A product sitting above maximum for several months is the leading indicator. By the time it appears in the Expiries Report the funding has already been committed, so the more useful conversation is the one prompted by the yellow cells months earlier.'}
 ],
 exercises:[
  {type:'mcq', tag:'Quiz',
   q:'Where does QAT get the expiry date for a shipment?',
   options:['It is auto-calculated from the shelf life setting','The supply planner enters it',
            'Either — it defaults to shelf life, and a planner can specify a date','It comes from the procurement agent'],
   answer:2,
   explain:'The default applies the product shelf life to the receive date, and it can be overridden per batch.'},
  {type:'mcq', tag:'Quiz',
   q:'What does FEFO stand for, and what does it mean in practice?',
   options:['First entry, first out — the batch received first is used first',
            'First expiry, first out — the batch closest to expiring is used first',
            'Fixed expiry, forecast output — expiry dates are set by the forecast',
            'Final expiry, full order — expired stock triggers a replacement order'],
   answer:1,
   explain:'First expiry, first out. It is QAT\u2019s default for consumption. The alternative, LEFO or last expiry first out, is discouraged because it produces more waste from the same stock.'},
  {type:'mcq', tag:'Recall',
   q:'In QAT, what does a batch begin with?',
   options:['An inventory count','A shipment, or a positive adjustment','A consumption record','A forecast'],
   answer:1,
   explain:'Every batch originates with a shipment, or occasionally with a positive adjustment, which is why expiry dates trace back to receive dates.'},
  {type:'mcq', tag:'Apply',
   q:'The Expiries Report shows a large cost for one product. Looking back at the Stock Status Matrix, what would you expect to find?',
   options:['Red cells several months earlier','Yellow cells several months earlier',
            'Grey cells several months earlier','Nothing unusual'],
   answer:1,
   explain:'Yellow indicates above maximum. Stock held well above the band for a sustained period is the condition that produces expiry, and it is visible long before the cost materialises.'},
  {type:'mcq', tag:'Recall',
   q:'In which units does the Expiries Report show quantity?',
   options:['Forecasting units','Planning units','Equivalency units','Alternate reporting units'],
   answer:1,
   explain:'Planning units, with cost calculated as that quantity multiplied by the planning unit price.'}
 ]
},
{
 id:'rp7', title:'The Supply Plan Scorecard', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'The Supply Plan Scorecard generates an overall score for each program\u2019s supply plan based on Quality (including data completeness and procurement scheduling) and Stock Status (against minimum and maximum levels).'},
  {t:'p',c:'The score uses the same criteria as the QAT Problem List, a validation screen available to program users and admins to improve their supply plans. The scorecard highlights areas needing improvement and allows global users to compare performance across programs. Users can view results at three levels:'},
  {t:'table',head:['View by option','Description'],rows:[
   ['Program','Compare the performance of individual programs.'],
   ['Country','Compare overall performance across countries by combining all programs within each country.'],
   ['Country x Technical Area','Compare technical areas, such as malaria, HIV/AIDS, or family planning, within and across countries.']
  ]},
  {t:'p',c:'This flexibility allows country-level users to compare programs and technical areas within their portfolio, while global users, donors, procurement agents, regional advisors, and portfolio managers can evaluate performance across multiple countries.'},
  {t:'img',src:'scorecard',alt:'The supply plan score by program chart showing quality score, stock status score and total score for six programs against a 90% target line',
   cap:'Supply Plan Score by Program. The dark bar is the Quality Score, the light bar the Stock Status Score, the red line the Total Score, and the dashed grey line the 90% target.'},
  {t:'p',c:'Higher scores indicate stronger supply plan performance. Scores are colour-ranked, with a target score of 90%.'},
  {t:'note',b:'Scores are not tied to a reporting period',
   c:'Because the scores are derived from the data in the QAT Problem List, they are not tied to a specific reporting period. Instead, downloaded program versions recalculate the QAT Problem List using the current date, while server-based program versions calculate it based on the upload date.'},
  {t:'h',c:'Overall Supply Plan Score'},
  {t:'p',c:'The Overall Supply Plan Score is an average of the Quality Score and the Stock Status Score.'},
  {t:'table',head:['Category','Score'],rows:[
   ['Data Quality Score','65%'],['Stock Status Score','57%'],
   ['Overall Supply Plan Score','61% = (65% + 57%) ÷ 2']
  ]},

/* ============================ glossary ============================ */
const GLOSSARY = [
 ['AMC','Average monthly consumption. A dynamic value recalculated each month. The QAT default averages the 3 previous months, the current month and 2 future months; missing months are null, not zero. Administrators can widen the window to 12 months either side.'],
 ['ARU — alternate reporting unit','The product and unit a country actually reports consumption or stock in, with a multiplier to the planning unit. Report in boxes of 20 bottles and QAT converts to bottles.'],
 ['ARIMA','Auto-regressive integrated moving average. A time-series method for projecting consumption from historical trends and patterns.'],
 ['ARTMIS','GHSC-PSM\u2019s system for tracking procurement, shipping and delivery of USG-financed commodities. QAT integrates with it for shipment data.'],
 ['Batch','A quantity of product with a shared expiry date. QAT creates one batch per shipment, expiring at receive date plus shelf life.'],
 ['Consumption-based forecast','A forecast extrapolated from historical actual consumption using linear and non-linear methods.'],
 ['Continuous and discrete usage','On a forecasting tree, whether a product is used indefinitely or for a defined period. Discrete products need a period of use unless they are single use.'],
 ['Data source','Where a transactional record — consumption, inventory, adjustment, shipment — originated. Applied per record.'],
 ['Equivalency unit (EU)','A standardised unit converting different strengths or pack sizes into a common measure so they can be aggregated. Cannot be combined with ARUs.'],
 ['ERP linking','Integration with a procurement agent\u2019s order management system. Linked shipment fields are not editable inside QAT.'],
 ['FEFO','First expiry, first out. QAT\u2019s default batch logic for consumption. LEFO is the opposite and is discouraged.'],
 ['Forecasting unit (FU)','The smallest unit used when forecasting — tablets, tests, vials. Always smaller than or equal to the planning unit.'],
 ['Lead times','Mapped to the shipment lifecycle in six segments: planned to submitted, submitted to approved, approved to shipped, shipped to arrived by sea, shipped to arrived by air, and arrived to received.'],
 ['MAPE','Mean absolute percentage error. Averages each period\u2019s percentage error with equal weight.'],
 ['Master data sync','Standardised data shared across a realm. Syncs on online login or manual sync; full program data is a separate download and upload.'],
 ['Minimum and maximum stock levels','Minimum is set per planning unit at program level. Maximum is calculated as minimum plus the reorder interval.'],
 ['MOS — months of stock','Ending balance divided by AMC. Recalculated every month.'],
 ['PipeLine','The legacy supply planning tool QAT replaced. Supply plans lived in an Access database; ConvertPipelineToJson migrates them.'],
 ['Plan by MOS','For high-volume products with minimal expiry, where shipments mostly replace consumption. Min and max are expressed in months.'],
 ['Plan by quantity','For low-volume, high-expiry products held for emergencies. Min is a quantity; max is min plus reorder interval times AMC.'],
 ['Planning unit (PU)','The unit QAT plans and orders in — a bottle of 30 tablets, a 10x10 blister pack.'],
 ['Program','One country, one or more technical areas, one region, one organisation. The equivalent of a PipeLine supply plan database.'],
 ['PWA','Progressive web application. QAT works offline against a program you downloaded while online.'],
 ['QPL — QAT problem list','Flags data issues, inconsistencies and warnings affecting forecasts or supply plans.'],
 ['Quantimed','The legacy forecasting tool. QAT\u2019s forecasting module replaced its module 2.'],
 ['Realm','A set of shared master data — product catalogue, funders, procurement agents. The Global Health Realm is the one in use.'],
 ['Reorder interval','Months between shipments, default 1. Used to calculate the maximum.'],
 ['RMSE','Root mean squared error. In units, and penalises large misses disproportionately.'],
 ['Shipment','A planned or actual delivery into the supply chain, shown on the plan by expected receive date regardless of order status.'],
 ['Shipment statuses','Nine in total: suggested, planned, submitted, approved, shipped, arrived, received, on hold, cancelled. Suggested and cancelled are excluded from projections; on hold is included.'],
 ['Suggested shipment','An early warning generated by QAT when stock will fall below minimum. It does not affect projections until accepted and given another status.'],
 ['Technical area','Synonymous with commodity group — ARV, family planning, malaria. Used to define a program.'],
 ['Tree forecast','A flexible structure converting demographic, morbidity or service data into commodity quantities for products without usable consumption history.'],
 ['Tree template','A pre-defined forecasting tree that can be downloaded and customised to a country context.'],
 ['Triple exponential smoothing','Holt-Winters. Models level, trend and seasonality together — the method for seasonal commodities.'],
 ['Unmet demand','What would have been consumed had stock been available. QAT never shows negative stock; the shortfall goes in its own row.'],
 ['Usage template','Pre-defined rates of use for specific products, reusable across trees and programs.'],
 ['WAPE','Weighted absolute percentage error. Total absolute error as a share of total actual demand, so volume dominates.']
];

/* ============================ shared UI ============================ */
function Chart(props){
  const html = chartSVG(props.opts);
  function onClick(e){
    const t = e.target.closest ? e.target.closest('[data-pick]') : null;
    if(t && props.onPick) props.onPick(+t.getAttribute('data-pick'));
  }
  return <div className="fig" onClick={onClick}>
    <div dangerouslySetInnerHTML={{__html:html}} />
    {props.cap ? <figcaption>{props.cap}</figcaption> : null}
  </div>;
}

function Shot({src, alt, zoomable}){
  const [big,setBig] = useState(false);
  useEffect(()=>{
    if(!big) return;
    const onKey = e => { if(e.key==='Escape') setBig(false); };
    window.addEventListener('keydown', onKey);
    return ()=> window.removeEventListener('keydown', onKey);
  }, [big]);
  return <React.Fragment>
    <button className="shot" onClick={()=>setBig(true)} aria-label="Enlarge screenshot">
      <img src={src} alt={alt||''} /></button>
    {big? <div className="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged screenshot"
        onClick={()=>setBig(false)}>
      <img src={src} alt={alt||''} />
      <button className="lbclose" aria-label="Close" onClick={()=>setBig(false)}>&times;</button>
      <p className="lbhint">Tap anywhere, or press Escape, to close</p>
    </div> : null}
  </React.Fragment>;
}

function Block(b){
  if(b.t==='p') return <p className={b.cls||''}>{b.c}</p>;
  if(b.t==='h') return <h2>{b.c}</h2>;
  if(b.t==='list') return <ul className="blist">{b.items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
  if(b.t==='def') return <div className="defn"><b>{b.term}</b>{b.c}</div>;
  if(b.t==='note') return <div className="note"><b>{b.b}</b>{b.c}</div>;
  if(b.t==='eq') return <div className="eq">{b.c}{b.note?<small>{b.note}</small>:null}</div>;
  if(b.t==='table') return <table><thead><tr>{b.head.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
    <tbody>{b.rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>)}</tbody></table>;
  if(b.t==='chart') return <Chart opts={{values:b.values,min:b.min,max:b.max}} cap={b.cap}/>;
  if(b.t==='img') return <figure className="fig"><Shot src={IMG[b.src]} alt={b.alt}/>{b.cap? <figcaption>{b.cap}</figcaption> : null}</figure>;
  if(b.t==='links') return <ul className="linklist">{b.items.map((x,i)=><li key={i}><a href={x.u} target="_blank" rel="noopener noreferrer">{x.n}</a><p>{x.d}</p></li>)}</ul>;
  return null;
}

/* ============================ scenario sandbox ============================ */
const BASE = {
  consumption:[9500,9800,10200,10500,11000,11500,12000,12000,11500,11000,10500,10000],
  opening:30000, min:3, reorder:2,
  shipments:[
    {m:3, qty:20000, status:'Planned', funding:'TBD'},
    {m:6, qty:25000, status:'Submitted', funding:'PMI'},
    {m:9, qty:20000, status:'Planned', funding:'Global Fund'}
  ]
};
function Sandbox(){
  const [pct,setPct] = useState(0);
  const [noUnfunded,setNoUnfunded] = useState(false);
  const [noPlanned,setNoPlanned] = useState(false);

  const build = (p, unf, pln) => {
    const cons = BASE.consumption.map(c => c*(1+p/100));
    const ship = new Array(12).fill(0);
    BASE.shipments.forEach(s=>{
      if(unf && s.funding==='TBD') return;
      if(pln && s.status==='Planned') return;
      ship[s.m] += s.qty;
    });
    return project({opening:BASE.opening, consumption:cons, shipments:ship,
      adjustments:null, min:BASE.min, reorder:BASE.reorder});
  };
  const rows = useMemo(()=>build(pct,noUnfunded,noPlanned),[pct,noUnfunded,noPlanned]);
  const base = useMemo(()=>build(0,false,false),[]);
  const mos = rows.map(r=> r.mos===null?0:r.mos);
  const ghost = base.map(r=> r.mos===null?0:r.mos);
  const max = BASE.min + BASE.reorder;
  const under = rows.filter(r=> r.mos!==null && r.mos>0 && r.mos<BASE.min).length;
  const over  = rows.filter(r=> r.mos!==null && r.mos>max).length;
  const out   = rows.filter(r=> r.close<=0).length;
  const unmet = rows.reduce((a,r)=>a+r.unmet,0);

  return <div className="sandbox">
    <h3>Scenario sandbox</h3>
    <p className="sub">One planning unit, twelve months. Opening stock 30,000. Min 3 MOS, reorder interval 2, so max is 5. Three shipments: 20,000 in April (planned, funding TBD), 25,000 in July (submitted, PMI), 20,000 in October (planned, Global Fund). The dashed line is the untouched baseline.</p>
    <Chart opts={{values:mos, ghost:ghost, min:BASE.min, max:max, top:10}}/>
    <div className="ctrl">
      <label>
        <span>Adjust forecast consumption</span>
        <input type="range" min="-40" max="40" step="5" value={pct}
          onChange={e=>setPct(+e.target.value)} />
        <span className="val">{pct>0?'+':''}{pct}%</span>
      </label>
    </div>
    <div className="toggles">
      <label><input type="checkbox" checked={noUnfunded} onChange={e=>setNoUnfunded(e.target.checked)} />
        <span>Remove unfunded shipments — drops the April order, funding source TBD</span></label>
      <label><input type="checkbox" checked={noPlanned} onChange={e=>setNoPlanned(e.target.checked)} />
        <span>Remove all planned shipments — drops April and October, leaving only the submitted July order</span></label>
    </div>
    <div className="readout">
      <div><span>Months below min</span><b>{under}</b></div>
      <div><span>Months above max</span><b>{over}</b></div>
      <div><span>Months stocked out</span><b>{out}</b></div>
      <div><span>Unmet demand</span><b>{nf(unmet)}</b></div>
    </div>
  </div>;
}

const AMC_SERIES = [
  {m:'Jan', v:4100},{m:'Feb', v:4300},{m:'Mar', v:4200},{m:'Apr', v:null},

  {m:'Jan +1', v:5000},{m:'Feb +1', v:4900}

const NOW = 8;
function AmcExplorer(){
  const [back,setBack] = useState(3);
  const [fwd,setFwd] = useState(2);
  const inWindow = i => i >= NOW-back && i <= NOW+fwd;
  const vals = AMC_SERIES.filter((d,i)=> inWindow(i) && d.v!==null).map(d=>d.v);
  const amc = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  const skipped = AMC_SERIES.filter((d,i)=> inWindow(i) && d.v===null).length;
  const balance = 22000;
  return <div className="sandbox">
    <h3>AMC window explorer</h3>
    <p className="sub">One planning unit. September is the current month. April has no consumption record — watch what happens to the average when the window reaches it.</p>
    <div className="months">{AMC_SERIES.map((d,i)=>
      <div className="mcell" key={i} data-in={inWindow(i)?'1':'0'}
        data-now={i===NOW?'1':'0'} data-null={d.v===null?'1':'0'}>
        {d.m}<b>{d.v===null?'—':nf(d.v)}</b></div>)}

/* ============================ forecast error lab ============================ */
const ERR_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun'];
const ACTUAL =  [1200,1500, 900,1800, 400,1600];
const VER_A =   [1300,1400,1000,1700, 700,1500];
const VER_B =   [1250,1650, 850,2000, 420,1450];
function metrics(actual, fc, keep){
  let n=0, sumPct=0, sumAbs=0, sumAct=0, sumSq=0;
  actual.forEach((a,i)=>{
    if(!keep[i]) return;
    const err = Math.abs(fc[i]-a);
    n++; sumPct += err/a; sumAbs += err; sumAct += a; sumSq += err*err;
  });
  if(!n) return null;
  return {mape: sumPct/n*100, wape: sumAbs/sumAct*100, rmse: Math.sqrt(sumSq/n)};
}
function ErrorLab(){
  const [keep,setKeep] = useState([true,true,true,true,true,true]);
  const a = metrics(ACTUAL, VER_A, keep);
  const b = metrics(ACTUAL, VER_B, keep);
  const toggle = i => setKeep(k => k.map((v,j)=> j===i? !v : v));
  const line = (a && b)
    ? 'Version ' + (a.mape<=b.mape?'A':'B') + ' has the lower MAPE; version '
      + (a.wape<=b.wape?'A':'B') + ' has the lower WAPE'
      + (((a.mape<=b.mape) !== (a.wape<=b.wape))
         ? '. The two metrics disagree, which is why both are reported.'
         : '. Here they agree.')
    : 'Keep at least one month to calculate anything.';
  return <div className="sandbox">
    <h3>Forecast error lab</h3>
    <p className="sub">Six months of actuals against two forecast versions. May was a stockout month, so its actual is far below trend — click any month to exclude it and watch the metrics move.</p>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Actual</th><th>Version A</th><th>Version B</th></tr></thead>
      <tbody>{ERR_MONTHS.map((m,i)=>
        <tr key={i} style={{opacity: keep[i]?1:0.4}}>
          <td><button className="mcell mtoggle" data-off={keep[i]?'0':'1'}
            style={{minWidth:'auto',padding:'3px 9px'}} onClick={()=>toggle(i)}>{m}</button></td>
          <td>{nf(ACTUAL[i])}</td><td>{nf(VER_A[i])}</td><td>{nf(VER_B[i])}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="metrics">
      <div className="mbox" data-win={(a&&b&&a.wape<=b.wape)?'1':'0'}>
        <h5>Version A</h5>
        <div className="row"><span>MAPE</span>{a? a.mape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>WAPE</span>{a? a.wape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>RMSE</span>{a? nf(a.rmse) : '—'}</div>
      </div>
      <div className="mbox" data-win={(a&&b&&b.wape<a.wape)?'1':'0'}>
        <h5>Version B</h5>
        <div className="row"><span>MAPE</span>{b? b.mape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>WAPE</span>{b? b.wape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>RMSE</span>{b? nf(b.rmse) : '—'}</div>
      </div>
    </div>
    <p className="verdict">{line} The highlighted version has the lower WAPE.</p>
  </div>;
}

/* ============================ generic line chart ============================ */
function lineSVG(o){
  const W=660,H=250,L=46,R=12,T=16,B=32;
  const pw=W-L-R, ph=H-T-B;
  let all=[]; o.series.forEach(s=>s.values.forEach(v=>{ if(v!==null) all.push(v); }));
  const hi=Math.max.apply(null,all), lo=o.zero===false? Math.min.apply(null,all) : 0;
  const span=(hi-lo)||1;
  const n=o.labels.length;
  const x=i=>L+(pw/(n-1))*i;
  const y=v=>T+ph-((v-lo)/span)*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.alt||'chart')+'">';
  for(let k=0;k<=4;k++){ const v=lo+span*k/4;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--rule2)"/>';
    s+='<text class="axlabel" x="'+(L-7)+'" y="'+(y(v)+4)+'" text-anchor="end">'+nf(v)+'</text>'; }
  if(o.split!==undefined){
    s+='<line x1="'+x(o.split)+'" x2="'+x(o.split)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink3)" stroke-dasharray="3 3"/>';
    s+='<text class="bandlabel" x="'+(x(o.split)+5)+'" y="'+(T+11)+'" fill="var(--ink3)">projection</text>';
  }
  o.series.forEach(se=>{
    let d='',open=false;
    se.values.forEach((v,i)=>{ if(v===null){open=false;return;}
      d += (open?'L':'M')+x(i)+','+y(v); open=true; });
    s+='<path d="'+d+'" fill="none" stroke="'+(se.color||'var(--ink)')+'" stroke-width="'+(se.w||2.2)+'"'
      + (se.dash?' stroke-dasharray="5 4"':'') + ' stroke-linejoin="round"/>';
    if(se.dots) se.values.forEach((v,i)=>{ if(v!==null)
      s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="2.8" fill="'+(se.color||'var(--ink)')+'"/>'; });
  });
  o.labels.forEach((lb,i)=>{ if(lb)
    s+='<text class="mlabel" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>'; });
  return s+'</svg>';
}
function Line(props){ return <div className="fig" dangerouslySetInnerHTML={{__html:lineSVG(props.opts)}} />; }

/* ============================ extrapolation visualiser ============================ */
const HIST_LABELS = [];
for(let i=0;i<36;i++) HIST_LABELS.push(i%6===0 ? MO[i%12]+(i<12?'':(i<24?' +1':' +2')) : '');
const SEASON = [0.80,0.78,0.85,0.95,1.10,1.28,1.40,1.35,1.18,1.00,0.88,0.83];
const HIST = [];
(function(){ for(let i=0;i<24;i++){
  const trend = 4000 + i*70;
  const noise = [1.02,0.97,1.04,0.99,1.01,0.96,1.03,1.00,0.98,1.05,0.99,1.02][i%12];
  HIST.push(Math.round(trend*SEASON[i%12]*noise));
}})();
function fitLinear(y){
  const n=y.length; let sx=0,sy=0,sxy=0,sxx=0;
  y.forEach((v,i)=>{ sx+=i; sy+=v; sxy+=i*v; sxx+=i*i; });
  const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), a=(sy-b*sx)/n;
  return i=>a+b*i;
}
function ExtrapLab(){
  const [method,setMethod] = useState('season');
  const lin = fitLinear(HIST);
  // ratio-to-trend seasonal indices
  const idx = new Array(12).fill(0), cnt = new Array(12).fill(0);
  HIST.forEach((v,i)=>{ const t=lin(i); if(t>0){ idx[i%12]+=v/t; cnt[i%12]++; } });
  const si = idx.map((s,i)=> cnt[i]? s/cnt[i] : 1);
  const project = i => method==='linear' ? lin(i) : lin(i)*si[i%12];
  const fitted = HIST.map((v,i)=> project(i));
  const err = HIST.map((v,i)=> Math.abs(fitted[i]-v)/v).reduce((a,b)=>a+b,0)/HIST.length*100;
  const hist = HIST.concat(new Array(12).fill(null));
  const fwd = new Array(36).fill(null);
  for(let i=23;i<36;i++) fwd[i]=Math.round(project(i));
  return <div className="sandbox">
    <h3>Extrapolation visualiser</h3>
    <p className="sub">Two years of consumption with a clear rainy-season peak, projected twelve months forward. Same history, two methods.</p>
    <div className="seg">
      <button data-on={method==='linear'?'1':'0'} onClick={()=>setMethod('linear')}>Linear</button>
      <button data-on={method==='season'?'1':'0'} onClick={()=>setMethod('season')}>Seasonal (trend x index)</button>
    </div>
    <Line opts={{labels:HIST_LABELS, split:23, alt:'Consumption history and projection',
      series:[{values:hist, color:'var(--ink)', dots:false},
              {values:fwd, color:'var(--ok)', dash:true, w:2.4}]}}/>
    <div className="readout">
      <div><span>In-sample MAPE</span><b>{err.toFixed(1)}%</b></div>
      <div><span>Next 12 months</span><b>{nf(fwd.slice(24).reduce((a,b)=>a+b,0))}</b></div>
      <div><span>Peak month projected</span><b>{nf(Math.max.apply(null,fwd.slice(24)))}</b></div>
    </div>
    <p className="verdict">{method==='linear'
      ? 'Linear extrapolation approximates the annual average but not the seasonal shape. It under-supplies during the peak and over-supplies during the trough, while the annual total appears reasonable.'
      : 'Multiplying the trend by a seasonal index reproduces the peak. Note the lower in-sample error, and that the twelve-month total differs from the linear projection despite using the same history.'}</p>
  </div>;
}

/* ============================ batch and expiry simulator ============================ */
function BatchLab(){
  const [shelf,setShelf] = useState(18);
  const [policy,setPolicy] = useState('fefo');
  const arrivals = [{m:0,qty:40000},{m:2,qty:30000},{m:6,qty:35000}];
  const cons = [9000,9200,9500,9800,10000,10200,10500,10500,10000,9800,9500,9200];
  let batches = [], expired = 0, unmet = 0, log = [];
  arrivals.forEach((a,k)=> batches.push({id:'B'+(k+1), qty:a.qty, arrive:a.m, exp:a.m+shelf}));
  for(let m=0;m<12;m++){
    let need = cons[m];
    let live = batches.filter(b=>b.arrive<=m && b.qty>0 && b.exp>m);
    live.sort((x,y)=> policy==='fefo' ? x.exp-y.exp : y.exp-x.exp);
    live.forEach(b=>{ if(need<=0) return; const take=Math.min(b.qty,need); b.qty-=take; need-=take; });
    unmet += need;
    let lost = 0;
    batches.forEach(b=>{ if(b.exp===m+1 && b.qty>0){ lost+=b.qty; b.qty=0; } });
    expired += lost;
    log.push({m:MO[m], stock:batches.reduce((a,b)=>a+(b.arrive<=m?b.qty:0),0), lost:lost, short:need});
  }
  return <div className="sandbox">
    <h3>Batch and expiry simulator</h3>
    <p className="sub">Three shipments arrive in January, March and July, each becoming one batch that expires at its receive date plus the shelf life. Consumption draws down the batches month by month.</p>
    <div className="ctrl"><label><span>Shelf life, in months</span>
      <input type="range" min="6" max="36" value={shelf} onChange={e=>setShelf(+e.target.value)} />
      <span className="val">{shelf}</span></label></div>
    <div className="seg">
      <button data-on={policy==='fefo'?'1':'0'} onClick={()=>setPolicy('fefo')}>FEFO (QAT default)</button>
      <button data-on={policy==='lefo'?'1':'0'} onClick={()=>setPolicy('lefo')}>LEFO (discouraged)</button>
    </div>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Consumption</th><th>Closing stock</th><th>Expired</th><th>Unmet</th></tr></thead>
      <tbody>{log.map((r,i)=>
        <tr key={i} data-s={r.lost>0?'over':(r.short>0?'under':'')}>
          <td>{r.m}</td><td>{nf(cons[i])}</td><td>{nf(r.stock)}</td>
          <td>{r.lost? nf(r.lost) : '—'}</td><td>{r.short? nf(r.short) : '—'}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="readout">
      <div><span>Total expired</span><b>{nf(expired)}</b></div>
      <div><span>Total unmet demand</span><b>{nf(unmet)}</b></div>
      <div><span>Policy</span><b>{policy.toUpperCase()}</b></div>
    </div>
    <p className="verdict">Reducing the shelf life until product expires, then switching to LEFO, increases total expiries for the same stock and the same demand. QAT applies first expiry, first out by default.</p>
  </div>;
}

/* ============================ multi-region consensus ============================ */
const RG_MO = ['Jan','Feb','Mar','Apr','May','Jun'];
const REGIONS = [
  {n:'Northern', act:[1000,1100,null,1050,1200,null], fc:[1050,1050,1100,1100,1150,1150]},
  {n:'Central',  act:[800, null, null, 850, 900,null], fc:[820, 830, 840, 850, 860, 870]},
  {n:'Southern', act:[500, 520, null, null, 560,null], fc:[550, 550, 560, 560, 570, 570]}
];
function RegionLab(){
  const [mode,setMode] = useState('multi');
  const [scale,setScale] = useState(100);
  const rows = RG_MO.map((m,i)=>{
    const acts = REGIONS.map(r=> r.act[i]===null? null : r.act[i]*scale/100);
    const sumAct = acts.reduce((a,v)=> a+(v||0), 0);
    const sumFc  = REGIONS.reduce((a,r)=> a+r.fc[i], 0);
    const anyAct = acts.some(v=>v!==null);
    const consensus = mode==='multi'
      ? Math.max(sumAct, sumFc)
      : (anyAct ? sumAct : sumFc);
    return {m, sumAct, sumFc, anyAct, consensus, src: mode==='multi'
      ? (sumAct>=sumFc? 'actuals':'forecast')
      : (anyAct? 'actuals':'forecast')};
  });
  return <div className="sandbox">
    <h3>Consumption displayed in the plan</h3>
    <p className="sub">Three regions reporting into one program, with patchy actuals. The rule QAT applies depends on whether the program is single-region or multi-region — and the two rules can give very different answers.</p>
    <div className="seg">
      <button data-on={mode==='multi'?'1':'0'} onClick={()=>setMode('multi')}>Multi-region: greater of the two sums</button>
      <button data-on={mode==='single'?'1':'0'} onClick={()=>setMode('single')}>Single region: actual, else forecast</button>
    </div>
    <div className="ctrl"><label><span>Scale reported actuals</span>
      <input type="range" min="40" max="160" step="5" value={scale} onChange={e=>setScale(+e.target.value)} />
      <span className="val">{scale}%</span></label></div>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Sum of actuals</th><th>Sum of forecast</th><th>Shown</th><th>From</th></tr></thead>
      <tbody>{rows.map((r,i)=>
        <tr key={i}>
          <td>{r.m}</td>
          <td>{r.anyAct? nf(r.sumAct) : '—'}</td>
          <td>{nf(r.sumFc)}</td>
          <td><b>{nf(r.consensus)}</b></td>
          <td style={{fontSize:'12.5px',color:'var(--ink3)'}}>{r.src}</td>
        </tr>)}
      </tbody>

    <p className="verdict">{mode==='multi'
      ? 'Under the greater-of rule, incomplete reporting cannot reduce consumption below the forecast. A month in which only one region reported will therefore display the full forecast rather than a partial actual.'
      : 'The single-region rule uses the actual value whenever one exists. Reducing the reported actuals lowers consumption accordingly, including where the reduction reflects a reporting gap rather than a change in demand.'}</p>
  </div>;
}

/* ============================ consumption adjustment ============================ */
const SO_CONS = [4200,3100,4300,4400,2050,4500,4600,4700,4550,4600,4700,4800];
const SO_DAYS = [0,11,0,0,18,0,0,0,2,0,0,0];
const SO_RR   = [100,100,100,98,97,96,100,100,100,100,100,100];
const DIM     = [31,28,31,30,31,30,31,31,30,31,30,31];
function StockoutLab(){
  const [days,setDays] = useState(SO_DAYS);
  const [rr,setRr] = useState(SO_RR);
  const [adjust,setAdjust] = useState(true);
  const adj = SO_CONS.map((c,i)=>{
    const d = Math.min(DIM[i]-1, Math.max(0, parseFloat(days[i])||0));
    const r = Math.min(100, Math.max(1, parseFloat(rr[i])||100));
    if(!adjust) return c;
    return c / (r/100) / (1 - d/DIM[i]);
  });
  const rawAmc = SO_CONS.reduce((a,b)=>a+b,0)/12;
  const adjAmc = adj.reduce((a,b)=>a+b,0)/12;
  const setD = (i,v)=> setDays(d=> d.map((x,j)=> j===i? v : x));
  const setR = (i,v)=> setRr(d=> d.map((x,j)=> j===i? v : x));
  return <div className="sandbox">
    <h3>Consumption adjustment</h3>
    <p className="sub">Reported consumption understates demand whenever a facility was stocked out or a report did not arrive. QAT scales the figure up for both.</p>
    <div className="eq" style={{margin:'0 0 16px',boxShadow:'none'}}>
      Adjusted = actual ÷ reporting rate ÷ (1 − stockout rate)
      <small>Stockout rate is days out of stock divided by days in the month.</small></div>
    <div className="toggles"><label>
      <input type="checkbox" checked={adjust} onChange={e=>setAdjust(e.target.checked)} />
      <span>Apply the adjustment</span></label></div>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Reported</th><th>Days out</th><th>Reporting %</th>
        <th>Adjusted</th><th>Uplift</th></tr></thead>
      <tbody>{MO.map((m,i)=>
        <tr key={i} data-s={((parseFloat(days[i])||0)>0 || (parseFloat(rr[i])||100)<100)? 'under':''}>
          <td>{m}</td>
          <td>{nf(SO_CONS[i])}</td>
          <td><input type="text" inputMode="numeric" value={days[i]}
            aria-label={'Days out of stock in '+m}
            onChange={e=>setD(i,e.target.value)} style={{width:'58px'}} /></td>
          <td><input type="text" inputMode="numeric" value={rr[i]}
            aria-label={'Reporting rate in '+m}
            onChange={e=>setR(i,e.target.value)} style={{width:'58px'}} /></td>
          <td>{nf(adj[i])}</td>
          <td style={{color: adj[i]>SO_CONS[i]+1? 'var(--under)':'var(--ink3)'}}>
            {adj[i]>SO_CONS[i]+1? '+'+Math.round((adj[i]/SO_CONS[i]-1)*100)+'%' : '\u2014'}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="readout">
      <div><span>Raw annual average</span><b>{nf(rawAmc)}</b></div>
      <div><span>Adjusted average</span><b>{nf(adjAmc)}</b></div>
      <div><span>Difference</span><b>{((adjAmc/rawAmc-1)*100).toFixed(1)}%</b></div>
    </div>
    <p className="verdict">Adjusted consumption is always at or above the reported figure, because both divisors are fractions. Two affected months can move the annual average by several percent, and that average is what every extrapolation method is fitted to. Extrapolating unadjusted history projects past stockouts forward as though they were demand.</p>
  </div>;
}

/* ============================ lead time planner ============================ */
const SEGS = [
  {k:'Planned to submitted', w:2,  c:'#4A7FBF'},
  {k:'Submitted to approved', w:3, c:'#2D6CB8'},
  {k:'Approved to shipped', w:6,  c:'#1E5391'},
  {k:'Shipped to arrived', w:8,   c:'#00427F'},
  {k:'Arrived to received', w:4,  c:'#002F6C'}

function LeadLab(){
  const [w,setW] = useState(SEGS.map(s=>s.w));
  const [air,setAir] = useState(false);
  const [need,setNeed] = useState(9);
  const weeks = w.map((x,i)=> (i===3 && air)? 1 : x);
  const total = weeks.reduce((a,b)=>a+b,0);
  const months = total/4.345;
  const orderBy = need - months;
  const set = (i,v)=> setW(a=> a.map((x,j)=> j===i? +v : x));
  return <div className="sandbox">
    <h3>Lead time planner</h3>
    <p className="sub">QAT splits lead time into segments rather than treating it as one number. Set them and work backwards from the month the stock has to be usable.</p>

    <div className="toggles"><label>
      <input type="checkbox" checked={air} onChange={e=>setAir(e.target.checked)} />

      <div><span>Total lead time</span><b>{total} wk</b></div>
      <div><span>In months</span><b>{months.toFixed(1)}</b></div>

    </div>

      ? 'The required order date has already passed. This is the condition QAT flags as an emergency shipment. Air freight is normally the only remaining option.'
      : 'Note the effect of air freight on the order-by date. The segment lengths determine how much decision time remains.'}</p>
  </div>;
}

/* ============================ suggested shipment simulator ============================ */
function SuggestLab(){
  const [min,setMin] = useState(3);
  const [ri,setRi] = useState(2);
  const [lead,setLead] = useState(4);
  const max = min+ri;
  const cons = [10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000];
  const rows = project({opening:75000, consumption:cons, shipments:new Array(12).fill(0),
    adjustments:null, min:min, reorder:ri});
  const mos = rows.map(r=> r.mos===null? 0 : r.mos);
  const sugg = [];
  rows.forEach((r,i)=>{
    if(!r.amc || r.amc<=0) return;
    const below = k => k<12 && mos[k] < min;
    const stockout = r.close<=0;
    let target = null;
    if(stockout) target = (below(i+1) && below(i+2)) ? 'maximum' : 'minimum';
    else if(mos[i]<min && below(i+1) && below(i+2)) target = 'maximum';
    if(!target) return;
    const lvl = target==='maximum'? max : min;
    const qty = Math.max(0, lvl*r.amc - r.close);
    const place = i - lead;
    sugg.push({when:MO[i], target, qty, place: place<0? null : MO[place], emergency: place<0});
  });
  return <div className="sandbox">
    <h3>Suggested shipment simulator</h3>
    <p className="sub">Opening stock 75,000, consumption flat at 10,000 a month, no shipments entered. QAT applies its own rules and proposes orders — including where in the calendar to put them.</p>
    <div className="ctrl"><label><span>Minimum, in months</span>
      <input type="range" min="1" max="6" value={min} onChange={e=>setMin(+e.target.value)} />
      <span className="val">{min}</span></label></div>
    <div className="ctrl"><label><span>Reorder interval</span>
      <input type="range" min="1" max="6" value={ri} onChange={e=>setRi(+e.target.value)} />
      <span className="val">{ri}</span></label></div>
    <div className="ctrl"><label><span>Distribution lead time</span>
      <input type="range" min="0" max="8" value={lead} onChange={e=>setLead(+e.target.value)} />
      <span className="val">{lead} mo</span></label></div>
    <p className="tinylabel">Maximum works out at {max} months</p>
    <Chart opts={{values:mos, min:min, max:max, top:Math.max(10,max+3)}}/>
    <table className="plantable">
      <thead><tr><th>Trigger month</th><th>MOS</th><th>Top up to</th><th>Quantity</th><th>Place in</th></tr></thead>
      <tbody>{sugg.length? sugg.map((s,i)=>
        <tr key={i}>
          <td>{s.when}</td>
          <td>{mos[MO.indexOf(s.when)].toFixed(1)}</td>
          <td>{s.target}</td>
          <td>{nf(s.qty)}</td>
          <td style={{color: s.emergency? 'var(--under)':'var(--ink)'}}>
            {s.emergency? 'emergency' : s.place}</td>
        </tr>) : <tr><td colSpan="5" style={{textAlign:'left',color:'var(--ink3)'}}>
          No suggestion triggers with these settings.</td></tr>}
      </tbody>
    </table>
    <p className="verdict">Increasing the minimum produces earlier and larger suggestions. Increasing the lead time moves the order month earlier; where it falls before the start of the plan, QAT flags the suggestion as an emergency shipment.</p>
  </div>;
}

/* ============================ QAT-style dual-axis graph ============================ */
const SHIP_COL = {received:'#0B2C6B', arrived:'#2FA894', submitted:'#1B7FD4',
                  onhold:'#5A5A5A', planned:'#A8C8F0', suggested:'#E8E8E8'};
const SHIP_NAME = {received:'Received', arrived:'Shipped & arrived', submitted:'Submitted & approved',
                   onhold:'On-hold', planned:'Planned'};
function qatGraph(o){
  const W=680,H=300,L=52,R=44,T=18,B=46;
  const pw=W-L-R, ph=H-T-B, n=o.months.length;
  const qMax = Math.max(Math.max.apply(null,o.stock), Math.max.apply(null,o.ships.map(s=>s.qty).concat([1])))*1.12;
  const mMax = Math.max(o.max+2, Math.max.apply(null,o.mos.concat([1]))+1);
  const x=i=>L+(pw/n)*(i+0.5);
  const yq=v=>T+ph-(v/qMax)*ph;
  const ym=v=>T+ph-(v/mMax)*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Supply plan graph">';
  // stock area
  let area='M'+L+','+(T+ph);
  o.stock.forEach((v,i)=> area+='L'+x(i)+','+yq(v));
  area+='L'+(L+pw)+','+(T+ph)+'Z';
  s+='<path d="'+area+'" fill="#D6D6D6" opacity=".85"/>';
  // shipment bars
  if(o.showShips!==false) o.ships.forEach(sh=>{
    const bw=Math.min(24,pw/n*0.55);
    s+='<rect x="'+(x(sh.i)-bw/2)+'" y="'+yq(sh.qty)+'" width="'+bw+'" height="'+(T+ph-yq(sh.qty))
      +'" fill="'+(SHIP_COL[sh.status]||'#999')+'"/>';
  });
  // min / max on months axis
  [[o.min,'Min MOS'],[o.max,'Max MOS']].forEach(d=>{
    s+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+ym(d[0])+'" y2="'+ym(d[0])
      +'" stroke="#43C3D8" stroke-width="1.6" stroke-dasharray="7 5"/>';
  });
  // consumption line
  let cd='';
  o.cons.forEach((v,i)=> cd+=(i?'L':'M')+x(i)+','+yq(v));
  s+='<path d="'+cd+'" fill="none" stroke="#BA0C2F" stroke-width="2.2"/>';
  o.actualTo!==undefined && o.cons.forEach((v,i)=>{ if(i<=o.actualTo)
    s+='<circle cx="'+x(i)+'" cy="'+yq(v)+'" r="3.2" fill="#BA0C2F"/>'; });
  // MOS line
  if(o.showMos!==false){
    let md='';
    o.mos.forEach((v,i)=> md+=(i?'L':'M')+x(i)+','+ym(v));
    s+='<path d="'+md+'" fill="none" stroke="#118B70" stroke-width="2.2"/>';
  }
  // expiry triangles
  (o.expired||[]).forEach(i=>{
    const px=x(i), py=yq(o.cons[i])-2;
    s+='<polygon points="'+px+','+(py-11)+' '+(px+8)+','+(py+3)+' '+(px-8)+','+(py+3)
      +'" fill="#F48521" stroke="#C25E0A" stroke-width="1"/>';
  });
  // selection
  if(o.sel!==undefined && o.sel!==null){
    s+='<rect x="'+(x(o.sel)-pw/n/2)+'" y="'+T+'" width="'+(pw/n)+'" height="'+ph
      +'" fill="rgba(0,47,108,.09)"/>';
  }
  // axes
  for(let k=0;k<=4;k++){ const v=qMax*k/4;
    s+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+yq(v)+'" y2="'+yq(v)+'" stroke="#EDEDED"/>';
    s+='<text class="axlabel" x="'+(L-6)+'" y="'+(yq(v)+4)+'" text-anchor="end">'+nf(v)+'</text>'; }
  for(let k=0;k<=4;k++){ const v=mMax*k/4;
    s+='<text class="axlabel" x="'+(L+pw+7)+'" y="'+(ym(v)+4)+'">'+(Math.round(v*10)/10)+'</text>'; }
  s+='<text class="axlabel" x="'+(L-40)+'" y="'+(T+ph/2)+'" transform="rotate(-90 '+(L-40)+' '+(T+ph/2)+')" text-anchor="middle">Quantity</text>';
  s+='<text class="axlabel" x="'+(L+pw+34)+'" y="'+(T+ph/2)+'" transform="rotate(90 '+(L+pw+34)+' '+(T+ph/2)+')" text-anchor="middle">Months of Stock</text>';
  o.months.forEach((m,i)=>{ if(i%2===0)
    s+='<text class="mlabel '+(o.sel===i?'sel':'')+'" x="'+x(i)+'" y="'+(H-26)+'" text-anchor="middle">'+m+'</text>'; });
  o.months.forEach((m,i)=>
    s+='<rect class="hitbox" data-pick="'+i+'" x="'+(x(i)-pw/n/2)+'" y="'+T+'" width="'+(pw/n)+'" height="'+ph+'"/>');
  return s+'</svg>';
}

const GD_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GD = (function(){
  const cons=[15900,16200,16000,16300,16100,16400,16200,16500,16300,16600,16400,16700];
  const ships=[{i:1,qty:95000,status:'received'},{i:4,qty:70000,status:'submitted'},
               {i:8,qty:60000,status:'planned'}];
  let bal=180000; const stock=[], mos=[];
  const amc = i => { let t=0,c=0; for(let k=i-3;k<=i+2;k++){ if(k<0||k>=12) continue; t+=cons[k]; c++; } return t/c; };
  for(let i=0;i<12;i++){
    const sh = ships.filter(s=>s.i===i).reduce((a,s)=>a+s.qty,0);
    bal = Math.max(0, bal + sh - cons[i]);
    stock.push(bal); mos.push(bal/amc(i));
  }
  return {cons, ships, stock, mos, min:4, max:7, expired:[10], actualTo:5};
})();
function QatGraphLab(){

    sel:sel, showMos:showMos, showShips:showShips});

    <div className="seg">

      <button data-on={showShips?'1':'0'} onClick={()=>setShowShips(!showShips)}>Shipments</button>

        <tr><td>Projected expired stock</td><td>{GD.expired.indexOf(sel)>-1? 'yes' : '—'}</td></tr>
        <tr><td>Ending balance</td><td>{nf(GD.stock[sel])}</td></tr>

    <p className="verdict">Hiding an element changes the display only. The underlying data and all calculations are unaffected.</p>

/* ============================ unmet demand calculator ============================ */
function UnmetLab(){
  const [actual,setActual] = useState(4000);
  const [out,setOut] = useState(6);
  const days = 30;
  const inStock = days - out;
  const rate = inStock>0 ? actual/inStock : null;
  const unmet = rate===null ? null : rate*out;
  const truth = unmet===null ? null : actual+unmet;
  return <div className="sandbox">
    <h3>Unmet demand calculator</h3>
    <p className="sub">The case QAT handles least visibly: a month where reported consumption is low because the shelf was empty, not because demand was low.</p>
    <div className="ctrl"><label><span>Reported consumption</span>
      <input type="range" min="500" max="12000" step="100" value={actual}
        onChange={e=>setActual(+e.target.value)} /><span className="val">{nf(actual)}</span></label></div>
    <div className="ctrl"><label><span>Days out of stock</span>
      <input type="range" min="0" max="29" value={out}
        onChange={e=>setOut(+e.target.value)} /><span className="val">{out} of 30</span></label></div>
    <div className="chain">
      <div className="step"><span>Days with stock available</span><b>{inStock}</b></div>
      <div className="step"><span>Consumption per available day</span><b>{rate===null?'—':nf(rate)}</b></div>
      <div className="step"><span>Unmet demand ({out} days x rate)</span><b>{unmet===null?'—':nf(unmet)}</b></div>
      <div className="step out"><span>True monthly demand</span><b>{truth===null?'—':nf(truth)}</b></div>
    </div>
    <div className="readout">
      <div><span>Understatement</span><b>{truth? Math.round((1-actual/truth)*100)+'%' : '—'}</b></div>

      <div><span>Used for AMC if uncorrected</span><b>{nf(actual)}</b></div>

/* ---------- classify: drag between zones, tap as fallback ---------- */
function Classify({ex, st, set, solved, finish}){
  const assign = st.assign || {};
  const [drag,setDrag] = useState(null);
  const zones = useRef({});
  const origin = useRef({x:0,y:0});
  const order = ex.buckets.map(b=>b.id);
  const pool = ex.items.map((it,i)=>i).filter(i=>assign[i]===undefined);

  function place(i, bucket){
    const a = Object.assign({}, assign);
    if(bucket===null || bucket===undefined) delete a[i]; else a[i]=bucket;
    set(Object.assign({}, st, {assign:a}));
  }
  function cycle(i){
    const cur = assign[i];
    const nxt = cur===undefined ? order[0]
      : (order.indexOf(cur)===order.length-1 ? null : order[order.indexOf(cur)+1]);
    place(i, nxt);
  }
  function zoneAt(x,y){
    let hit = null;
    Object.keys(zones.current).forEach(k=>{
      const el = zones.current[k];
      if(!el) return;
      const r = el.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) hit = k;
    });
    return hit;
  }

  useEffect(()=>{
    if(!drag) return;
    const move = e => {
      const x = e.clientX, y = e.clientY;
      const moved = drag.moved
        || Math.abs(x-origin.current.x) > 6 || Math.abs(y-origin.current.y) > 6;
      if(moved && e.cancelable) e.preventDefault();
      setDrag(d => d ? Object.assign({}, d, {x:x, y:y, moved:moved, over:zoneAt(x,y)}) : d);
    };
    const up = e => {
      if(drag.moved){
        const z = zoneAt(e.clientX, e.clientY);
        if(z==='__pool') place(drag.i, null);
        else if(z) place(drag.i, z);
      } else {
        cycle(drag.i);
      }
      setDrag(null);
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', ()=>setDrag(null));
    return ()=>{
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
  }, [drag]);

  const chip = (i, mark) => <button key={i} className="chip" data-mark={mark}
    data-dragging={(drag && drag.i===i && drag.moved) ? '1' : '0'}
    disabled={solved}
    onPointerDown={e=>{
      if(solved) return;
      origin.current = {x:e.clientX, y:e.clientY};
      setDrag({i:i, x:e.clientX, y:e.clientY, moved:false, over:null});
    }}
    onKeyDown={e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); cycle(i); } }}
    >{ex.items[i].text}</button>;

  return <div>
    <div className="pool" data-over={(drag && drag.moved && drag.over==='__pool') ? '1' : '0'}
      ref={el=>{ zones.current['__pool'] = el; }}>
      {pool.length? pool.map(i=>chip(i,null))
        : <span className="poolempty">{solved? '' : 'Everything is filed — drag a label back here to unfile it'}</span>}
    </div>
    <div className="buckets">{ex.buckets.map(b=>
      <div className="bucket" key={b.id}
        data-over={(drag && drag.moved && drag.over===b.id) ? '1' : '0'}
        ref={el=>{ zones.current[b.id] = el; }}>
        <h4>{b.label}</h4>
        {ex.items.map((it,i)=> assign[i]===b.id ?
          chip(i, solved ? (it.bucket===b.id?'right':'wrong') : null) : null)}
      </div>)}
    </div>
    {solved? null : <div className="actions">
      <button className="btn" disabled={pool.length>0}
        onClick={()=>finish(ex.items.every((it,i)=>assign[i]===it.bucket))}>Check</button>
      <span className="hintline">{pool.length
        ? 'Drag a label into a box, or tap it to move it along'
        : 'All filed'}</span>
    </div>}
    {(drag && drag.moved) ? <div className="floatchip"
      style={{left:drag.x+'px', top:drag.y+'px'}}>{ex.items[drag.i].text}</div> : null}
  </div>;
}

/* ---------- graded plan simulator ---------- */
function simRows(sc, nums){
  return project({opening:sc.opening, consumption:sc.consumption, shipments:nums,
    adjustments:null, min:sc.min, reorder:sc.reorder});
}
function simCheck(sc, nums){
  const rows = simRows(sc, nums), max = sc.min + sc.reorder;
  const out = [];
  sc.criteria.forEach(c=>{
    let ok = true, detail = '';
    if(c.k==='nostockout'){
      const bad = rows.map((r,i)=>({r,i})).filter(o=>o.r.close<=0 || o.r.unmet>0);
      ok = bad.length===0;
      if(!ok) detail = bad.map(o=>MO[o.i]).slice(0,4).join(', ');
    }
    if(c.k==='above-min'){
      const bad = rows.map((r,i)=>({r,i})).filter(o=>o.r.mos!==null && o.r.mos < sc.min-0.02);
      ok = bad.length===0;
      if(!ok) detail = bad.map(o=>MO[o.i]+' at '+o.r.mos.toFixed(1)).slice(0,4).join(', ');
    }
    if(c.k==='below-max'){
      const bad = rows.map((r,i)=>({r,i})).filter(o=>o.r.mos!==null && o.r.mos > max+0.02);
      ok = bad.length===0;
      if(!ok) detail = bad.map(o=>MO[o.i]+' at '+o.r.mos.toFixed(1)).slice(0,4).join(', ');
    }
    if(c.k==='maxtotal'){
      const tot = nums.reduce((a,b)=>a+b,0);
      ok = tot <= c.v;
      detail = nf(tot) + ' ordered';
    }
    if(c.k==='leadtime'){
      const bad = nums.map((q,i)=>({q,i})).filter(o=>o.q>0 && o.i < c.v);
      ok = bad.length===0;
      if(!ok) detail = bad.map(o=>MO[o.i]).join(', ') + ' inside the lead time';
    }
    if(c.k==='shipcount'){
      const n = nums.filter(q=>q>0).length;
      ok = n <= c.v;
      detail = n + (n===1? ' shipment' : ' shipments');
    }
    out.push({label:c.label, ok:ok, detail:detail});
  });
  return out;
}
function SimTask({ex, st, set, solved, finish}){
  const sc = ex.scenario;
  const seed = () => sc.start.map(v=> v? String(v) : '');
  const ships = st.sim || seed();
  const nums = ships.map(v=> v===''? 0 : (parseFloat(String(v).replace(/[, ]/g,''))||0));
  const rows = simRows(sc, nums);
  const max = sc.min + sc.reorder;
  const res = st.simres || null;
  const total = nums.reduce((a,b)=>a+b,0);

  const setShip = (i,v) => set(Object.assign({}, st, {sim: ships.map((x,j)=> j===i? v : x), simres:null}));
  const graphShips = nums.map((q,i)=>({i:i, qty:q, status:'planned'})).filter(o=>o.qty>0);

  function check(){
    const r = simCheck(sc, nums);
    const pass = r.every(c=>c.ok);
    set(Object.assign({}, st, {simres:r, status: pass?'right':'wrong', tries: st.tries + (pass?0:1)}));
  }
  function reveal(){
    set(Object.assign({}, st, {sim: sc.solution.map(v=> v? String(v):''),
      simres: simCheck(sc, sc.solution), status:'shown'}));
  }
  function reset(){ set(Object.assign({}, st, {sim:seed(), simres:null})); }

  return <div>
    <div className="task">
      <p className="taskgoal">{sc.goal}</p>
      <ul className="taskcrit">{sc.criteria.map((c,i)=>{
        const r = res? res[i] : null;
        return <li key={i} data-ok={r? (r.ok?'1':'0') : ''}>
          <span className="tick">{r? (r.ok? '\u2713' : '\u2715') : '\u2022'}</span>
          <span>{c.label}{r && !r.ok && r.detail? ' — ' + r.detail : ''}</span></li>;
      })}</ul>
      <p className="tasksetup">Opening stock {nf(sc.opening)}. Minimum {sc.min} months,
        reorder interval {sc.reorder}, so maximum {max}. Consumption is the forecast and cannot be edited.</p>
    </div>
    <Chart opts={{values:rows.map(r=> r.mos===null?0:r.mos), min:sc.min, max:max, top:Math.max(10,max+3)}}/>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Opening</th><th>Shipment</th><th>Consumption</th>
        <th>Ending</th><th>MOS</th></tr></thead>
      <tbody>{rows.map((r,i)=>{
        const stt = statusOf(r.mos, sc.min, max);
        return <tr key={i} data-s={stt}>
          <td>{r.month}</td><td>{nf(r.open)}</td>
          <td><input className="ship" type="text" inputMode="numeric" value={ships[i]}
            placeholder="&mdash;" disabled={solved}
            aria-label={'Shipment for '+r.month}
            onChange={e=>setShip(i, e.target.value)} /></td>
          <td>{nf(r.consumption)}</td>
          <td>{nf(r.close)}{r.unmet>0? <span style={{color:'var(--out)'}}> ({nf(r.unmet)} unmet)</span> : null}</td>
          <td>{r.mos===null? '\u2014' : <span className="mos" data-s={stt}>{r.mos.toFixed(1)}</span>}</td>
        </tr>;
      })}</tbody>
    </table>
    <div className="readout">
      <div><span>Total ordered</span><b>{nf(total)}</b></div>
      <div><span>Shipments</span><b>{nums.filter(q=>q>0).length}</b></div>
      <div><span>Months below min</span><b>{rows.filter(r=>r.mos!==null&&r.mos>0&&r.mos<sc.min).length}</b></div>
      <div><span>Months stocked out</span><b>{rows.filter(r=>r.close<=0).length}</b></div>
    </div>
    {solved? null : <div className="actions">
      <button className="btn" onClick={check}>Check my plan</button>
      <button className="btn ghost" onClick={reset}>Reset</button>
      {st.tries>=2? <button className="btn ghost sm" onClick={reveal}>Show a working plan</button> : null}
    </div>}
  </div>;
}

function Exercise({ex, st, set, idx, total}){
  const solved = st.status==='right' || st.status==='shown';
  const finish = ok => set(Object.assign({}, st, {status: ok?'right':'wrong', tries: st.tries + (ok?0:1)}));
  const [draft,setDraft] = useState(st.draft||'');

  let body = null;

  if(ex.type==='mcq' || ex.type==='multi'){
    const chosen = st.pick;
    body = <div className="opts">{ex.options.map((o,i)=>{
      let mark=null;
      if(solved && i===ex.answer) mark='right';
      else if(st.status!=='open' && i===chosen) mark='wrong';
      return <button key={i} className="opt" data-mark={mark} disabled={solved}
        onClick={()=>{ set(Object.assign({}, st, {pick:i, status: i===ex.answer?'right':'wrong', tries: st.tries + (i===ex.answer?0:1)})); }}>{o}</button>;
    })}</div>;
  }

  if(ex.type==='num'){
    body = <div className="numrow">
      <input type="text" inputMode="decimal" value={solved? (st.pick||'') : draft} disabled={solved}
        placeholder="0" aria-label="Your answer"
        onChange={e=>setDraft(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter') check(); }} />
      <span className="unit">{ex.unit}</span>
      {solved?null:<button className="btn" onClick={()=>check()}>Check answer</button>}
    </div>;
  }
  function check(){
    const raw = String(draft).replace(/[, %]/g,'');
    const v = parseFloat(raw);
    const ok = !isNaN(v) && Math.abs(v-ex.answer) <= (ex.tol||0);
    set(Object.assign({}, st, {pick:draft, draft:draft, status: ok?'right':'wrong', tries: st.tries + (ok?0:1)}));
  }

  if(ex.type==='seq'){
    const seq = st.seq||[];
    body = <div>
      <div className="opts" style={{marginBottom:'14px'}}>{ex.items.map((it,i)=>{
        const pos = seq.indexOf(i);
        let mark=null; if(solved) mark='right'; else if(pos>-1) mark='chosen';
        return <button key={i} className="opt" data-mark={mark} disabled={solved}
          onClick={()=>{ const s = seq.includes(i)? seq.filter(x=>x!==i) : seq.concat([i]);
                         set(Object.assign({}, st, {seq:s})); }}>
          <span className="seqrow">
            <span className={'badge '+((pos>-1||solved)?'set':'')}>{solved? (ex.order.indexOf(i)+1) : (pos>-1?pos+1:'')}</span>
            <span>{it}</span>
          </span></button>;
      })}</div>
      {solved?null:<div className="actions" style={{marginTop:0}}>
        <button className="btn" disabled={seq.length<ex.items.length}
          onClick={()=>finish(seq.length===ex.order.length && seq.every((v,i)=>v===ex.order[i]))}>Check order</button>
        <button className="btn ghost" onClick={()=>set(Object.assign({}, st, {seq:[]}))}>Clear</button>
      </div>}
    </div>;
  }

  if(ex.type==='pick'){
    body = <div>
      <Chart opts={{values:ex.values, months:ex.months, min:ex.min, max:ex.max,
        selected: solved?null:st.pick, reveal: solved?ex.answer:null, pickable:!solved}}
        onPick={i=>{ if(!solved) set(Object.assign({}, st, {pick:i})); }} />
      {solved?null:<div className="actions" style={{marginTop:0}}>
        <button className="btn" disabled={st.pick===null||st.pick===undefined}
          onClick={()=>finish(st.pick===ex.answer)}>Check answer</button>
        <span className="hintline">{(st.pick===null||st.pick===undefined)?'Tap a month on the chart':'Selected: '+(ex.months||MO)[st.pick]}</span>
      </div>}
    </div>;
  }

  if(ex.type==='classify'){
    body = <Classify ex={ex} st={st} set={set} solved={solved} finish={finish} />;
  }

  if(ex.type==='sim'){
    body = <SimTask ex={ex} st={st} set={set} solved={solved} finish={finish} />;
  }

  if(ex.type==='plan'){
    const vals = st.vals||{};
    let open = ex.opening, answers=[];
    ex.rows.forEach(r=>{ const close = open + r.ship - r.cons; answers.push(close); open = close; });
    body = <div>
      <table className="plantable">
        <thead><tr><th>Month</th><th>Opening</th><th>Shipments</th><th>Consumption</th><th>Ending balance</th></tr></thead>
        <tbody>{ex.rows.map((r,i)=>{
          const openShown = i===0 ? ex.opening : (solved ? answers[i-1] : null);
          return <tr key={i}>
            <td>{r.m}</td>
            <td>{openShown===null? '—' : nf(openShown)}</td>
            <td>{r.ship? nf(r.ship) : '—'}</td>
            <td>{nf(r.cons)}</td>
            <td>{solved ? nf(answers[i]) :
              <input type="text" inputMode="numeric" value={vals[i]||''} placeholder="?"
                onChange={e=>{ const v=Object.assign({},vals); v[i]=e.target.value;
                               set(Object.assign({}, st, {vals:v})); }} />}</td>
          </tr>;
        })}</tbody>
      </table>
      {solved?null:<div className="actions">
        <button className="btn"
          disabled={ex.rows.some((r,i)=>!vals[i])}
          onClick={()=>finish(answers.every((a,i)=> Math.abs(parseFloat(String(vals[i]).replace(/[, ]/g,''))-a) < 1 ))}>
          Check the column</button>
        <span className="hintline">Each ending balance carries into the next month</span>
      </div>}
    </div>;
  }

  const showReveal = st.status==='wrong' && st.tries>=2 && !solved;

  return <section className="ex">
    <p className="ex-tag"><i>{ex.tag}</i>
      {total>1? <span className="exnum">Question {idx+1} of {total}</span> : null}</p>
    <p className="ex-q">{ex.q}</p>
    {ex.img? <div style={{margin:'0 0 16px'}}><Shot src={IMG[ex.img]} alt="Supply plan graph for this question"/></div> : null}
    {body}
    {st.status==='wrong' ? <div className="feedback" data-tone="wrong" role="status" aria-live="polite">
      <b>Not right yet.</b>{ex.hint || 'Have another look at the section above, then try again.'}</div> : null}
    {solved ? <div className="feedback" data-tone="right" role="status" aria-live="polite">
      <b>{st.status==='right'?'Correct.':'Here it is.'}</b>{ex.explain}</div> : null}
    {showReveal ? <div className="actions">
      <button className="btn ghost sm" onClick={()=>set(Object.assign({}, st, {status:'shown'}))}>Show me the answer</button>
    </div> : null}
  </section>;
}

/* ============================ error boundary ============================ */
class Boundary extends React.Component{
  constructor(props){ super(props); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err:err}; }
  componentDidCatch(err, info){ if(window.console) console.error('Lesson render failed:', err, info); }
  componentDidUpdate(prev){ if(prev.resetKey !== this.props.resetKey && this.state.err) this.setState({err:null}); }
  render(){
    if(this.state.err) return <div className="note" style={{maxWidth:'660px'}}>
      <b>This section failed to load</b>
      Something in this lesson threw an error, so it has been skipped rather than taking the whole
      page down. The rest of the course still works — use the sidebar to move on, and the browser
      console has the details if you want to report it.
      <div style={{marginTop:'14px'}}>
        <button className="btn ghost sm" onClick={()=>this.setState({err:null})}>Try again</button>
      </div>
    </div>;
    return this.props.children;
  }
}
