<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAT eLearning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
:root{
  --navy:#002F6C; --tint:#b3d4ff; --tint-soft:#e2eefc;
  --paper:#F4F7FB; --card:#FFFFFF;
  --ink:#002F6C; --ink2:#3F5F8A; --ink3:#8199B8;
  --rule:#CFDCEC; --rule2:#E6EEF8;
  --under:#F48521; --low:#EDB944; --ok:#118B70; --over:#EDB944; --out:#BA0C2F;
  --error:#BA0C2F; --na:#BFBFBF;
  --sans:"Gill Sans","Gill Sans MT","Gill Sans Nova",Cabin,Calibri,"Trebuchet MS",sans-serif;
  --serif:"Gill Sans","Gill Sans MT","Gill Sans Nova",Cabin,Calibri,"Trebuchet MS",sans-serif;
  --shadow:0 1px 2px rgba(0,47,108,.05), 0 6px 18px -8px rgba(0,47,108,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
input[type=range]{accent-color:var(--navy)}
input[type=checkbox]{accent-color:var(--navy)}
.shell{max-width:1320px;margin:0 auto;padding:0 28px 100px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);padding:0}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:13px 28px 12px}
.wordmark{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:24px;color:#fff}
.wordmark span{color:var(--tint);font-weight:500;margin-left:2px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{font-size:13.5px;font-weight:600;border:0;background:rgba(255,255,255,.1);color:var(--tint);padding:7px 15px;border-radius:999px;transition:background .15s,color .15s}
.tab:hover{background:rgba(255,255,255,.2);color:#fff}
.tab[data-on="1"]{background:#fff;color:var(--navy)}
.meterwrap{background:var(--navy)}
.meter{height:4px;background:rgba(255,255,255,.22)}
.meter i{display:block;height:100%;background:var(--tint);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- layout ---------- */
.grid{display:grid;gap:34px;margin-top:34px}
@media(min-width:900px){.grid{grid-template-columns:240px minmax(0,1fr);gap:60px}}
@media(min-width:1500px){.grid{grid-template-columns:260px minmax(0,1fr);gap:76px}}

/* ---------- sidebar ---------- */
.rail{font-family:var(--sans);font-size:14px}
@media(min-width:900px){.rail{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto}}
.railgroup{margin-bottom:24px}
.railtitle{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.railtitle b{color:var(--ink2);font-weight:700}
.railitems{list-style:none;margin:0;padding:0}
.railitems li{position:relative;padding-left:24px}
.railitems li::before{content:"";position:absolute;left:5px;top:20px;bottom:-2px;width:1.5px;background:var(--rule)}
.railitems li:last-child::before{display:none}
.railitems li[data-state="done"]::before{background:var(--ok);opacity:.4}
.dot{position:absolute;left:0;top:12px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid var(--rule);transition:all .18s}
li[data-state="done"] .dot{background:var(--ok);border-color:var(--ok)}
li[data-state="now"] .dot{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 4px var(--tint)}
.node{background:none;border:0;padding:5px 0 9px;text-align:left;color:var(--ink3);font:inherit;width:100%;line-height:1.35;transition:color .15s}
.node:hover{color:var(--ink2)}
li[data-state="done"] .node{color:var(--ink2)}
li[data-state="now"] .node{color:var(--ink);font-weight:600}
.mins{display:block;font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:2px}

/* ---------- lesson prose ---------- */
.kicker{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6C6364;margin:0 0 9px}
h1{font-family:var(--sans);font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:0 0 20px;font-size:34px;color:var(--navy)}
h2{font-family:var(--sans);font-weight:600;letter-spacing:-.015em;font-size:20px;margin:36px 0 10px;color:var(--navy)}
p{margin:0 0 16px;max-width:68ch}
.lede{font-size:20px;color:var(--ink2);line-height:1.5}
.blist{max-width:68ch;margin:0 0 16px;padding-left:22px}
.blist li{margin-bottom:8px}
.blist li::marker{color:var(--over)}
.defn{border-left:3px solid var(--navy);padding:3px 0 3px 17px;margin:22px 0;max-width:68ch}
.defn b{font-family:var(--sans);font-size:15px;display:block;margin-bottom:3px}
.note{background:var(--tint-soft);border:1px solid var(--tint);border-radius:10px;padding:15px 18px;margin:22px 0;max-width:68ch;font-size:16.5px}
.note b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--navy)}
.eq{font-family:var(--sans);font-weight:600;font-size:16px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--over);border-radius:8px;padding:14px 18px;margin:20px 0;max-width:68ch;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.eq small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px;margin-top:7px;line-height:1.45}
table{border-collapse:collapse;font-family:var(--sans);font-size:14.5px;margin:20px 0;font-variant-numeric:tabular-nums;width:100%;max-width:880px}
th,td{padding:9px 14px 9px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule2)}
th{font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);border-bottom:1.5px solid var(--rule);padding-top:0}
tbody tr:last-child td{border-bottom:1px solid var(--rule)}
.fig{margin:24px 0;max-width:100%}
.fig figcaption{font-family:var(--serif);font-size:16px;color:var(--ink2);margin-top:12px;line-height:1.5;max-width:68ch}
svg{display:block;width:100%;height:auto}

/* ---------- exercises ---------- */
.ex{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:24px;margin:28px 0 0;max-width:880px;box-shadow:var(--shadow)}
.ex-tag{margin:0 0 12px;display:flex;gap:8px;align-items:center}
.ex-tag i{font-style:normal;background:var(--tint-soft);border:1px solid var(--tint);color:var(--navy);border-radius:999px;padding:3px 11px;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ex-q{font-family:var(--sans);font-size:16.5px;font-weight:500;line-height:1.5;margin:0 0 18px;color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font-size:15.5px;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:9px;padding:12px 15px;color:var(--ink);line-height:1.42;transition:border-color .13s,background .13s,transform .13s;font-family:var(--sans)}
.opt:hover:not(:disabled){border-color:var(--over);background:var(--tint-soft)}
.opt[data-mark="right"]{border-color:var(--ok);background:rgba(17,139,112,.10);font-weight:600}
.opt[data-mark="wrong"]{border-color:var(--error);background:rgba(186,12,47,.06)}
.opt[data-mark="chosen"]{border-color:var(--navy);background:var(--tint-soft)}
.opt:disabled{cursor:default}
.seqrow{display:flex;gap:13px;align-items:flex-start}
.badge{font-family:var(--sans);font-weight:700;font-size:13px;min-width:22px;height:22px;border-radius:6px;background:var(--rule);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:0}
.badge.set{background:var(--navy);color:#fff}
.numrow{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
input[type=text]{font-size:16px;font-variant-numeric:tabular-nums;padding:10px 12px;width:146px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--navy);background:#fff}
.unit{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.btn{font-size:15px;font-weight:600;padding:11px 22px;border-radius:9px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:#00214d}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--rule);font-weight:500}
.btn.ghost:hover{border-color:var(--navy);background:var(--tint-soft)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{background:var(--navy)}
.btn.ghost:disabled:hover{background:transparent}
.feedback{font-family:var(--sans);font-size:15px;line-height:1.55;margin-top:18px;padding:2px 0 2px 15px;border-left:3px solid var(--rule)}
.feedback[data-tone="right"]{border-color:var(--ok)}
.feedback[data-tone="wrong"]{border-color:var(--low)}
.feedback b{display:block;margin-bottom:4px}
.actions{display:flex;gap:11px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hintline{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.foot{display:flex;gap:12px;margin-top:40px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:24px}

/* ---------- classify ---------- */
.buckets{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:620px){.buckets{grid-template-columns:1fr 1fr}}
.bucket{border:1.5px dashed var(--rule);border-radius:10px;padding:13px;min-height:82px;background:var(--paper)}
.bucket h4{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--ink2)}
.chip{font-family:var(--sans);font-size:13.5px;font-weight:500;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 13px;margin:0 6px 7px 0;color:var(--ink);transition:all .13s}
.chip:hover:not(:disabled){border-color:var(--over)}
.chip[data-mark="right"]{border-color:var(--ok);background:rgba(17,139,112,.11)}
.chip[data-mark="wrong"]{border-color:var(--error);background:rgba(186,12,47,.07)}
.pool{margin-bottom:14px}

/* ---------- data tables ---------- */
.plantable{font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums;width:100%;max-width:100%;border-collapse:collapse}
.plantable th{font-size:10.5px;text-align:right;padding:0 9px 7px;border-bottom:1.5px solid var(--rule);color:var(--navy);letter-spacing:.05em;text-transform:uppercase}
.plantable th:first-child{text-align:left}
.plantable td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--rule2)}
.plantable td:first-child{text-align:left;color:var(--ink2);font-size:13.5px;font-weight:500}
.plantable input{width:94px;text-align:right;padding:5px 8px;font-size:14px;border-radius:6px}
.mos{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:700;font-size:13.5px}
.mos[data-s="under"]{background:rgba(244,133,33,.18);color:#A2510C}
.mos[data-s="ok"]{background:rgba(17,139,112,.14);color:#0B6152}
.mos[data-s="over"]{background:rgba(237,185,68,.28);color:#7D5E08}
.mos[data-s="out"]{background:var(--out);color:#fff}

/* ---------- widgets ---------- */
.sandbox{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--navy);border-radius:4px 4px 13px 13px;padding:22px;margin:28px 0;max-width:880px;box-shadow:var(--shadow)}
.sandbox h3{font-family:var(--sans);font-size:16.5px;margin:0 0 5px;color:var(--navy);letter-spacing:-.01em}
.sandbox .sub{font-family:var(--sans);font-size:13.5px;color:var(--ink2);margin:0 0 18px;line-height:1.5;max-width:66ch}
.ctrl{font-family:var(--sans);font-size:14px;margin-bottom:13px}
.ctrl label{display:flex;gap:12px;align-items:center;justify-content:space-between}
.ctrl label>span:first-child{color:var(--ink2);flex:0 0 auto}
.ctrl input[type=range]{flex:1;min-width:90px}
.ctrl .val{min-width:66px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);flex:none}
.toggles{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.toggles label{display:flex;gap:10px;align-items:flex-start;font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--ink2)}
.toggles input{margin-top:3px}
.readout{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--sans);margin-top:18px;border-top:1px solid var(--rule2);padding-top:14px}
.readout div span{display:block;color:var(--ink3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.readout div b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.months{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}
.mcell{font-family:var(--sans);font-size:11px;border:1.5px solid var(--rule);border-radius:7px;padding:6px 7px;min-width:62px;text-align:center;background:var(--paper);color:var(--ink3);transition:all .15s}
.mcell b{display:block;font-size:13.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.mcell[data-in="1"]{border-color:var(--over);background:var(--tint-soft)}
.mcell[data-in="1"] b{color:var(--navy)}
.mcell[data-null="1"] b{color:var(--error)}
.mcell[data-now="1"]{box-shadow:0 0 0 2px var(--navy)}
.mtoggle{cursor:pointer}
.mcell[data-off="1"]{opacity:.4;text-decoration:line-through}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
.mbox{border:1.5px solid var(--rule);border-radius:10px;padding:14px;font-family:var(--sans)}
.mbox h5{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.mbox .row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums;font-weight:600}
.mbox .row span{color:var(--ink3);font-weight:400}
.mbox[data-win="1"]{border-color:var(--ok);background:rgba(17,139,112,.06)}
.verdict{font-family:var(--sans);font-size:14px;color:var(--ink2);margin-top:16px;border-top:1px solid var(--rule2);padding-top:14px;line-height:1.5;max-width:70ch}
.chain{font-family:var(--sans);font-size:14px;margin:18px 0;border-top:1.5px solid var(--rule)}
.chain .step{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.chain .step span{color:var(--ink2)}
.chain .step b{font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;color:var(--navy)}
.chain .step.out{background:var(--tint-soft);margin:0 -10px;padding:11px 10px;border-radius:8px;border-bottom:0}
.chain .step.out b{font-size:21px}
.seg{display:flex;gap:7px;margin:6px 0 16px;flex-wrap:wrap}
.seg button{font-family:var(--sans);font-size:13.5px;font-weight:500;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink2);border-radius:8px;padding:8px 14px;transition:all .14s}
.seg button:hover{border-color:var(--over)}
.seg button[data-on="1"]{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.tinylabel{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:18px 0 4px}
.plantable input.ship{border-color:var(--over);background:#fff}
.plantable tr[data-s="under"] td{background:rgba(244,133,33,.08)}
.plantable tr[data-s="out"] td{background:rgba(186,12,47,.08)}
.plantable tr[data-s="over"] td{background:rgba(237,185,68,.14)}
.timeline{display:flex;margin:18px 0;border-radius:8px;overflow:hidden;font-family:var(--sans);font-size:11px;font-weight:600;min-height:38px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:4px 2px;line-height:1.2}

.shot{border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#fff;max-width:100%}
.shot img{width:100%;display:block}

@media(max-width:640px){
  table, .plantable{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .metrics{grid-template-columns:1fr}
  .readout{gap:18px}
  .ctrl label{flex-wrap:wrap}
  .ctrl label>span:first-child{flex:1 0 100%}
}

.chip{touch-action:none;-webkit-user-select:none;user-select:none}
.chip[data-dragging="1"]{opacity:.35}
.pool{min-height:46px;border:1.5px dashed transparent;border-radius:10px;padding:7px 7px 1px;
  margin-bottom:14px;transition:border-color .13s,background .13s}
.pool[data-over="1"]{border-color:var(--navy);background:var(--tint-soft)}
.poolempty{font-family:var(--sans);font-size:13px;color:var(--ink3)}
.bucket{transition:border-color .13s,background .13s}
.bucket[data-over="1"]{border-color:var(--navy);border-style:solid;background:var(--tint-soft)}
.floatchip{position:fixed;z-index:130;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--sans);font-size:13.5px;font-weight:500;background:var(--navy);color:#fff;
  border-radius:999px;padding:7px 14px;box-shadow:0 8px 20px -4px rgba(0,47,108,.45)}

/* ---------- screenshot lightbox ---------- */
button.shot{padding:0;border:1px solid var(--rule);cursor:zoom-in;display:block;width:100%;text-align:left}
button.shot:hover{border-color:var(--over)}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,18,42,.9);display:flex;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;width:auto;border-radius:8px;background:#fff}
.lbclose{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;background:rgba(255,255,255,.14);
  color:#fff;border:0;border-radius:8px;width:42px;height:42px}
.lbclose:hover{background:rgba(255,255,255,.28)}
.lbhint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--tint);
  font-family:var(--sans);font-size:12.5px}
.skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--navy);font-family:var(--sans);
  font-size:14px;font-weight:600;padding:10px 16px;border-radius:0 0 8px 0;z-index:200}
.skip:focus{left:0}
.exnum{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);margin-left:auto}

@media print{
  .top,.rail,.tabs,.foot,.skip,.actions,.seg,.ctrl input[type=range],.lightbox{display:none!important}
  body{background:#fff;font-size:11pt}
  .grid{display:block}
  .ex,.sandbox,.note,.eq,.tcard{break-inside:avoid;box-shadow:none}
  h1{font-size:20pt}h2{font-size:14pt}
  a[href]:after{content:""}
  .screen-only{display:none!important}
  .cert{border-color:#000;break-inside:avoid;margin:0;max-width:100%}
  .cert-rule{background:#000}
  .cert-name,.cert-course,.cert-score{color:#000}
  @page{margin:14mm}
}

/* ---------- glossary ---------- */
.gsearch{width:100%;max-width:440px;font-size:16px;padding:12px 16px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card)}
.gsearch:focus{outline:none;border-color:var(--navy)}
.gitem{border-bottom:1px solid var(--rule2);padding:17px 0;max-width:76ch}
.gitem h3{font-family:var(--sans);font-size:15.5px;margin:0 0 5px;color:var(--navy)}
.gitem p{font-size:17px;margin:0;color:var(--ink2)}
.gcount{font-family:var(--sans);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:18px 0 4px}

/* ---------- chart text ---------- */
.mlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.mlabel.sel{fill:var(--navy);font-weight:700}
.axlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.bandlabel{font-family:var(--sans);font-size:10.5px;font-weight:700}
.hitbox{fill:transparent;cursor:pointer}

/* ---------- home + results ---------- */
.hero h1{font-size:clamp(34px,6vw,54px);max-width:17ch;margin-bottom:22px}
.score{font-family:var(--sans);font-size:68px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:0;color:var(--navy)}

.tcard{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--navy);border-radius:4px 4px 13px 13px;padding:20px;text-align:left;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}

/* ---------- footer logos ---------- */
.pagefoot{max-width:1320px;margin:64px auto 0;padding:26px 28px 14px;border-top:1px solid var(--rule);
  display:flex;gap:48px;align-items:center;justify-content:center;flex-wrap:wrap}

.draw{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw 1.6s .2s ease forwards}

.task{background:var(--tint-soft);border:1px solid var(--tint);border-radius:10px;padding:16px 18px;margin:0 0 18px}
.taskgoal{font-family:var(--sans);font-size:16px;font-weight:600;color:var(--navy);margin:0 0 12px;max-width:68ch}

<script type="text/babel" data-presets="react">
const {useState, useMemo, useRef, useEffect} = React;

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nf = n => Math.round(n).toLocaleString('en-US');

/* ============================ chart builder ============================ */
function chartSVG(o){
  const v=o.values, months=o.months||MO;
  const W=660,H=240,L=36,R=12,T=16,B=30;
  const pw=W-L-R, ph=H-T-B, top=o.top||Math.max(o.max+3, Math.ceil(Math.max.apply(null,v))+1);
  const x=i=>L+(pw/(v.length-1))*i;
  const y=m=>T+ph-(Math.max(0,Math.min(top,m))/top)*ph;
  const col=m=>m<0.05?'var(--out)':(m<o.min?'var(--under)':(m>o.max?'var(--over)':'var(--ok)'));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Months of stock by month">';
  s+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+(y(o.max)-T)+'" fill="rgba(237,185,68,.14)"/>';
  s+='<rect x="'+L+'" y="'+y(o.min)+'" width="'+pw+'" height="'+(T+ph-y(o.min))+'" fill="rgba(244,133,33,.10)"/>';
  [[o.min,'min','var(--under)'],[o.max,'max','var(--over)']].forEach(function(d){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(d[0])+'" y2="'+y(d[0])+'" stroke="'+d[2]+'" stroke-width="1" stroke-dasharray="4 3"/>';
    s+='<text class="bandlabel" x="'+(L+4)+'" y="'+(y(d[0])-5)+'" fill="'+d[2]+'">'+d[1]+' '+d[0]+' MOS</text>';
  });
  for(let k=0;k<=5;k++){const m=top*k/5;
    s+='<text class="axlabel" x="'+(L-7)+'" y="'+(y(m)+4)+'" text-anchor="end">'+(Math.round(m*10)/10)+'</text>';}
  s+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--rule)"/>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="var(--rule)"/>';
  const path=v.map((m,i)=>(i?'L':'M')+x(i)+','+y(m)).join(' ');
  if(o.ghost){
    const gp=o.ghost.map((m,i)=>(i?'L':'M')+x(i)+','+y(m)).join(' ');
    s+='<path d="'+gp+'" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".65"/>';
  }
  s+='<path d="'+path+'" fill="none" stroke="var(--ink)" stroke-width="2.25" stroke-linejoin="round" class="'+(o.animate?'draw':'')+'"/>';
  const bw=pw/(v.length-1);
  v.forEach(function(m,i){
    const sel=o.selected===i, ans=o.reveal===i;
    if(o.pickable) s+='<rect x="'+(x(i)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+ph+'" fill="'+((sel||ans)?'rgba(20,49,44,.08)':'transparent')+'"/>';
    s+='<circle cx="'+x(i)+'" cy="'+y(m)+'" r="'+((sel||ans)?5.5:3.5)+'" fill="'+(ans?'var(--ok)':(sel?'var(--ink)':col(m)))+'" stroke="var(--card)" stroke-width="1.5"/>';
    s+='<text class="mlabel '+((sel||ans)?'sel':'')+'" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+months[i]+'</text>';
    if(o.pickable) s+='<rect class="hitbox" data-pick="'+i+'" x="'+(x(i)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+ph+'"/>';
  });
  return s+'</svg>';
}

/* ============================ QAT calculation engine ============================ */
// AMC per QAT default: mean of the 3 previous months, the current month, and 2 future
// months of consumption. Missing months are null (excluded), not zero.
function amcAt(consumption, i, back, fwd){
  back = back===undefined?3:back; fwd = fwd===undefined?2:fwd;
  let sum=0,n=0;
  for(let k=i-back;k<=i+fwd;k++){
    if(k<0||k>=consumption.length) continue;
    const c=consumption[k];
    if(c===null||c===undefined) continue;
    sum+=c;n++;
  }
  return n? sum/n : null;
}

// Month-by-month projection. Stock never goes negative; the shortfall is unmet demand.
function project(opts){
  const {opening, consumption, shipments, adjustments, min, reorder} = opts;
  const max = min + reorder;
  const rows=[]; let bal=opening;
  for(let i=0;i<consumption.length;i++){
    const open=bal;
    const ship=(shipments[i]||0);
    const adj=(adjustments&&adjustments[i])||0;
    const demand=consumption[i]||0;
    let available=open+ship+adj;
    let consumed=Math.min(demand,Math.max(0,available));
    let unmet=Math.max(0,demand-Math.max(0,available));
    bal=Math.max(0,available-consumed);
    const amc=amcAt(consumption,i);
    rows.push({month:MO[i%12],open,ship,adj,consumption:demand,consumed,unmet,close:bal,
      amc, mos: (amc&&amc>0)? bal/amc : null, min, max});
  }
  return rows;
}
function statusOf(mos,min,max){
  if(mos===null) return 'na';
  if(mos<0.05) return 'out';
  if(mos<min) return 'under';
  if(mos>max) return 'over';
  return 'ok';
}

 id:'in1', title:'General overview: QAT, roles and terms', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'QAT is the Quantification Analytics Tool: a cloud-based system for country-led forecasting and supply planning, used for any health commodity. It replaced Quantimed for forecasting and PipeLine for supply planning. The supply planning module went live in December 2020 and the forecasting module in June 2022.'},
  {t:'p',c:'This course is written for the Reports Viewer role. It does not require entering or changing any data.'},
  {t:'h',c:'The three user roles'},
  {t:'table',head:['Functionality','Program Admin','Program User','Reports Viewer'],rows:[
   ['Edit program settings — display name, lead times, budgets','Yes','No','No'],
   ['Edit transactional detail — consumption, inventory, shipments','Yes','Yes','No'],
   ['View reports — consumption, inventory, shipments, stock status','Yes','Yes','Yes'],
   ['Raise tickets — report bugs, make suggestions and requests','Yes','Yes','Yes']
  ]},
  {t:'p',c:'Supply planners hold the first two roles. The Reports Viewer role is intended for stakeholders who need visibility rather than editing access: ministry management, directors, donors, partners, procurement agents and regional advisors.'},
  {t:'note',b:'Server versions only',c:'Reports Viewers see server programs, not downloaded ones. A supply planner can work offline against a copy held on their own machine. What a viewer sees is always the most recent version uploaded to the server.'},
  {t:'h',c:'Concepts and terms'},
  {t:'table',head:['Term','Description'],rows:[
   ['Program','A supply plan, defined by one country, one technical area such as ARV or malaria, one organisation such as the MOH, and one region'],
   ['Technical area','The commodity group — ARV, malaria, lab, condoms, family planning'],
   ['Planning unit','A product, described up to its primary packaging — Abacavir 300 mg tablet, 60 tablets'],
   ['Forecasting unit','The base unit beneath the planning unit — Abacavir 300 mg tablet. Some reports can be displayed in either'],
   ['Equivalency unit','A shared unit that allows related but different products to be aggregated — malaria treatments, patient-months'],
   ['Version','A numbered, dated snapshot of a program, created each time a supply planner uploads']
  ]},
  {t:'h',c:'Questions QAT is designed to answer'},
  {t:'p',c:'Are stockouts forecast in the next 18 months? Are any products at risk of expiry? Which funders and procurement agents are involved? Are there gaps in funding? How accurate has the forecast been? If planned shipments do not arrive, what happens to inventory? When was this supply plan last updated?'}
 ],

{
 id:'in2', title:'FASP basics', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'FASP stands for Forecasting and Supply Planning. Together the two make up quantification: estimating how much of a product will be needed, then determining how much should be ordered and when it should arrive.'},
  {t:'table',head:['Step','Question it answers'],rows:[
   ['Forecasting','How much of this product will be needed over the coming period?'],
   ['Supply planning','Given what is in stock and already on order, how much should be ordered, and when must it arrive?']
  ]},
  {t:'p',c:'A forecast on its own does not produce an order. The supply plan takes the forecast as demand, sets it against stock on hand and shipments already in the pipeline, and works the numbers forward month by month across the planning horizon.'},
  {t:'h',c:'How a supply plan is built'},
  {t:'p',c:'Four kinds of record drive every figure in a supply plan: consumption, shipments, inventory, and adjustments. From these, QAT closes out each month and carries the balance into the next.'},
  {t:'eq',c:'Opening balance − consumption + shipments ± adjustments − expiries = ending balance',
   note:'Each month\u2019s ending balance becomes the following month\u2019s opening balance, which is why a single incorrect figure affects every month that follows it.'},
  {t:'h',c:'The measures used throughout the reports'},
  {t:'table',head:['Measure','Definition','Why it matters'],rows:[
   ['AMC','Average monthly consumption, averaged across a number of past and future months set per product','The rate at which a product moves. It is the denominator beneath almost every other figure'],
   ['Months of stock (MOS)','Ending balance divided by AMC','Converts quantities into time, which allows products of very different volumes to be compared on one screen'],
   ['Minimum','The lowest acceptable months of stock, covering lead time plus safety stock','Below this level there is a risk of stocking out before the next delivery arrives'],
   ['Maximum','Minimum plus the reorder interval','Above this level there is a risk of expiry and of capital being tied up in stock'],
   ['Lead time','The time from confirming an order to the stock being usable in country','Determines how far in advance an order must be placed']
  ]},
  {t:'p',c:'Stock status is the comparison of months of stock against the minimum and maximum. It is the basis of the colour coding used across QAT reports, and understanding it is the single most useful preparation for reading them.'},
  {t:'note',b:'Why months of stock rather than quantity',c:'A quantity on its own carries no judgement. Twenty thousand packs may represent a shortage for a fast-moving product and several years of cover for a slow-moving one. Dividing by the AMC expresses both in the same terms.'},
  {t:'h',c:'The quantification cycle'},
  {t:'p',c:'Forecast demand, build the supply plan against stock and shipments, agree the procurement and delivery schedule, then monitor and revise as actual data arrives. QAT supports the middle two steps directly and feeds the fourth each time new consumption and stock data is entered.'}
 ],
 exercises:[
  {type:'num', tag:'Quiz',
   q:'A product has an ending balance of 22,000 packs and an AMC of 4,400 packs per month. How many months of stock is that?',
   answer:5, tol:0.05, unit:'months',
   hint:'Ending balance divided by AMC.',
   explain:'22,000 ÷ 4,400 = 5.0 months of stock. Against a minimum of 3 and a maximum of 6 months, this product would be stocked to plan.'},
  {type:'num', tag:'Quiz',
   q:'A planning unit has a minimum of 9 months and a reorder interval of 6 months. What is the maximum?',
   answer:15, tol:0, unit:'months',
   explain:'Maximum = minimum + reorder interval, so 9 + 6 = 15 months. A wide band of this kind is normal where a product arrives in two large shipments each year.'},
  {type:'mcq', tag:'Quiz',
   q:'Which statement describes the relationship between forecasting and supply planning?',
   options:['They are alternative methods for the same task','Forecasting estimates need; supply planning determines what to order and when',
            'Supply planning produces the forecast','Forecasting applies only to new products'],
   answer:1,
   explain:'The forecast becomes the demand line in the supply plan. Together they constitute quantification.'},
  {type:'mcq', tag:'Apply',
   q:'Two products each hold 20,000 packs. One is below minimum and the other is above maximum. How is that possible?',
   options:['One of the figures is incorrect','They have different AMCs, so the same quantity represents a different number of months of stock',
            'One has a shipment arriving','The minimum is set incorrectly'],
   answer:1,
   explain:'Stock status compares months of stock against the thresholds, not quantity. A fast-moving product consumes 20,000 packs in weeks; a slow-moving one may hold the same quantity for years.'}
 ]
},
{
 id:'in3', title:'Logging in and installing QAT', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'Accounts are created by the QAT support team, so the first step is a request rather than a sign-up form. Once an account exists, the first login takes the form of a password reset.'},
  {t:'h',c:'First login'},
  {t:'list',items:[
   'The support team creates the account. An email titled "QAT login credentials" arrives from QAT_noreply.',
   'Click Reset Password in that email. The link expires after 24 hours.',
   'If the link has expired, go to the QAT sign-in page and click Forgot Password, entering the email address provided to the support team. A new link is sent.',
   'Enter the new password and click Submit.',
   'The page redirects to the sign-in screen. Log in using the User ID email and the new password.',
   'Allow time for master data to sync. This can take a couple of minutes on first login.'
  ]},
  {t:'note',b:'Password requirements',c:'At least 6 characters, beginning with a letter, different from the username and from the previous password, and containing at least one uppercase letter, one number and one special character.'},
  {t:'h',c:'Installing QAT as an application'},
  {t:'p',c:'QAT is a progressive web application, which means it can be installed from the browser and run as a standalone program. Installing it provides a more streamlined interface and creates a desktop icon for quick access.'},
  {t:'list',items:[
   'Open the QAT address in Google Chrome or Microsoft Edge. Chrome is the recommended browser.',
   'Click the install icon at the right-hand end of the address bar.',
   'When the pop-up asks "Install App?", click Install.',
   'QAT will appear in the desktop files as a standalone application and as a desktop icon.'
  ]},
  {t:'note',b:'If the install icon does not appear',c:'It can take anywhere from minutes to hours to appear after the address is first opened. This is expected behaviour. Return and try again later rather than raising a ticket.'},
  {t:'h',c:'Troubleshooting'},
  {t:'table',head:['Symptom','First action'],rows:[
   ['A screen appears stale or incorrect','Press Ctrl + F5 to force a refresh'],
   ['The screen is still incorrect after refreshing','Clear site data: Ctrl + Shift + I, then Application, Clear storage, Clear site data'],
   ['Data is lost when QAT is closed','Check available space on the C: drive, then check the browser settings that clear data on exit'],
   ['None of the above resolves the issue','Raise a ticket']
  ]}
 ],
 exercises:[

   options:['qat2026','Qat26!','123Qat!','Q!2'],
   answer:1,
   explain:'Six characters, beginning with a letter, and containing an uppercase letter, a number and a special character. The first lacks an uppercase letter and a special character, the third begins with a number, and the fourth is too short.'},
  {type:'mcq', tag:'Quiz',
   q:'What does installing QAT as a progressive web application provide?',
   options:['Permission to edit data','A streamlined interface and a desktop icon','A faster connection','A separate account'],
   answer:1,
   explain:'It provides the same QAT in a standalone window. It does not change the user role or what the user can do.'},
  {type:'mcq', tag:'Quiz',
   q:'QAT has been opened for the first time and no install icon appears in the address bar. What should be done?',
   options:['Raise a ticket immediately','Reinstall the browser','Try again later, as the icon can take minutes to hours to appear','Use a different email address'],
   answer:2,
   explain:'The delay is expected rather than a fault. Chrome is the recommended browser where there is a choice.'},
  {type:'mcq', tag:'Apply',
   q:'A screen in QAT is displaying stale information. What should be tried first?',
   options:['Clear site data','Press Ctrl + F5 to force a refresh','Raise a bug ticket','Reinstall the application'],
   answer:1,
   explain:'A forced refresh is immediate and harmless. Clearing site data is the next step, followed by a ticket if neither resolves the issue.'}
 ]
},
{
 id:'in4', title:'Basic navigation', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'The QAT screen is organised into three parts: the top ribbon, the sidebar menu, and the central working area, which opens on the Dashboard.'},
  {t:'img',src:'navlayout',alt:'The QAT screen with the sidebar menu on the left, the top ribbon across the top right, and the dashboard filling the centre',
   cap:'The three regions of the screen. The sidebar on the left gives access to other screens, the ribbon at the top right holds account settings and quick access, and the centre is the working area.'},
  {t:'h',c:'The top ribbon'},
  {t:'img',src:'ribbon',alt:'The top ribbon icons labelled: help desk, user manual, refresh, home, user profile and logout',
   cap:'The ribbon icons, labelled. The number in the red box on the help desk icon is the count of your open tickets.'},
  {t:'table',head:['Icon','Function'],rows:[
   ['Helpdesk (question mark)','Opens the ticketing pop-up. Displays the number of your open tickets in a red box'],
   ['User manual','Downloads the QAT user manual'],
   ['Refresh (circular arrow)','Reloads QAT, in the same way as refreshing the browser'],
   ['Home','Returns to the Dashboard'],
   ['User profile','Displays your name, role and language, and provides access to dark mode and password changes'],
   ['Logout','Ends the session']
  ]},
  {t:'note',b:'Zooming',c:'Hold down Ctrl and rotate the mouse wheel up or down to zoom the interface in or out. You can also adjust zoom using the browser\u2019s three-dot menu and the + / − controls.'},
  {t:'h',c:'The sidebar menu'},
  {t:'p',c:'The sidebar is your main navigation area for reports and, for supply planners, data screens. Click the three horizontal lines at the top of the sidebar menu to collapse it and give yourself more screen space. This is especially helpful when viewing wide reports, where more screen width makes tables easier to read.'},
  {t:'h',c:'The Dashboard'},
  {t:'p',c:'The central area opens on the Dashboard, which is covered in detail later in this module, after working with versions.'},
  {t:'h',c:'Working within a report'},
  {t:'p',c:'The same controls recur across every QAT report, and learning them once applies everywhere.'},
  {t:'table',head:['Control','What it does'],rows:[
   ['Dropdown selectors','Set the program, planning unit, report period and version. Multi-select dropdowns include a search box and Select All. Where a Go button is present, the report does not refresh until it is clicked'],
   ['Search and filter','Tables include a search box, and column headers can be filtered. Double-click a column header to sort it'],
   ['Tooltips','Hover over an information icon beside a column heading or section title for a definition and calculation detail'],
   ['Show Data','Displays the tabular version of a graph'],
   ['Show Formulae','Reveals the calculations behind a report'],
   ['Show Guidance','Explains how the figures on that screen are derived'],
   ['Export','Downloads the report as PDF or CSV from the top right'],
   ['Copy a graph','Right-click any graph to copy it, then paste it into Word, PowerPoint or Excel. Tables can be highlighted and pasted in the same way']
  ]},
  {t:'note',b:'Chart legends',c:'On many QAT visualisations the legend items can be clicked to show or hide a data series. This changes the display only; it has no effect on the underlying data or on any calculation.'}
 ],
 exercises:[
  {type:'mcq', tag:'Read the screen', img:'navlayout',
   q:'On the screen above, where would you go to reach the reports?',
   options:['The top ribbon','The sidebar menu on the left','The Program Spotlight section','The ticker tiles'],
   answer:1,
   explain:'The sidebar menu is the route to every other screen, including the reports. The ribbon handles account settings and quick access, and the centre of the screen is the working area.'},
  {type:'mcq', tag:'Read the screen', img:'ribbon',
   q:'Which icon would you use to download the QAT user manual?',
   options:['The question mark','The circular arrow','The house','The person'],
   answer:0,
   explain:'The question mark is the user manual. The icon to its left, with the red count box, is the help desk; the circular arrow refreshes; the house returns to the Dashboard; the person opens your user profile.'},
  {type:'mcq', tag:'Quiz',
   q:'The help desk icon displays a red box containing a number. What does that number represent?',
   options:['Unread messages','Your open tickets','Programs you can access','Bugs reported by all users'],
   answer:1,
   explain:'It is a count of your own open tickets. It updates following a master data sync or a fresh login.'},
  {type:'mcq', tag:'Quiz',
   q:'How is the QAT interface zoomed in or out?',
   options:['Ctrl + F5','Hold Ctrl and rotate the mouse wheel, or use the browser\u2019s three-dot menu','The user profile menu','Collapse the sidebar'],
   answer:1,
   explain:'Both methods adjust the zoom of the whole interface, which is useful before reading a dense table.'},
  {type:'mcq', tag:'Quiz',
   q:'Which control displays the tabular version of a graph?',
   options:['Show Formulae','Show Data','Show Guidance','Export CSV'],
   answer:1,
   explain:'Show Data gives the table behind a graph. Show Formulae reveals the calculations, and Show Guidance explains how the figures are derived.'},
  {type:'mcq', tag:'Apply',
   q:'A wide report is difficult to read because the table extends beyond the screen. What is the quickest improvement?',
   options:['Export it to CSV','Collapse the sidebar using the three horizontal lines','Reduce the report period','Raise a ticket'],
   answer:1,
   explain:'Collapsing the sidebar returns its width to the report. Zooming out with Ctrl and the mouse wheel has a similar effect.'},
  {type:'mcq', tag:'Quiz',
   q:'A graph is needed for a slide deck. What is the quickest method?',
   options:['Take a screenshot','Right-click the graph and copy it','Export to CSV and rebuild the chart','Request it from the supply planner'],
   answer:1,
   explain:'Right-clicking copies the graph directly. Tables can be highlighted and pasted into Word, PowerPoint or Excel, and whole reports export to PDF or CSV.'}
 ]
},
{
 id:'in5', title:'Ticketing', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'Tickets are service requests in QAT. They are directed to the HQ FASP team and the developers, who usually respond within one business day. Some requests take longer to complete, but a response is sent in either case.'},
  {t:'p',c:'Raising tickets is available to every role, including Reports Viewers. Where something appears incorrect, a ticket is the appropriate route.'},
  {t:'h',c:'Four types of ticket'},
  {t:'table',head:['Type','When to use it'],rows:[
   ['Add or update user','A new colleague requires access, a stakeholder requires view-only access, or a team member has changed technical area and requires a different program'],
   ['Add or update master data','An item in use in your country is missing from the shared catalogue, or an existing entry is incorrect'],
   ['Report a bug','Something is not functioning correctly'],
   ['Request a change','You have a suggestion for how QAT should work']
  ]},
  {t:'note',b:'Before raising a master data ticket',c:'Confirm that the item does not already exist. Realm-level masters can be viewed within QAT, and program-level masters can be changed by a Program Admin without a ticket.'},
  {t:'h',c:'Three ways to raise a ticket'},
  {t:'list',items:[
   'The helpdesk icon on the login page. This is the route to use when login fails, master data will not sync, or an account is required.',
   'The helpdesk icon on the top ribbon, once logged in.',
   'Automatically, from a QAT error screen. This route applies to bugs only.'
  ]},
  {t:'p',c:'Where QAT flags an error itself, the screen provides a comment box and a Raise a Ticket button. No screenshot is required for that route, but the description should be as detailed as possible: what was being done, the steps that led to the error, and anything that can be shared. For all other bugs, attach a screenshot.'},
  {t:'h',c:'Priority and ticket management'},
  {t:'p',c:'Bugs can be assigned a priority — highest, high, medium or low — based on how the issue affects the user\u2019s work. Response and resolution times follow that priority.'},
  {t:'list',items:[
   'The ticket is assigned a number.',
   'Status notifications are sent by email.',
   'The count of open tickets appears on the top ribbon.',
   'Tickets are managed in Jira by the HQ FASP team and the QAT developers.'
  ]},
  {t:'p',c:'To follow up, reply directly to the email, or use the link within it to respond in the portal. A Jira account is optional; its advantage is visibility of the original ticket and its full history. Tickets can also be reached through Manage My Tickets in the helpdesk pop-up.'}
 ],
 exercises:[
  {type:'classify', tag:'Quiz',
   q:'Sort each situation according to the type of ticket it requires.',
   buckets:[{id:'user',label:'Add or update user'},{id:'bug',label:'Report a bug'}],
   items:[
    {text:'A new country director requires view-only access',bucket:'user'},
    {text:'A report returns an error screen',bucket:'bug'},
    {text:'A colleague takes on an additional technical area',bucket:'user'},
    {text:'A total does not match the rows above it',bucket:'bug'}
   ],
   explain:'Access requests and role changes are user tickets. Anything behaving incorrectly is a bug, and should include a screenshot.'},
  {type:'mcq', tag:'Quiz',
   q:'What are the three ways to raise a QAT ticket?',
   options:['Email, telephone and the helpdesk','The login page helpdesk, the top ribbon helpdesk, and automatically from an error screen',
            'Jira, email and the Program Admin','Only through a Program Administrator'],
   answer:1,
   explain:'The automatic route applies to bugs only, and is the one case in which no screenshot is required.'},
  {type:'mcq', tag:'Quiz',
   q:'A ticket update has arrived by email. How can it be answered?',
   options:['Only through Jira','Only by raising a new ticket','By replying to the email, or by using the link to respond in the portal','It cannot be answered'],
   answer:2,
   explain:'Replying by email is sufficient. The portal is optional and provides visibility of the original ticket and all past activity.'},
  {type:'mcq', tag:'Apply',
   q:'A funding source used in your country is missing from QAT. What should be done first?',
   options:['Raise a master data ticket immediately','Confirm it does not already exist, and whether a Program Admin can add it',
            'Enter it manually in the report','Report it as a bug'],
   answer:1,
   explain:'Realm-level masters can be checked within QAT, and program-level masters can be changed by a Program Admin without a ticket. Checking first avoids an unnecessary request.'},
  {type:'mcq', tag:'Recall',
   q:'QAT displays an error screen with a comment box and a Raise a Ticket button. What should the comment contain?',
   options:['Nothing, as the error is captured automatically','A brief note stating that an error occurred',
            'As much detail as possible: what was being done, the steps that led to the error, and anything that can be shared',
            'Contact details'],
   answer:2,
   explain:'The developers must reproduce an error before it can be corrected. A precise description of the path that led to it shortens that process considerably.'}
 ]
},
{
 id:'in6', title:'Working with versions', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'Each time a supply planner uploads, QAT creates a new version of the program, numbered and dated. Understanding versions prevents two people quoting different figures from the same plan.'},
  {t:'p',c:'A higher version number indicates more recent data. The dropdown also displays the date on which each version was saved to the server, which shows how current a plan actually is.'},
  {t:'h',c:'Draft and final versions'},
  {t:'table',head:['Version type','Description'],rows:[
   ['Draft','Uploaded at any time as work proceeds. Most versions are drafts'],
   ['Final','Submitted through the quarterly supply plan process'],
   ['Final and approved','A final version that has passed formal review for data quality, procurement scheduling and supply planning practice. Indicated by an asterisk']
  ]},
  {t:'img',src:'versions',alt:'The QAT version history table showing version numbers, draft and final version types, approval status and dates',
   cap:'Version history. The same version number can appear twice: once when submitted for review, and again once it has been approved or returned for revision.'},
  {t:'note',b:'The most recent version is not necessarily the approved one',
   c:'The highest numbered version is usually a draft, and the approved version is often several numbers behind it. Some reports allow a specific version to be selected, or provide a Use Approved Supply Plans Only option. Decide which basis is required before quoting a figure.'},
  {t:'h',c:'Which version to use'},
  {t:'table',head:['Purpose','Version to use'],rows:[
   ['A formal quarterly submission or external report','The most recent final and approved version'],
   ['An operational question about the current position','The highest numbered version, whether approved or not'],
   ['Comparing programs with one another','The same basis for all of them, stated alongside the figures']
  ]},
  {t:'p',c:'Whichever basis is used, state it when sharing the number. "Version 37, approved 3 September" removes an entire category of disagreement before it arises.'}
 ],
 exercises:[
  {type:'mcq', tag:'Read the screen', img:'versions',
   q:'Which version contains the most recent data?',
   options:['Version 41','Version 37, marked Approved','Version 34, marked Approved','Version 33'],
   answer:0,
   explain:'The highest number is the most recent upload. Note that it is a draft: the most recent data and the approved data are rarely the same version.'},
  {type:'mcq', tag:'Judgement',
   q:'A figure is required for a formal quarterly submission. Which version should be quoted?',
   options:['The highest numbered','The most recent final and approved version','Any draft from the current month','Whichever has the fewest open problems'],
   answer:1,
   explain:'Approved versions have passed review for data quality, procurement scheduling and planning practice. For a formal figure, that review is the point.'},
  {type:'mcq', tag:'Read the screen', img:'versions',
   q:'Version 37 appears twice, once as Pending Approval and once as Approved. What does this indicate?',
   options:['A duplicate upload','The version was submitted for review and subsequently approved',
            'Two planners uploaded the same version','The version was rejected and resubmitted'],
   answer:1,
   explain:'One row records the submission and the second records the reviewer\u2019s decision. Version 33 shows the alternative outcome: Needs Revision.'},
  {type:'mcq', tag:'Apply',
   q:'A colleague quotes a stock figure from the same program that does not match yours. What is the most likely explanation?',
   options:['One of you has misread the report','You are looking at different versions','The report is faulty','The data has not synced'],
   answer:1,
   explain:'Different versions is by far the most common cause. Agreeing a version before comparing figures resolves it immediately, which is why the version is worth quoting alongside the number.'}
 ]
},
{
 id:'in7', title:'The Dashboard', minutes:14,
 body:[
  {t:'p',cls:'lede',c:'The Dashboard is your starting point and the quickest way to find answers in QAT. It is organized into three sections that move from broad, high-level insights to detailed program-specific information.'},
  {t:'table',head:['Section','Description'],rows:[
   ['Ticker','What exists in QAT overall, which programs you can access, and how many shipments are linked to a procurement system.'],
   ['Overview','Displays multiple programs and how many stockouts are occurring, the cost of expiries, number of supply plan issues, and when data was last uploaded.'],
   ['Program Spotlight','For a single program, displays key metrics such as stock status, forecast accuracy, shipments by funder or procurement agent, scorecard metrics, and products with TBD funding, and expiries.']
  ]},
  {t:'img',src:'dash',alt:'The QAT supply planning dashboard showing the sidebar, top ribbon, the three ticker tiles, the Overview table and the start of the Program Spotlight section',
   cap:'The Dashboard in full. The Overview section provides the multi-program view; the Program Spotlight below it supports single-program analysis.'},

  {t:'h',c:'1. Ticker'},
  {t:'p',c:'The Ticker highlights key metrics across QAT through three rotating tiles: Realm, My Access, and ERP Linking.'},
  {t:'img',src:'ticker',alt:'The three ticker tiles showing realm forecasting programs, supply plans the user can access, and linked shipments',
   cap:'Realm answers what exists in QAT overall. My Access answers what you can see. ERP Linking answers how many shipments are linked to a procurement system.'},
  {t:'list',items:[
   'Realm provides a high-level view of the number of countries, users, supply planning programs, and forecasting programs in QAT.',
   'My Access shows your specific access, including the number of supply plans you can view.',
   'ERP Linking displays the number of shipments linked to a procurement system.'
  ]},
  {t:'p',c:'The tiles automatically rotate, but you can also use the navigation dots to move between them manually. Each tile includes links to related screens, making it easy to navigate directly to the information you need. If you do not have access to a screen, QAT will let you know.'},

  {t:'h',c:'2. Overview'},
  {t:'p',c:'The Overview section provides a snapshot of data across multiple programs. Only programs you have access to are displayed, allowing you to quickly assess commodity security, data quality, and potential supply chain risks.'},
  {t:'img',src:'overview',alt:'The Overview table listing six programs with latest version, active planning units, planning units with stockouts, quality score, stock status score, overall score, total cost of expiries, open QAT problems and review status',
   cap:'Each row is a program. Read it left to right: how current the data is, how many products are at risk, how the plan scores, what expiries will cost, and whether the plan has been reviewed.'},
  {t:'table',head:['Column','Description'],rows:[
   ['Program','Displays the programs available to you in QAT. Only programs you have permission to access will appear in the list.'],
   ['Latest Version','Shows when each supply plan was last uploaded, helping you determine whether the data is current.'],
   ['Active Planning Units','Displays the number of planning units included in each program\u2019s supply plan.'],
   ['Planning Units with Stockouts','Highlights how many active planning units are projected to experience a stockout within the next 18 months. The number shown in red indicates the count of affected planning units.'],
   ['Scores','Provides program scores based on QAT Problem List criteria, including data quality, procurement scheduling, and commodity security. Higher scores indicate better data quality and lower supply chain risk.'],
   ['Total Cost of Expiries','Identifies programs with planning units expected to expire within the next 18 months and estimates the associated cost.'],
   ['Open QAT Problems','Shows the number of unresolved QAT problems for each program. Higher counts may indicate data quality or supply planning issues that require attention.'],
   ['Review Status','Displays the program\u2019s review status and date associated with the latest final version uploaded to the server, helping you determine whether the supply plan has been recently reviewed and approved. Click on the notebook icon to view the program\u2019s version history, including upload dates and notes entered by supply planners and reviewers. This provides valuable context on changes, review decisions, and outstanding questions across versions.']
  ]},
  {t:'note',b:'Click Go to apply a change',c:'In the Overview section, select the programs you want to view and then click Go to refresh the table. Changes to the program selection are not applied until Go is selected.'},

  {t:'h',c:'3. Program Spotlight'},
  {t:'p',c:'The Program Spotlight section provides a detailed view of a single program. Unlike the Overview section, this area is designed to help you analyze one program at a time, so the program selector only allows a single selection. Most metrics are filtered by the selected report period. However, the Supply Plan Scores and the Data Quality sections follow QAT Problem List rules and are not tied to the report period.'},
  {t:'img',src:'spot1',alt:'The Program Spotlight showing the overall supply plan score gauge at 41 percent, the stock status bar with a hover breakdown by status, a table of stocked out planning units, and four data quality gauges',
   cap:'The upper half of the Program Spotlight: the overall score, stock status with its hover breakdown and the list of stocked-out products, and the four data quality gauges.'},
  {t:'h',c:'Overall Supply Plan Score'},
  {t:'p',c:'The overall program score is calculated as the average of the Stock Status Score and Data Quality Score. Higher scores indicate stronger data quality, better commodity security, and a healthier overall supply plan. The gauge is banded into four ranges: 0 to 59%, 60 to 74%, 75 to 89%, and 90 to 100%.'},
  {t:'h',c:'Stock Status'},
  {t:'p',c:'The bar chart shows the percentage of planning-unit months in the selected report period that fall into each stock status category. Hover over the chart to view the percentage breakdown for each status, and view the table to identify the specific planning units that are projected to experience a stockout during the selected period, along with the number of months each is affected.'},
  {t:'h',c:'Data Quality'},
  {t:'p',c:'This section aligns with the QAT Problem List and is intended to help users identify and address data quality issues. There are four gauges that highlight potential issues across the program, each labelled with the number of planning units affected out of the total.'},
  {t:'table',head:['Gauge','What it flags'],rows:[
   ['Forecasted Consumption','Number of planning units with missing forecasted consumption data during the next 18 months.'],
   ['Actual Inventory','Number of planning units with no inventory data in the last three months.'],
   ['Actual Consumption','Number of planning units with missing actual consumption data in the last three months, or gaps in actual consumption data during the last six months.'],
   ['Shipments','Number of planning units with procurement scheduling issues, such as shipments not marked as received after the expected receipt date, or shipments that should have been submitted based on lead-time requirements but are still in the planned status.']
  ]},
  {t:'img',src:'spot2',alt:'The lower half of the Program Spotlight showing the shipments pie chart with a display-by selector, a table of planning units with TBD funding, the forecast error table and the expiries table',
   cap:'The lower half: shipments by funding source with the TBD table beside it, then forecast error and expiries, each listed by planning unit.'},
  {t:'h',c:'Shipments'},
  {t:'p',c:'This section displays a pie chart with shipment distribution by Funding Source, Procurement Agent, or Status, depending on the Display By view selected. Percentages are calculated using the total shipment cost, with the total shipment cost for the selected period displayed in the upper-right corner of the section. The accompanying table identifies planning units with TBD funding and the number of affected shipments.'},
  {t:'h',c:'Forecast Error'},
  {t:'p',c:'This section displays the average forecast error percentage for the selected report period, listed by planning unit. Values displayed in red exceed the forecast error threshold, which is 50% by default. A caution icon indicates that insufficient data is available to calculate the metric.'},
  {t:'h',c:'Expiries'},
  {t:'p',c:'This section lists the planning units projected to expire during the selected report period. For each planning unit, the table provides the projected expired quantity and the expiry date, with the total value of expiries shown in the section header.'},

  {t:'h',c:'Working the Dashboard efficiently'},
  {t:'note',b:'Tooltips',c:'Many column headers include tooltips. Hover over the information icon to view definitions and calculation details.'},
  {t:'note',b:'Section headers are links',c:'Section headers throughout the page are clickable and provide links to related data and screens. To drill down or find more detailed information about the analytics in the Dashboard, click on the relevant header section.'},
  {t:'note',b:'Charts and tables',c:'For many QAT visualizations the chart legends can be used to show or hide data series, and the charts can be copied by right-clicking the image. Tables support filtering and sorting; to sort a column, double-click the column header.'}
 ],
 exercises:[
  {type:'mcq', tag:'Read the screen', img:'overview',
   q:'Looking at the Overview table, which supply plan was most recently updated?',
   options:['FSP-ARV-MOH3-NTL','FSP-LAB-MOH20-NTL','FSP-MAL-MOH9-NTL','FSP-NUTRI-MOH3-NTL'],
   answer:2,
   explain:'FSP-MAL-MOH9-NTL shows v4, uploaded 29 January 2026, which is later than every other row. The Latest Version column is the quickest check on whether a plan\u2019s data is current.'},
  {type:'mcq', tag:'Read the screen', img:'overview',
   q:'Which program has the strongest Overall Score?',
   options:['FSP-ARV-MOH3-NTL at 43%','FSP-MAL-MOH10-NTL at 88%','FSP-MAL-MOH9-NTL at 80%','FSP-NUTRI-MOH3-NTL at 93%'],
   answer:3,
   explain:'FSP-NUTRI-MOH3-NTL scores 93%, the only program in the table above the 90% target. It combines a Quality Score of 100% with a Stock Status Score of 86%.'},
  {type:'mcq', tag:'Read the screen', img:'overview',
   q:'How many of the six programs are projected to experience expiries?',
   options:['Two','Three','Four','All six'],
   answer:2,
   explain:'Four programs carry a figure in Total Cost of Expiries: FSP-ARV-MOH3 at $3,722, FSP-MAL-MOH10 at $65,842, FSP-MAL-MOH2 at $485,858 and FSP-MAL-MOH9 at $564,217. A dash indicates no projected expiries in the next 18 months.'},
  {type:'mcq', tag:'Read the screen', img:'overview',
   q:'Which program would you review first for data quality issues?',
   options:['FSP-LAB-MOH20-NTL, with a Quality Score of 25% and 24 open problems',
            'FSP-NUTRI-MOH3-NTL, with the highest overall score',
            'FSP-MAL-MOH10-NTL, with a Quality Score of 100%',
            'FSP-MAL-MOH9-NTL, with no open problems'],
   answer:0,
   explain:'FSP-LAB-MOH20-NTL combines the lowest Quality Score in the table, 25%, with the highest count of open QAT problems, 24. Note that its Stock Status Score is 96%: the plan is holding stock well, but the records behind it need attention.'},
  {type:'mcq', tag:'Read the screen', img:'spot1',
   q:'In the Stock Status breakdown, what percentage of planning-unit months are stocked to plan?',
   options:['10.00%','18.33%','25.83%','32%'],
   answer:2,
   explain:'The hover breakdown shows Stocked to Plan at 25.83%, against Stock Out 20.83%, Below Min 10.00%, Above Max 25.00% and N/A 18.33%. The 32% shown beside the section heading is the Stock Status Score, which is a different figure.'},
  {type:'mcq', tag:'Read the screen', img:'spot1',
   q:'Which data quality gauge needs attention most urgently?',
   options:['Forecasted Consumption, 2 of 5 missing','Actual Inventory, 2 of 5 missing',
            'Actual Consumption, 5 of 5 missing','Shipments, 1 of 5 with flagged dates'],
   answer:2,
   explain:'Actual Consumption shows 5 of 5 planning units missing actuals, displayed in red. With no actual consumption recorded, forecast error cannot be calculated and the AMC behind every months-of-stock figure is unreliable.'},
  {type:'mcq', tag:'Read the screen', img:'spot2',
   q:'Looking at the Expiries table, which product is projected to expire and when?',
   options:['Isoniazid 100 mg, March 2027','Dolutegravir 10 mg Scored Dispersible Tablet, 1 July 2027',
            'Flucytosine 500 mg, January 2027','Amphotericin B, September 2026'],
   answer:1,
   explain:'The Expiries table lists Dolutegravir 10 mg Scored Dispersible Tablet, 9,997 units expiring on 1 July 2027. The total value of expiries for the period, $298,692, appears in the section header.'},
  {type:'mcq', tag:'Read the screen', img:'spot2',
   q:'The Shipments pie is displayed by Funding Source. What else can it be grouped by?',
   options:['Planning unit or country','Procurement Agent or Status','Month or quarter','Quality Score or Stock Status Score'],
   answer:1,
   explain:'The Display By selector offers Funding Source, Procurement Agent and Status. Percentages are always calculated on total shipment cost rather than quantity, because products are counted in different units.'},
  {type:'mcq', tag:'Apply',
   q:'You change the program selection in the Overview section but the table does not change. Why?',

{
 id:'rp1', title:'The Supply Plan Report', minutes:11,
 body:[
  {t:'p',cls:'lede',c:'One of the most important reports in the set. Its purpose is to assess the stock status of a single product by comparing stock against dynamic minimum and maximum levels, alongside consumption, inventory and shipment data.'},
  {t:'p',c:'There are two parts to the report, the graph and the table.'},
  {t:'img',src:'spq',alt:'Two supply plan charts side by side: the left shows quantities with stock, shipments and consumption; the right shows months of stock against minimum and maximum lines'},
  {t:'p',c:'The chart on the top left has quantities. The stock on hand quantity is represented by the grey area. Blue bars are shipment quantities that push stock up, and the red line is consumption quantity that pushes stock down.'},
  {t:'p',c:'While the quantity view for a product is very useful, it does not tell you whether the product is stocked appropriately or not. The chart on the top right therefore provides the months of stock, represented by the dark green line, and the minimum and maximum inventory levels set by the user, represented by the dotted lines. A large quantity of a fast-moving product can be a shortage if it falls below the minimum months of stock required; a small quantity of a slow-moving one can be years of cover if it stays within the minimum and maximum requirements for months of stock.'},
  {t:'img',src:'spall',alt:'The combined supply plan report graph with quantity on the left axis and months of stock on the right'},
  {t:'p',c:'QAT brings it all together in the chart at the bottom with both quantity and months of stock represented through the primary (left) and secondary (right) axes.'},
  {t:'widget',kind:'qatgraph'},
  {t:'h',c:'Tabular view'},
  {t:'p',c:'The tabular view of the same data is shown by clicking on Show Data right below the graph. Whereas the graph runs months across the horizontal axis, the table presents one month per row.'},
  {t:'img',src:'sptable',alt:'The tabular view of the supply plan report with columns for opening balance, forecasted and actual consumption, shipments, adjustment quantity, projected expired stock, ending balance, AMC and months of stock'},
  {t:'eq',c:'Opening balance − consumption + shipments ± adjustments − expiries = ending balance'},
  {t:'p',c:'Both forecast and actual consumption are shown. The actual is used in the calculation where it exists; otherwise the forecast is.'},
  {t:'list',items:[
   'There may be more than one shipment in a month, in which case they are added together.',
   'Adjustments may be due to damage, theft or transferred inventory.',
   'Expiries are projections calculated by QAT.',
   'If the starting or ending balance is in bold, it is based on an inventory count, which is always at the end of the month.'
  ]},
  {t:'p',c:'Two derived figures follow. AMC is average monthly consumption, averaged over a number of past and future months set per product by a program administrator. Months of stock is the ending balance divided by the AMC.'},
  {t:'eq',c:'Months of stock = ending balance ÷ AMC'},
  {t:'note',b:'One month means little',c:'A single month above maximum or below minimum is rarely the whole story. What matters is the shape over the period: how long a dip lasts, whether a shipment arrives in time, and whether the pattern repeats.'}
 ],

{
 id:'rp2', title:'Supply Plan Report continued: comparing across programs and products', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'The same report opens up in two directions: several programs holding the same product, and several products that are not identical but are related.'},
  {t:'h',c:'Multiple programs, one product'},
  {t:'p',c:'Where more than one program is selected, the report aggregates: forecasts are summed, adjustments are summed, and shipments are shown split by program with a combined quantity column. The ending balance and months of stock are calculated exactly as before.'},
  {t:'p',c:'One additional column appears. Consensus consumption is the sum of actual consumption from the selected programs where actuals exist, and the sum of forecasts where they do not, which means a single month may contain a mixture of the two.'},
  {t:'widget',kind:'region'},
  {t:'h',c:'Equivalency units'},
  {t:'p',c:'Equivalency units allow data to be aggregated across products that are different but related. Each forecasting unit is assigned a conversion factor to the shared unit.'},
  {t:'table',head:['Equivalency unit','Forecasting unit','Divide by'],rows:[
   ['Malaria treatment','Artemether/Lumefantrine 20/120 mg, 6 x 1 blister','1'],
   ['Malaria treatment','Artemether/Lumefantrine 20/120 mg, 6 x 3 blister','1'],
   ['Malaria tablets','Artemether/Lumefantrine 20/120 mg, 6 x 1 blister','0.1667 — one sixth'],
   ['Malaria tablets','Artemether/Lumefantrine 20/120 mg, 6 x 4 blister','0.0417 — one twenty-fourth']
  ]},
  {t:'p',c:'The two equivalency units in that table answer different questions. Counting treatments, a one-blister pack and a three-blister pack each count as one, because each treats one patient. Counting tablets, they differ by a factor of three.'},
  {t:'widget',kind:'eu'},
  {t:'note',b:'Match the unit to the question',c:'How many patients can be treated, and how much product is held, are different questions. The same stock produces different answers depending on which equivalency unit the report is using.'}
 ],

  {type:'mcq', tag:'Quiz',

            'Whichever program reported the highest figure','The forecast agreed at the last quantification'],
   answer:1,

{
 id:'rp3', title:'The Stock Status Matrix', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'Where the Supply Plan Report examines one product in depth, the Stock Status Matrix presents every product at a glance: planning units down the side, months across the top, and a colour in every cell.'},
  {t:'img',src:'matrix',alt:'The QAT stock status matrix showing four planning units across twelve months with stoplight colouring, a min/max column, and checkboxes to remove planned and TBD-funded shipments',
   cap:'The Min/Max column shows the thresholds the colours are judged against. What does each colour mean?'},
  {t:'h',c:'The two checkboxes'},
  {t:'p',c:'Remove Planned Shipments and Remove TBD Funding Source Shipments are the most useful controls on the screen. A plan can appear healthy on the strength of orders that have not yet been placed or funded. Selecting these options strips those shipments out and shows the position that can actually be relied upon.'},
  {t:'p',c:'This is the fastest way to answer the question stakeholders most often ask: if the planned shipments do not arrive, what happens?'},
  {t:'h',c:'Showing quantities'},
  {t:'p',c:'By default the matrix displays months of stock. Selecting Show Quantity switches the cells to the underlying stock quantity, and Show Icon controls whether the shipment and expiry markers are displayed.'}
 ],
 exercises:[
  {type:'classify', tag:'Quiz',
   q:'Match each colour to the stock status it represents.',
   buckets:[{id:'short',label:'Too little stock'},{id:'much',label:'Too much, or unknown'}],
   items:[
    {text:'Red — stocked out',bucket:'short'},
    {text:'Orange — below minimum',bucket:'short'},
    {text:'Yellow — above maximum',bucket:'much'},
    {text:'Grey — N/A, no months of stock could be calculated',bucket:'much'}
   ],
   explain:'Red and orange indicate a shortage: stocked out, and below minimum. Yellow indicates overstock, above maximum. Grey means the status is unknown because no AMC could be calculated. Green, between the thresholds, is stocked to plan.'},
  {type:'mcq', tag:'Read the screen', img:'matrix',
   q:'Which planning unit is stocked out, and when?',
   options:['Dolutegravir, from June','Abacavir/Lamivudine, from September','Nevirapine, in February','Lamivudine/Tenofovir, in March'],
   answer:1,
   explain:'The Abacavir/Lamivudine row declines across the year and turns red from September to December, where the value reaches zero. It is already below minimum, shown in orange, from January onward against a minimum of 8 months.'},
  {type:'mcq', tag:'Read the screen', img:'matrix',
   q:'Which planning unit shows projected expired stock?',
   options:['Abacavir/Lamivudine','Dolutegravir','Lamivudine/Tenofovir','Nevirapine'],
   answer:1,
   explain:'The warning triangle sits in the Dolutegravir row in June, alongside a shipment icon. The product is above maximum for the first part of the year, which is the condition that leads to expiry.'},
  {type:'mcq', tag:'Read the screen', img:'matrix',
   q:'All four products have a Min/Max of 8/13. What does a yellow cell showing 16.2 indicate?',
   options:['The product is stocked out','The product is below minimum (understocked)',
            'The product is above maximum (overstocked)','The value is an actual count'],
   answer:2,
   explain:'Yellow is above maximum, and 16.2 months exceeds the 13-month maximum, so the product is overstocked. While overstocks are less concerning than understocks or stockouts, they should still be monitored, as they increase the risk of product expiry and bulky products may cause storage issues.'},
  {type:'mcq', tag:'Apply',
   q:'A stakeholder asks what would happen if the planned shipments do not arrive. What is the quickest way to show them?',

            'Compare two program versions within the Stock Status Matrix',
            'Tick Remove TBD Funding Source Shipments on the Stock Status Matrix'],
   answer:1,

  {type:'mcq', tag:'Apply',

  {type:'mcq', tag:'Judgement',
   q:'A product moves from stocked to plan to above maximum during a month in which no shipment arrives. What is the most likely explanation?',
   options:['Stock increased without being recorded','Consumption fell, so the same stock now represents more months of cover',
            'The minimum and maximum were changed','An expiry was reversed'],
   answer:1,

 id:'rp4', title:'Shipment reports', minutes:7,

  {t:'p',cls:'lede',c:'Three related reports answer questions about what is on order, who is paying, and when shipments arrive.'},
  {t:'table',head:['Report','Use it for'],rows:[

  {t:'p',c:'A report\u2019s summary table includes columns for countries, programs and shipments, which is what can make a report useful across a portfolio rather than for one supply plan program at a time. The detail table at the bottom of the report lists each shipment individually.'},
  {t:'note',b:'The funding question',c:'Shipments with a funding source of TBD are planned shipments without money attached. Grouping shipments by funding source allows you to identify them quickly, and the dashboard also flags shipments with a TBD funding source.'}
 ],

  {type:'mcq', tag:'Quiz',
