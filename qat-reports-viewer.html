<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAT eLearning — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
:root{
  --navy:#002F6C; --tint:#b3d4ff; --tint-soft:#e2eefc;
  --paper:#F4F7FB; --card:#FFFFFF;
  --ink:#002F6C; --ink2:#3F5F8A; --ink3:#8199B8;
  --rule:#CFDCEC; --rule2:#E6EEF8;
  --under:#F48521; --low:#EDB944; --ok:#118B70; --over:#EDB944; --out:#BA0C2F;
  --error:#BA0C2F; --na:#BFBFBF;
  --sans:"Gill Sans","Gill Sans MT","Gill Sans Nova",Cabin,Calibri,"Trebuchet MS",sans-serif;
  --serif:"Gill Sans","Gill Sans MT","Gill Sans Nova",Cabin,Calibri,"Trebuchet MS",sans-serif;
  --shadow:0 1px 2px rgba(0,47,108,.05), 0 6px 18px -8px rgba(0,47,108,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
input[type=range]{accent-color:var(--navy)}
input[type=checkbox]{accent-color:var(--navy)}
.shell{max-width:1320px;margin:0 auto;padding:0 28px 100px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);padding:0}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:13px 28px 12px}
.wordmark{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:24px;color:#fff}
.wordmark span{color:var(--tint);font-weight:500;margin-left:2px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{font-size:13.5px;font-weight:600;border:0;background:rgba(255,255,255,.1);color:var(--tint);padding:7px 15px;border-radius:999px;transition:background .15s,color .15s}
.tab:hover{background:rgba(255,255,255,.2);color:#fff}
.tab[data-on="1"]{background:#fff;color:var(--navy)}
.meterwrap{background:var(--navy)}
.meter{height:4px;background:rgba(255,255,255,.22)}
.meter i{display:block;height:100%;background:var(--tint);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- layout ---------- */
.grid{display:grid;gap:34px;margin-top:34px}
@media(min-width:900px){.grid{grid-template-columns:240px minmax(0,1fr);gap:60px}}
@media(min-width:1500px){.grid{grid-template-columns:260px minmax(0,1fr);gap:76px}}

/* ---------- sidebar ---------- */
.rail{font-family:var(--sans);font-size:14px}
@media(min-width:900px){.rail{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto}}
.railgroup{margin-bottom:24px}
.railtitle{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.railtitle b{color:var(--ink2);font-weight:700}
.railitems{list-style:none;margin:0;padding:0}
.railitems li{position:relative;padding-left:24px}
.railitems li::before{content:"";position:absolute;left:5px;top:20px;bottom:-2px;width:1.5px;background:var(--rule)}
.railitems li:last-child::before{display:none}
.railitems li[data-state="done"]::before{background:var(--ok);opacity:.4}
.dot{position:absolute;left:0;top:12px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid var(--rule);transition:all .18s}
li[data-state="done"] .dot{background:var(--ok);border-color:var(--ok)}
li[data-state="now"] .dot{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 4px var(--tint)}
.node{background:none;border:0;padding:5px 0 9px;text-align:left;color:var(--ink3);font:inherit;width:100%;line-height:1.35;transition:color .15s}
.node:hover{color:var(--ink2)}
li[data-state="done"] .node{color:var(--ink2)}
li[data-state="now"] .node{color:var(--ink);font-weight:600}
.mins{display:block;font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:2px}

/* ---------- lesson prose ---------- */
.kicker{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6C6364;margin:0 0 9px}
h1{font-family:var(--sans);font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:0 0 20px;font-size:34px;color:var(--navy)}
h2{font-family:var(--sans);font-weight:600;letter-spacing:-.015em;font-size:20px;margin:36px 0 10px;color:var(--navy)}
p{margin:0 0 16px;max-width:68ch}
.lede{font-size:20px;color:var(--ink2);line-height:1.5}
.blist{max-width:68ch;margin:0 0 16px;padding-left:22px}
.blist li{margin-bottom:8px}
.blist li::marker{color:var(--over)}
.defn{border-left:3px solid var(--navy);padding:3px 0 3px 17px;margin:22px 0;max-width:68ch}
.defn b{font-family:var(--sans);font-size:15px;display:block;margin-bottom:3px}
.note{background:var(--tint-soft);border:1px solid var(--tint);border-radius:10px;padding:15px 18px;margin:22px 0;max-width:68ch;font-size:16.5px}
.note b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--navy)}
.eq{font-family:var(--sans);font-weight:600;font-size:16px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--over);border-radius:8px;padding:14px 18px;margin:20px 0;max-width:68ch;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.eq small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px;margin-top:7px;line-height:1.45}
table{border-collapse:collapse;font-family:var(--sans);font-size:14.5px;margin:20px 0;font-variant-numeric:tabular-nums;width:100%;max-width:880px}
th,td{padding:9px 14px 9px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule2)}
th{font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);border-bottom:1.5px solid var(--rule);padding-top:0}
tbody tr:last-child td{border-bottom:1px solid var(--rule)}
.fig{margin:24px 0;max-width:880px}
.fig figcaption{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45}
svg{display:block;width:100%;height:auto}

/* ---------- exercises ---------- */
.ex{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:24px;margin:28px 0 0;max-width:880px;box-shadow:var(--shadow)}
.ex-tag{margin:0 0 12px;display:flex;gap:8px;align-items:center}
.ex-tag i{font-style:normal;background:var(--tint-soft);border:1px solid var(--tint);color:var(--navy);border-radius:999px;padding:3px 11px;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ex-q{font-family:var(--sans);font-size:16.5px;font-weight:500;line-height:1.5;margin:0 0 18px;color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font-size:15.5px;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:9px;padding:12px 15px;color:var(--ink);line-height:1.42;transition:border-color .13s,background .13s,transform .13s;font-family:var(--sans)}
.opt:hover:not(:disabled){border-color:var(--over);background:var(--tint-soft)}
.opt[data-mark="right"]{border-color:var(--ok);background:rgba(17,139,112,.10);font-weight:600}
.opt[data-mark="wrong"]{border-color:var(--error);background:rgba(186,12,47,.06)}
.opt[data-mark="chosen"]{border-color:var(--navy);background:var(--tint-soft)}
.opt:disabled{cursor:default}
.seqrow{display:flex;gap:13px;align-items:flex-start}
.badge{font-family:var(--sans);font-weight:700;font-size:13px;min-width:22px;height:22px;border-radius:6px;background:var(--rule);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:0}
.badge.set{background:var(--navy);color:#fff}
.numrow{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
input[type=text]{font-size:16px;font-variant-numeric:tabular-nums;padding:10px 12px;width:146px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--navy);background:#fff}
.unit{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.btn{font-size:15px;font-weight:600;padding:11px 22px;border-radius:9px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:#00214d}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--rule);font-weight:500}
.btn.ghost:hover{border-color:var(--navy);background:var(--tint-soft)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{background:var(--navy)}
.btn.ghost:disabled:hover{background:transparent}
.feedback{font-family:var(--sans);font-size:15px;line-height:1.55;margin-top:18px;padding:2px 0 2px 15px;border-left:3px solid var(--rule)}
.feedback[data-tone="right"]{border-color:var(--ok)}
.feedback[data-tone="wrong"]{border-color:var(--low)}
.feedback b{display:block;margin-bottom:4px}
.actions{display:flex;gap:11px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hintline{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.foot{display:flex;gap:12px;margin-top:40px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:24px}

/* ---------- classify ---------- */
.buckets{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:620px){.buckets{grid-template-columns:1fr 1fr}}
.bucket{border:1.5px dashed var(--rule);border-radius:10px;padding:13px;min-height:82px;background:var(--paper)}
.bucket h4{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--ink2)}
.chip{font-family:var(--sans);font-size:13.5px;font-weight:500;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 13px;margin:0 6px 7px 0;color:var(--ink);transition:all .13s}
.chip:hover:not(:disabled){border-color:var(--over)}
.chip[data-mark="right"]{border-color:var(--ok);background:rgba(17,139,112,.11)}
.chip[data-mark="wrong"]{border-color:var(--error);background:rgba(186,12,47,.07)}
.pool{margin-bottom:14px}

/* ---------- data tables ---------- */
.plantable{font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums;width:100%;max-width:100%;border-collapse:collapse}
.plantable th{font-size:10.5px;text-align:right;padding:0 9px 7px;border-bottom:1.5px solid var(--rule);color:var(--navy);letter-spacing:.05em;text-transform:uppercase}
.plantable th:first-child{text-align:left}
.plantable td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--rule2)}
.plantable td:first-child{text-align:left;color:var(--ink2);font-size:13.5px;font-weight:500}
.plantable input{width:94px;text-align:right;padding:5px 8px;font-size:14px;border-radius:6px}
.mos{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:700;font-size:13.5px}
.mos[data-s="under"]{background:rgba(244,133,33,.18);color:#A2510C}
.mos[data-s="ok"]{background:rgba(17,139,112,.14);color:#0B6152}
.mos[data-s="over"]{background:rgba(237,185,68,.28);color:#7D5E08}
.mos[data-s="out"]{background:var(--out);color:#fff}

/* ---------- widgets ---------- */
.sandbox{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--navy);border-radius:4px 4px 13px 13px;padding:22px;margin:28px 0;max-width:880px;box-shadow:var(--shadow)}
.sandbox h3{font-family:var(--sans);font-size:16.5px;margin:0 0 5px;color:var(--navy);letter-spacing:-.01em}
.sandbox .sub{font-family:var(--sans);font-size:13.5px;color:var(--ink2);margin:0 0 18px;line-height:1.5;max-width:66ch}
.ctrl{font-family:var(--sans);font-size:14px;margin-bottom:13px}
.ctrl label{display:flex;gap:12px;align-items:center;justify-content:space-between}
.ctrl label>span:first-child{color:var(--ink2);flex:0 0 auto}
.ctrl input[type=range]{flex:1;min-width:90px}
.ctrl .val{min-width:66px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);flex:none}
.toggles{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.toggles label{display:flex;gap:10px;align-items:flex-start;font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--ink2)}
.toggles input{margin-top:3px}
.readout{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--sans);margin-top:18px;border-top:1px solid var(--rule2);padding-top:14px}
.readout div span{display:block;color:var(--ink3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.readout div b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.months{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}
.mcell{font-family:var(--sans);font-size:11px;border:1.5px solid var(--rule);border-radius:7px;padding:6px 7px;min-width:62px;text-align:center;background:var(--paper);color:var(--ink3);transition:all .15s}
.mcell b{display:block;font-size:13.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.mcell[data-in="1"]{border-color:var(--over);background:var(--tint-soft)}
.mcell[data-in="1"] b{color:var(--navy)}
.mcell[data-null="1"] b{color:var(--error)}
.mcell[data-now="1"]{box-shadow:0 0 0 2px var(--navy)}
.mtoggle{cursor:pointer}
.mcell[data-off="1"]{opacity:.4;text-decoration:line-through}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
.mbox{border:1.5px solid var(--rule);border-radius:10px;padding:14px;font-family:var(--sans)}
.mbox h5{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.mbox .row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums;font-weight:600}
.mbox .row span{color:var(--ink3);font-weight:400}
.mbox[data-win="1"]{border-color:var(--ok);background:rgba(17,139,112,.06)}
.verdict{font-family:var(--sans);font-size:14px;color:var(--ink2);margin-top:16px;border-top:1px solid var(--rule2);padding-top:14px;line-height:1.5;max-width:70ch}
.chain{font-family:var(--sans);font-size:14px;margin:18px 0;border-top:1.5px solid var(--rule)}
.chain .step{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.chain .step span{color:var(--ink2)}
.chain .step b{font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;color:var(--navy)}
.chain .step.out{background:var(--tint-soft);margin:0 -10px;padding:11px 10px;border-radius:8px;border-bottom:0}
.chain .step.out b{font-size:21px}
.seg{display:flex;gap:7px;margin:6px 0 16px;flex-wrap:wrap}
.seg button{font-family:var(--sans);font-size:13.5px;font-weight:500;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink2);border-radius:8px;padding:8px 14px;transition:all .14s}
.seg button:hover{border-color:var(--over)}
.seg button[data-on="1"]{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.tinylabel{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:18px 0 4px}
.plantable input.ship{border-color:var(--over);background:#fff}
.plantable tr[data-s="under"] td{background:rgba(244,133,33,.08)}
.plantable tr[data-s="out"] td{background:rgba(186,12,47,.08)}
.plantable tr[data-s="over"] td{background:rgba(237,185,68,.14)}
.timeline{display:flex;margin:18px 0;border-radius:8px;overflow:hidden;font-family:var(--sans);font-size:11px;font-weight:600;min-height:38px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:4px 2px;line-height:1.2}

.shot{border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#fff;max-width:880px}
.shot img{width:100%;display:block}

@media(max-width:640px){
  table, .plantable{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .metrics{grid-template-columns:1fr}
  .readout{gap:18px}
  .ctrl label{flex-wrap:wrap}
  .ctrl label>span:first-child{flex:1 0 100%}
}

.chip{touch-action:none;-webkit-user-select:none;user-select:none}
.chip[data-dragging="1"]{opacity:.35}
.pool{min-height:46px;border:1.5px dashed transparent;border-radius:10px;padding:7px 7px 1px;
  margin-bottom:14px;transition:border-color .13s,background .13s}
.pool[data-over="1"]{border-color:var(--navy);background:var(--tint-soft)}
.poolempty{font-family:var(--sans);font-size:13px;color:var(--ink3)}
.bucket{transition:border-color .13s,background .13s}
.bucket[data-over="1"]{border-color:var(--navy);border-style:solid;background:var(--tint-soft)}
.floatchip{position:fixed;z-index:130;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--sans);font-size:13.5px;font-weight:500;background:var(--navy);color:#fff;
  border-radius:999px;padding:7px 14px;box-shadow:0 8px 20px -4px rgba(0,47,108,.45)}

/* ---------- screenshot lightbox ---------- */
button.shot{padding:0;border:1px solid var(--rule);cursor:zoom-in;display:block;width:100%;text-align:left}
button.shot:hover{border-color:var(--over)}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,18,42,.9);display:flex;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;width:auto;border-radius:8px;background:#fff}
.lbclose{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;background:rgba(255,255,255,.14);
  color:#fff;border:0;border-radius:8px;width:42px;height:42px}
.lbclose:hover{background:rgba(255,255,255,.28)}
.lbhint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--tint);
  font-family:var(--sans);font-size:12.5px}
.skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--navy);font-family:var(--sans);
  font-size:14px;font-weight:600;padding:10px 16px;border-radius:0 0 8px 0;z-index:200}
.skip:focus{left:0}
.exnum{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);margin-left:auto}

@media print{
  .top,.rail,.tabs,.foot,.skip,.actions,.seg,.ctrl input[type=range],.lightbox{display:none!important}
  body{background:#fff;font-size:11pt}
  .grid{display:block}
  .ex,.sandbox,.note,.eq,.tcard{break-inside:avoid;box-shadow:none}
  h1{font-size:20pt}h2{font-size:14pt}
  a[href]:after{content:""}
}

/* ---------- glossary ---------- */
.gsearch{width:100%;max-width:440px;font-size:16px;padding:12px 16px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card)}
.gsearch:focus{outline:none;border-color:var(--navy)}
.gitem{border-bottom:1px solid var(--rule2);padding:17px 0;max-width:76ch}
.gitem h3{font-family:var(--sans);font-size:15.5px;margin:0 0 5px;color:var(--navy)}
.gitem p{font-size:17px;margin:0;color:var(--ink2)}
.gcount{font-family:var(--sans);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:18px 0 4px}

/* ---------- chart text ---------- */
.mlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.mlabel.sel{fill:var(--navy);font-weight:700}
.axlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.bandlabel{font-family:var(--sans);font-size:10.5px;font-weight:700}
.hitbox{fill:transparent;cursor:pointer}

/* ---------- home + results ---------- */
.hero h1{font-size:clamp(34px,6vw,54px);max-width:17ch;margin-bottom:22px}
.score{font-family:var(--sans);font-size:68px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:0;color:var(--navy)}

<script type="text/babel" data-presets="react">
const {useState, useMemo, useRef, useEffect} = React;

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nf = n => Math.round(n).toLocaleString('en-US');

/* ============================ chart builder ============================ */
function chartSVG(o){
  const v=o.values, months=o.months||MO;
  const W=660,H=240,L=36,R=12,T=16,B=30;
  const pw=W-L-R, ph=H-T-B, top=o.top||Math.max(o.max+3, Math.ceil(Math.max.apply(null,v))+1);
  const x=i=>L+(pw/(v.length-1))*i;
  const y=m=>T+ph-(Math.max(0,Math.min(top,m))/top)*ph;
  const col=m=>m<0.05?'var(--out)':(m<o.min?'var(--under)':(m>o.max?'var(--over)':'var(--ok)'));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Months of stock by month">';
  s+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+(y(o.max)-T)+'" fill="rgba(237,185,68,.14)"/>';
  s+='<rect x="'+L+'" y="'+y(o.min)+'" width="'+pw+'" height="'+(T+ph-y(o.min))+'" fill="rgba(244,133,33,.10)"/>';
  [[o.min,'min','var(--under)'],[o.max,'max','var(--over)']].forEach(function(d){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(d[0])+'" y2="'+y(d[0])+'" stroke="'+d[2]+'" stroke-width="1" stroke-dasharray="4 3"/>';
    s+='<text class="bandlabel" x="'+(L+4)+'" y="'+(y(d[0])-5)+'" fill="'+d[2]+'">'+d[1]+' '+d[0]+' MOS</text>';
  });
  for(let k=0;k<=5;k++){const m=top*k/5;
    s+='<text class="axlabel" x="'+(L-7)+'" y="'+(y(m)+4)+'" text-anchor="end">'+(Math.round(m*10)/10)+'</text>';}
  s+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--rule)"/>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="var(--rule)"/>';
  const path=v.map((m,i)=>(i?'L':'M')+x(i)+','+y(m)).join(' ');
  if(o.ghost){
    const gp=o.ghost.map((m,i)=>(i?'L':'M')+x(i)+','+y(m)).join(' ');
    s+='<path d="'+gp+'" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".65"/>';
  }
  s+='<path d="'+path+'" fill="none" stroke="var(--ink)" stroke-width="2.25" stroke-linejoin="round" class="'+(o.animate?'draw':'')+'"/>';
  const bw=pw/(v.length-1);
  v.forEach(function(m,i){
    const sel=o.selected===i, ans=o.reveal===i;
    if(o.pickable) s+='<rect x="'+(x(i)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+ph+'" fill="'+((sel||ans)?'rgba(20,49,44,.08)':'transparent')+'"/>';
    s+='<circle cx="'+x(i)+'" cy="'+y(m)+'" r="'+((sel||ans)?5.5:3.5)+'" fill="'+(ans?'var(--ok)':(sel?'var(--ink)':col(m)))+'" stroke="var(--card)" stroke-width="1.5"/>';
    s+='<text class="mlabel '+((sel||ans)?'sel':'')+'" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+months[i]+'</text>';
    if(o.pickable) s+='<rect class="hitbox" data-pick="'+i+'" x="'+(x(i)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+ph+'"/>';
  });
  return s+'</svg>';
}

/* ============================ QAT calculation engine ============================ */
// AMC per QAT default: mean of the 3 previous months, the current month, and 2 future
// months of consumption. Missing months are null (excluded), not zero.
function amcAt(consumption, i, back, fwd){
  back = back===undefined?3:back; fwd = fwd===undefined?2:fwd;
  let sum=0,n=0;
  for(let k=i-back;k<=i+fwd;k++){
    if(k<0||k>=consumption.length) continue;
    const c=consumption[k];
    if(c===null||c===undefined) continue;
    sum+=c;n++;
  }
  return n? sum/n : null;
}

// Month-by-month projection. Stock never goes negative; the shortfall is unmet demand.
function project(opts){
  const {opening, consumption, shipments, adjustments, min, reorder} = opts;
  const max = min + reorder;
  const rows=[]; let bal=opening;
  for(let i=0;i<consumption.length;i++){
    const open=bal;
    const ship=(shipments[i]||0);
    const adj=(adjustments&&adjustments[i])||0;
    const demand=consumption[i]||0;
    let available=open+ship+adj;
    let consumed=Math.min(demand,Math.max(0,available));
    let unmet=Math.max(0,demand-Math.max(0,available));
    bal=Math.max(0,available-consumed);
    const amc=amcAt(consumption,i);
    rows.push({month:MO[i%12],open,ship,adj,consumption:demand,consumed,unmet,close:bal,
      amc, mos: (amc&&amc>0)? bal/amc : null, min, max});
  }
  return rows;
}
function statusOf(mos,min,max){
  if(mos===null) return 'na';
  if(mos<0.05) return 'out';
  if(mos<min) return 'under';
  if(mos>max) return 'over';
  return 'ok';
}

{
 id:'rv1', title:'What QAT is, and what a viewer can do', minutes:7,
 body:[
  {t:'p',cls:'lede',c:'QAT is the Quantification Analytics Tool: a cloud-based system for country-led forecasting and supply planning. It replaced Quantimed for forecasting and PipeLine for supply planning. The supply planning module went live in December 2020 and the forecasting module in June 2022.'},
  {t:'p',c:'This course covers the reports. It is written for the Reports Viewer role, so nothing here asks you to enter or change data.'},
  {t:'h',c:'The three user roles'},
  {t:'table',head:['Can do','Program Admin','Program User','Reports Viewer'],rows:[
   ['Edit program settings — display name, lead times, budgets','Yes','No','No'],
   ['Edit transactional detail — consumption, inventory, shipments','Yes','Yes','No'],
   ['View reports — consumption, inventory, shipments, stock status','Yes','Yes','Yes'],
   ['Raise tickets — report bugs, make suggestions and requests','Yes','Yes','Yes']
  ]},
  {t:'p',c:'Supply planners hold the first two roles. The viewer role is for everyone else who needs the picture rather than the keyboard: ministry management, directors, donors, partners, procurement agents and regional advisors.'},
  {t:'note',b:'One consequence worth knowing now',c:'Viewers see server programs only, not downloaded ones. A supply planner can work offline against a copy on their machine; what you see is always what has been uploaded to the server.'},
  {t:'h',c:'Three terms that appear everywhere'},
  {t:'table',head:['Term','What it means'],rows:[
   ['Program','A supply plan: one country, one technical area such as ARV or malaria, one organisation such as the MOH, and one region'],
   ['Planning unit','A product, described up to its primary packaging — Abacavir 300 mg tablet, 60 tablets'],
   ['Forecasting unit','The base unit underneath it — Abacavir 300 mg tablet. Some reports can be viewed in either']
  ]},
  {t:'h',c:'What the reports are for'},
  {t:'p',c:'The questions QAT is built to answer are the ones stakeholders actually ask: are there stockouts forecast in the next 18 months, are any products at risk of expiry, who are the main funders and procurement agents, are there gaps in funding, how accurate has the forecast been, what happens if planned shipments do not arrive, and when was this supply plan last updated.'}
 ],

{
 id:'rv2', title:'The dashboard', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'The dashboard is the landing screen and the fastest route to an answer. It has three parts, and they answer progressively narrower questions.'},
  {t:'table',head:['Section','Answers'],rows:[
   ['Ticker','What exists in QAT overall, what can I access, how many shipments are linked to a procurement system'],
   ['Overview','Across several programs: where are the stockouts, what are expiries costing, how many problems are open, when was each last uploaded'],
   ['Program Spotlight','For one program: stock status, forecast error, shipments by funder or agent, products with TBD funding, and expiries']
  ]},
  {t:'h',c:'Reading the Overview'},
  {t:'p',c:'Select the programs you want, then press Go — the table does not refresh until you do. Each row is a program. Planning units with stockouts is split red and blue, red being the number stocked out over the next 18 months. Total cost of expiries covers the same window and shows a dash when there is nothing. Open QAT problems counts outstanding items on the problem list.'},
  {t:'h',c:'Reading the Program Spotlight'},
  {t:'p',c:'One program at a time, over a report period you can set. Stock status appears as a bar showing what share of all product-months in the period fall into each status, so eighteen months across five products is ninety months, and the red portion is how many of those ninety are stockouts.'},
  {t:'p',c:'Forecast error is the average percentage error over the period, and it turns red above the threshold — 50% by default, adjustable per product by a program administrator. A caution icon means there was not enough data to calculate it. The shipments pie can be grouped by funding source, procurement agent or status, and the percentages are by value rather than quantity, because products are counted in different units.'},
  {t:'note',b:'Why some figures are missing offline',c:'Forecast error only appears for server versions, because the calculation takes too long to run against a downloaded copy. As a viewer you are always on server versions, so you will see it.'},
  {t:'h',c:'Getting around'},
  {t:'p',c:'The top ribbon carries, from the right, logout, your user profile — where language, dark mode and password live — then home, refresh, the user manual, and the QAT helpdesk. Ctrl and the scroll wheel zoom the whole interface, which is worth knowing before you squint at a dense table.'}
 ],

{
 id:'rv3', title:'The Supply Plan Report', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'The most important report in the set. Its purpose is to assess the stock status of a single product by comparing stock against dynamic minimum and maximum levels, alongside consumption, inventory and shipment data.'},
  {t:'img',src:'graph',alt:'The supply plan report graph with stock area, consumption line, shipment bars and a months of stock line',
   cap:'Two axes in one picture. Quantity on the left: the grey area is stock, blue bars are shipments pushing it up, the red line is consumption drawing it down. Months of stock on the right: the darker line, read against the dashed minimum and maximum.'},
  {t:'p',c:'The quantity view tells you how much there is. It does not tell you whether that is enough, which is why the months-of-stock line and the min and max lines share the frame. A large quantity of a fast-moving product can be a shortage; a small quantity of a slow-moving one can be years of cover.'},
  {t:'h',c:'The table underneath'},
  {t:'p',c:'The graph runs months across the horizontal axis; the table runs one month per row. Read each row left to right.'},
  {t:'eq',c:'Opening balance − consumption + shipments ± adjustments − expiries = ending balance',
   note:'Both forecast and actual consumption are shown. The actual is used in the calculation where it exists; otherwise the forecast is.'},
  {t:'p',c:'From that, two derived figures. AMC is average monthly consumption, averaged over a number of past and future months that a program administrator sets per product. Months of stock is the ending balance divided by the AMC.'},
  {t:'eq',c:'Months of stock = ending balance ÷ AMC'},
  {t:'widget',kind:'qatgraph'},
  {t:'note',b:'One month means little',c:'A single month above maximum or below minimum is rarely the story. What matters is the shape over the period: how long the dip lasts, whether a shipment arrives in time, and whether the pattern repeats.'}
 ],

  {type:'mcq', tag:'Recall',

   options:['Consumption ÷ ending balance','AMC ÷ opening balance','Ending balance ÷ AMC','Opening balance ÷ consumption'],
   answer:2,
   explain:'Ending balance divided by AMC. Both halves move: the balance changes every month, and the AMC changes as consumption data arrives.'},

 id:'rv7', title:'Consumption and forecast error', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'Forecast error tells you whether the forecast underneath a supply plan can be trusted. A plan built on a poor forecast will be wrong no matter how carefully the shipments are scheduled.'},
  {t:'p',c:'Two kinds of consumption sit behind it. Actual consumption is what was issued and reported. Forecast consumption is what was expected. Forecast error is the gap between them, and QAT reports it monthly and by planning unit.'},
  {t:'h',c:'MAPE and WAPE'},
  {t:'table',head:['Metric','What it does'],rows:[
   ['MAPE','Averages each period\u2019s percentage error, weighting every period equally'],
   ['WAPE','Weights by quantity, so high-volume periods dominate']
  ]},
  {t:'p',c:'The benefit of WAPE is that results are not easily skewed by products or months with low consumption. Where actual consumption is 1 and the forecast was 2, MAPE records a 100% error on a quantity that does not matter. The same property is a weakness in reverse: a small absolute difference can be lost inside a high-volume product.'},
  {t:'widget',kind:'error'},
  {t:'note',b:'What to do with a bad number',
   c:'Forecast error is not a scoring exercise. A high error means the forecast should be reviewed or improved at the next quantification workshop, and that is the useful outcome of noticing it.'},
  {t:'h',c:'Reading the consumption graph'},
  {t:'p',c:'A forecast line sitting consistently above the actuals means the product is being over-forecast. That ties up money that could have bought something else, and it tends to show up later as wastage, expiries and warehouse space. Consistently under-forecasting shows up as stockouts instead.'}
 ],

   q:'A consumption report shows the forecast line well above actual consumption in every month of the year. What is the right reading?',

            'Actual consumption has not been reported','The forecast error threshold is set too low'],
   answer:1,
   explain:'Over-forecasting buys product that is not needed. The money is tied up, and the stock often ends as expiry. The action is to flag it for the next quantification workshop.'},
  {type:'mcq', tag:'Judgement',
   q:'A product has a poor MAPE but an acceptable WAPE. What does that suggest?',
   options:['The errors are concentrated in low-volume months','The largest months were badly forecast',
            'The forecast is biased high throughout','The two were calculated over different periods'],
   answer:0,

/* ============================ glossary ============================ */
const GLOSSARY = [
 ['AMC','Average monthly consumption. A dynamic value recalculated each month. The QAT default averages the 3 previous months, the current month and 2 future months; missing months are null, not zero. Administrators can widen the window to 12 months either side.'],
 ['ARU — alternate reporting unit','The product and unit a country actually reports consumption or stock in, with a multiplier to the planning unit. Report in boxes of 20 bottles and QAT converts to bottles.'],
 ['ARIMA','Auto-regressive integrated moving average. A time-series method for projecting consumption from historical trends and patterns.'],
 ['ARTMIS','GHSC-PSM\u2019s system for tracking procurement, shipping and delivery of USG-financed commodities. QAT integrates with it for shipment data.'],
 ['Batch','A quantity of product with a shared expiry date. QAT creates one batch per shipment, expiring at receive date plus shelf life.'],
 ['Consumption-based forecast','A forecast extrapolated from historical actual consumption using linear and non-linear methods.'],
 ['Continuous and discrete usage','On a forecasting tree, whether a product is used indefinitely or for a defined period. Discrete products need a period of use unless they are single use.'],
 ['Data source','Where a transactional record — consumption, inventory, adjustment, shipment — originated. Applied per record.'],
 ['Equivalency unit (EU)','A standardised unit converting different strengths or pack sizes into a common measure so they can be aggregated. Cannot be combined with ARUs.'],
 ['ERP linking','Integration with a procurement agent\u2019s order management system. Linked shipment fields are not editable inside QAT.'],
 ['FEFO','First expiry, first out. QAT\u2019s default batch logic for consumption. LEFO is the opposite and is discouraged.'],
 ['Forecasting unit (FU)','The smallest unit used when forecasting — tablets, tests, vials. Always smaller than or equal to the planning unit.'],
 ['Lead times','Mapped to the shipment lifecycle in six segments: planned to submitted, submitted to approved, approved to shipped, shipped to arrived by sea, shipped to arrived by air, and arrived to received.'],
 ['MAPE','Mean absolute percentage error. Averages each period\u2019s percentage error with equal weight.'],
 ['Master data sync','Standardised data shared across a realm. Syncs on online login or manual sync; full program data is a separate download and upload.'],
 ['Minimum and maximum stock levels','Minimum is set per planning unit at program level. Maximum is calculated as minimum plus the reorder interval.'],
 ['MOS — months of stock','Ending balance divided by AMC. Recalculated every month.'],
 ['PipeLine','The legacy supply planning tool QAT replaced. Supply plans lived in an Access database; ConvertPipelineToJson migrates them.'],
 ['Plan by MOS','For high-volume products with minimal expiry, where shipments mostly replace consumption. Min and max are expressed in months.'],
 ['Plan by quantity','For low-volume, high-expiry products held for emergencies. Min is a quantity; max is min plus reorder interval times AMC.'],
 ['Planning unit (PU)','The unit QAT plans and orders in — a bottle of 30 tablets, a 10x10 blister pack.'],
 ['Program','One country, one or more technical areas, one region, one organisation. The equivalent of a PipeLine supply plan database.'],
 ['PWA','Progressive web application. QAT works offline against a program you downloaded while online.'],
 ['QPL — QAT problem list','Flags data issues, inconsistencies and warnings affecting forecasts or supply plans.'],
 ['Quantimed','The legacy forecasting tool. QAT\u2019s forecasting module replaced its module 2.'],
 ['Realm','A set of shared master data — product catalogue, funders, procurement agents. The Global Health Realm is the one in use.'],
 ['Reorder interval','Months between shipments, default 1. Used to calculate the maximum.'],
 ['RMSE','Root mean squared error. In units, and penalises large misses disproportionately.'],
 ['Shipment','A planned or actual delivery into the supply chain, shown on the plan by expected receive date regardless of order status.'],
 ['Shipment statuses','Nine in total: suggested, planned, submitted, approved, shipped, arrived, received, on hold, cancelled. Suggested and cancelled are excluded from projections; on hold is included.'],
 ['Suggested shipment','An early warning generated by QAT when stock will fall below minimum. It does not affect projections until accepted and given another status.'],
 ['Technical area','Synonymous with commodity group — ARV, family planning, malaria. Used to define a program.'],
 ['Tree forecast','A flexible structure converting demographic, morbidity or service data into commodity quantities for products without usable consumption history.'],
 ['Tree template','A pre-defined forecasting tree that can be downloaded and customised to a country context.'],
 ['Triple exponential smoothing','Holt-Winters. Models level, trend and seasonality together — the method for seasonal commodities.'],
 ['Unmet demand','What would have been consumed had stock been available. QAT never shows negative stock; the shortfall goes in its own row.'],
 ['Usage template','Pre-defined rates of use for specific products, reusable across trees and programs.'],
 ['WAPE','Weighted absolute percentage error. Total absolute error as a share of total actual demand, so volume dominates.']
];

/* ============================ shared UI ============================ */
function Chart(props){
  const html = chartSVG(props.opts);
  function onClick(e){
    const t = e.target.closest ? e.target.closest('[data-pick]') : null;
    if(t && props.onPick) props.onPick(+t.getAttribute('data-pick'));
  }
  return <div className="fig" onClick={onClick}>
    <div dangerouslySetInnerHTML={{__html:html}} />
    {props.cap ? <figcaption>{props.cap}</figcaption> : null}
  </div>;
}

function Shot({src, alt, zoomable}){
  const [big,setBig] = useState(false);
  useEffect(()=>{

/* ============================ scenario sandbox ============================ */
const BASE = {
  consumption:[9500,9800,10200,10500,11000,11500,12000,12000,11500,11000,10500,10000],
  opening:30000, min:3, reorder:2,
  shipments:[
    {m:3, qty:20000, status:'Planned', funding:'TBD'},
    {m:6, qty:25000, status:'Submitted', funding:'PMI'},
    {m:9, qty:20000, status:'Planned', funding:'Global Fund'}
  ]
};
function Sandbox(){
  const [pct,setPct] = useState(0);
  const [noUnfunded,setNoUnfunded] = useState(false);
  const [noPlanned,setNoPlanned] = useState(false);

  const build = (p, unf, pln) => {
    const cons = BASE.consumption.map(c => c*(1+p/100));
    const ship = new Array(12).fill(0);
    BASE.shipments.forEach(s=>{
      if(unf && s.funding==='TBD') return;
      if(pln && s.status==='Planned') return;
      ship[s.m] += s.qty;
    });
    return project({opening:BASE.opening, consumption:cons, shipments:ship,
      adjustments:null, min:BASE.min, reorder:BASE.reorder});
  };
  const rows = useMemo(()=>build(pct,noUnfunded,noPlanned),[pct,noUnfunded,noPlanned]);
  const base = useMemo(()=>build(0,false,false),[]);
  const mos = rows.map(r=> r.mos===null?0:r.mos);
  const ghost = base.map(r=> r.mos===null?0:r.mos);
  const max = BASE.min + BASE.reorder;
  const under = rows.filter(r=> r.mos!==null && r.mos>0 && r.mos<BASE.min).length;
  const over  = rows.filter(r=> r.mos!==null && r.mos>max).length;
  const out   = rows.filter(r=> r.close<=0).length;
  const unmet = rows.reduce((a,r)=>a+r.unmet,0);

  return <div className="sandbox">
    <h3>Scenario sandbox</h3>
    <p className="sub">One planning unit, twelve months. Opening stock 30,000. Min 3 MOS, reorder interval 2, so max is 5. Three shipments: 20,000 in April (planned, funding TBD), 25,000 in July (submitted, PMI), 20,000 in October (planned, Global Fund). The dashed line is the untouched baseline.</p>
    <Chart opts={{values:mos, ghost:ghost, min:BASE.min, max:max, top:10}}/>
    <div className="ctrl">
      <label>
        <span>Adjust forecast consumption</span>
        <input type="range" min="-40" max="40" step="5" value={pct}
          onChange={e=>setPct(+e.target.value)} />
        <span className="val">{pct>0?'+':''}{pct}%</span>
      </label>
    </div>
    <div className="toggles">
      <label><input type="checkbox" checked={noUnfunded} onChange={e=>setNoUnfunded(e.target.checked)} />
        <span>Remove unfunded shipments — drops the April order, funding source TBD</span></label>
      <label><input type="checkbox" checked={noPlanned} onChange={e=>setNoPlanned(e.target.checked)} />
        <span>Remove all planned shipments — drops April and October, leaving only the submitted July order</span></label>
    </div>
    <div className="readout">
      <div><span>Months below min</span><b>{under}</b></div>
      <div><span>Months above max</span><b>{over}</b></div>
      <div><span>Months stocked out</span><b>{out}</b></div>
      <div><span>Unmet demand</span><b>{nf(unmet)}</b></div>
    </div>
  </div>;
}

/* ============================ forecast error lab ============================ */
const ERR_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun'];
const ACTUAL =  [1200,1500, 900,1800, 400,1600];
const VER_A =   [1300,1400,1000,1700, 700,1500];
const VER_B =   [1250,1650, 850,2000, 420,1450];
function metrics(actual, fc, keep){
  let n=0, sumPct=0, sumAbs=0, sumAct=0, sumSq=0;
  actual.forEach((a,i)=>{
    if(!keep[i]) return;
    const err = Math.abs(fc[i]-a);
    n++; sumPct += err/a; sumAbs += err; sumAct += a; sumSq += err*err;
  });
  if(!n) return null;
  return {mape: sumPct/n*100, wape: sumAbs/sumAct*100, rmse: Math.sqrt(sumSq/n)};
}
function ErrorLab(){
  const [keep,setKeep] = useState([true,true,true,true,true,true]);
  const a = metrics(ACTUAL, VER_A, keep);
  const b = metrics(ACTUAL, VER_B, keep);
  const toggle = i => setKeep(k => k.map((v,j)=> j===i? !v : v));
  const line = (a && b)
    ? 'Version ' + (a.mape<=b.mape?'A':'B') + ' has the lower MAPE; version '
      + (a.wape<=b.wape?'A':'B') + ' has the lower WAPE'
      + (((a.mape<=b.mape) !== (a.wape<=b.wape))
         ? '. The two metrics disagree, which is why both are reported.'
         : '. Here they agree.')
    : 'Keep at least one month to calculate anything.';
  return <div className="sandbox">
    <h3>Forecast error lab</h3>
    <p className="sub">Six months of actuals against two forecast versions. May was a stockout month, so its actual is far below trend — click any month to exclude it and watch the metrics move.</p>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Actual</th><th>Version A</th><th>Version B</th></tr></thead>
      <tbody>{ERR_MONTHS.map((m,i)=>
        <tr key={i} style={{opacity: keep[i]?1:0.4}}>
          <td><button className="mcell mtoggle" data-off={keep[i]?'0':'1'}
            style={{minWidth:'auto',padding:'3px 9px'}} onClick={()=>toggle(i)}>{m}</button></td>
          <td>{nf(ACTUAL[i])}</td><td>{nf(VER_A[i])}</td><td>{nf(VER_B[i])}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="metrics">
      <div className="mbox" data-win={(a&&b&&a.wape<=b.wape)?'1':'0'}>
        <h5>Version A</h5>
        <div className="row"><span>MAPE</span>{a? a.mape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>WAPE</span>{a? a.wape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>RMSE</span>{a? nf(a.rmse) : '—'}</div>
      </div>
      <div className="mbox" data-win={(a&&b&&b.wape<a.wape)?'1':'0'}>
        <h5>Version B</h5>
        <div className="row"><span>MAPE</span>{b? b.mape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>WAPE</span>{b? b.wape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>RMSE</span>{b? nf(b.rmse) : '—'}</div>
      </div>
    </div>
    <p className="verdict">{line} The highlighted version has the lower WAPE.</p>
  </div>;
}

/* ============================ generic line chart ============================ */
function lineSVG(o){
  const W=660,H=250,L=46,R=12,T=16,B=32;
  const pw=W-L-R, ph=H-T-B;
  let all=[]; o.series.forEach(s=>s.values.forEach(v=>{ if(v!==null) all.push(v); }));
  const hi=Math.max.apply(null,all), lo=o.zero===false? Math.min.apply(null,all) : 0;
  const span=(hi-lo)||1;
  const n=o.labels.length;
  const x=i=>L+(pw/(n-1))*i;
  const y=v=>T+ph-((v-lo)/span)*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.alt||'chart')+'">';
  for(let k=0;k<=4;k++){ const v=lo+span*k/4;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--rule2)"/>';
    s+='<text class="axlabel" x="'+(L-7)+'" y="'+(y(v)+4)+'" text-anchor="end">'+nf(v)+'</text>'; }
  if(o.split!==undefined){
    s+='<line x1="'+x(o.split)+'" x2="'+x(o.split)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink3)" stroke-dasharray="3 3"/>';
    s+='<text class="bandlabel" x="'+(x(o.split)+5)+'" y="'+(T+11)+'" fill="var(--ink3)">projection</text>';
  }
  o.series.forEach(se=>{
    let d='',open=false;
    se.values.forEach((v,i)=>{ if(v===null){open=false;return;}
      d += (open?'L':'M')+x(i)+','+y(v); open=true; });
    s+='<path d="'+d+'" fill="none" stroke="'+(se.color||'var(--ink)')+'" stroke-width="'+(se.w||2.2)+'"'
      + (se.dash?' stroke-dasharray="5 4"':'') + ' stroke-linejoin="round"/>';
    if(se.dots) se.values.forEach((v,i)=>{ if(v!==null)
      s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="2.8" fill="'+(se.color||'var(--ink)')+'"/>'; });
  });
  o.labels.forEach((lb,i)=>{ if(lb)
    s+='<text class="mlabel" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>'; });
  return s+'</svg>';
}
function Line(props){ return <div className="fig" dangerouslySetInnerHTML={{__html:lineSVG(props.opts)}} />; }

/* ============================ extrapolation visualiser ============================ */
const HIST_LABELS = [];
for(let i=0;i<36;i++) HIST_LABELS.push(i%6===0 ? MO[i%12]+(i<12?'':(i<24?' +1':' +2')) : '');
const SEASON = [0.80,0.78,0.85,0.95,1.10,1.28,1.40,1.35,1.18,1.00,0.88,0.83];
const HIST = [];
(function(){ for(let i=0;i<24;i++){
  const trend = 4000 + i*70;
  const noise = [1.02,0.97,1.04,0.99,1.01,0.96,1.03,1.00,0.98,1.05,0.99,1.02][i%12];
  HIST.push(Math.round(trend*SEASON[i%12]*noise));
}})();
function fitLinear(y){
  const n=y.length; let sx=0,sy=0,sxy=0,sxx=0;
  y.forEach((v,i)=>{ sx+=i; sy+=v; sxy+=i*v; sxx+=i*i; });
  const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), a=(sy-b*sx)/n;
  return i=>a+b*i;
}
function ExtrapLab(){
  const [method,setMethod] = useState('season');
  const lin = fitLinear(HIST);
  // ratio-to-trend seasonal indices
  const idx = new Array(12).fill(0), cnt = new Array(12).fill(0);
  HIST.forEach((v,i)=>{ const t=lin(i); if(t>0){ idx[i%12]+=v/t; cnt[i%12]++; } });
  const si = idx.map((s,i)=> cnt[i]? s/cnt[i] : 1);
  const project = i => method==='linear' ? lin(i) : lin(i)*si[i%12];
  const fitted = HIST.map((v,i)=> project(i));
  const err = HIST.map((v,i)=> Math.abs(fitted[i]-v)/v).reduce((a,b)=>a+b,0)/HIST.length*100;
  const hist = HIST.concat(new Array(12).fill(null));
  const fwd = new Array(36).fill(null);
  for(let i=23;i<36;i++) fwd[i]=Math.round(project(i));
  return <div className="sandbox">
    <h3>Extrapolation visualiser</h3>
    <p className="sub">Two years of consumption with a clear rainy-season peak, projected twelve months forward. Same history, two methods.</p>
    <div className="seg">
      <button data-on={method==='linear'?'1':'0'} onClick={()=>setMethod('linear')}>Linear</button>
      <button data-on={method==='season'?'1':'0'} onClick={()=>setMethod('season')}>Seasonal (trend x index)</button>
    </div>
    <Line opts={{labels:HIST_LABELS, split:23, alt:'Consumption history and projection',
      series:[{values:hist, color:'var(--ink)', dots:false},
              {values:fwd, color:'var(--ok)', dash:true, w:2.4}]}}/>
    <div className="readout">
      <div><span>In-sample MAPE</span><b>{err.toFixed(1)}%</b></div>
      <div><span>Next 12 months</span><b>{nf(fwd.slice(24).reduce((a,b)=>a+b,0))}</b></div>
      <div><span>Peak month projected</span><b>{nf(Math.max.apply(null,fwd.slice(24)))}</b></div>
    </div>
    <p className="verdict">{method==='linear'
      ? 'Linear extrapolation approximates the annual average but not the seasonal shape. It under-supplies during the peak and over-supplies during the trough, while the annual total appears reasonable.'
      : 'Multiplying the trend by a seasonal index reproduces the peak. Note the lower in-sample error, and that the twelve-month total differs from the linear projection despite using the same history.'}</p>
  </div>;
}

/* ============================ batch and expiry simulator ============================ */
function BatchLab(){
  const [shelf,setShelf] = useState(18);
  const [policy,setPolicy] = useState('fefo');
  const arrivals = [{m:0,qty:40000},{m:2,qty:30000},{m:6,qty:35000}];
  const cons = [9000,9200,9500,9800,10000,10200,10500,10500,10000,9800,9500,9200];
  let batches = [], expired = 0, unmet = 0, log = [];
  arrivals.forEach((a,k)=> batches.push({id:'B'+(k+1), qty:a.qty, arrive:a.m, exp:a.m+shelf}));
  for(let m=0;m<12;m++){
    let need = cons[m];
    let live = batches.filter(b=>b.arrive<=m && b.qty>0 && b.exp>m);
    live.sort((x,y)=> policy==='fefo' ? x.exp-y.exp : y.exp-x.exp);
    live.forEach(b=>{ if(need<=0) return; const take=Math.min(b.qty,need); b.qty-=take; need-=take; });
    unmet += need;
    let lost = 0;
    batches.forEach(b=>{ if(b.exp===m+1 && b.qty>0){ lost+=b.qty; b.qty=0; } });
    expired += lost;
    log.push({m:MO[m], stock:batches.reduce((a,b)=>a+(b.arrive<=m?b.qty:0),0), lost:lost, short:need});
  }
  return <div className="sandbox">
    <h3>Batch and expiry simulator</h3>
    <p className="sub">Three shipments arrive in January, March and July, each becoming one batch that expires at its receive date plus the shelf life. Consumption draws down the batches month by month.</p>
    <div className="ctrl"><label><span>Shelf life, in months</span>
      <input type="range" min="6" max="36" value={shelf} onChange={e=>setShelf(+e.target.value)} />
      <span className="val">{shelf}</span></label></div>
    <div className="seg">
      <button data-on={policy==='fefo'?'1':'0'} onClick={()=>setPolicy('fefo')}>FEFO (QAT default)</button>
      <button data-on={policy==='lefo'?'1':'0'} onClick={()=>setPolicy('lefo')}>LEFO (discouraged)</button>
    </div>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Consumption</th><th>Closing stock</th><th>Expired</th><th>Unmet</th></tr></thead>
      <tbody>{log.map((r,i)=>
        <tr key={i} data-s={r.lost>0?'over':(r.short>0?'under':'')}>
          <td>{r.m}</td><td>{nf(cons[i])}</td><td>{nf(r.stock)}</td>
          <td>{r.lost? nf(r.lost) : '—'}</td><td>{r.short? nf(r.short) : '—'}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="readout">
      <div><span>Total expired</span><b>{nf(expired)}</b></div>
      <div><span>Total unmet demand</span><b>{nf(unmet)}</b></div>
      <div><span>Policy</span><b>{policy.toUpperCase()}</b></div>
    </div>
    <p className="verdict">Reducing the shelf life until product expires, then switching to LEFO, increases total expiries for the same stock and the same demand. QAT applies first expiry, first out by default.</p>
  </div>;
}

/* ============================ multi-region consensus ============================ */
const RG_MO = ['Jan','Feb','Mar','Apr','May','Jun'];
const REGIONS = [
  {n:'Northern', act:[1000,1100,null,1050,1200,null], fc:[1050,1050,1100,1100,1150,1150]},
  {n:'Central',  act:[800, null, null, 850, 900,null], fc:[820, 830, 840, 850, 860, 870]},
  {n:'Southern', act:[500, 520, null, null, 560,null], fc:[550, 550, 560, 560, 570, 570]}
];
function RegionLab(){
  const [mode,setMode] = useState('multi');
  const [scale,setScale] = useState(100);
  const rows = RG_MO.map((m,i)=>{
    const acts = REGIONS.map(r=> r.act[i]===null? null : r.act[i]*scale/100);
    const sumAct = acts.reduce((a,v)=> a+(v||0), 0);
    const sumFc  = REGIONS.reduce((a,r)=> a+r.fc[i], 0);
    const anyAct = acts.some(v=>v!==null);
    const consensus = mode==='multi'
      ? Math.max(sumAct, sumFc)
      : (anyAct ? sumAct : sumFc);
    return {m, sumAct, sumFc, anyAct, consensus, src: mode==='multi'
      ? (sumAct>=sumFc? 'actuals':'forecast')
      : (anyAct? 'actuals':'forecast')};
  });
  return <div className="sandbox">
    <h3>Consumption displayed in the plan</h3>
    <p className="sub">Three regions reporting into one program, with patchy actuals. The rule QAT applies depends on whether the program is single-region or multi-region — and the two rules can give very different answers.</p>
    <div className="seg">
      <button data-on={mode==='multi'?'1':'0'} onClick={()=>setMode('multi')}>Multi-region: greater of the two sums</button>
      <button data-on={mode==='single'?'1':'0'} onClick={()=>setMode('single')}>Single region: actual, else forecast</button>
    </div>
    <div className="ctrl"><label><span>Scale reported actuals</span>
      <input type="range" min="40" max="160" step="5" value={scale} onChange={e=>setScale(+e.target.value)} />
      <span className="val">{scale}%</span></label></div>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Sum of actuals</th><th>Sum of forecast</th><th>Shown</th><th>From</th></tr></thead>
      <tbody>{rows.map((r,i)=>
        <tr key={i}>
          <td>{r.m}</td>
          <td>{r.anyAct? nf(r.sumAct) : '—'}</td>
          <td>{nf(r.sumFc)}</td>
          <td><b>{nf(r.consensus)}</b></td>
          <td style={{fontSize:'12.5px',color:'var(--ink3)'}}>{r.src}</td>
        </tr>)}
      </tbody>
    </table>
    <p className="verdict">{mode==='multi'
      ? 'Under the greater-of rule, incomplete reporting cannot reduce consumption below the forecast. A month in which only one region reported will therefore display the full forecast rather than a partial actual.'
      : 'The single-region rule uses the actual value whenever one exists. Reducing the reported actuals lowers consumption accordingly, including where the reduction reflects a reporting gap rather than a change in demand.'}</p>
  </div>;
}

/* ============================ consumption adjustment ============================ */
const SO_CONS = [4200,3100,4300,4400,2050,4500,4600,4700,4550,4600,4700,4800];
const SO_DAYS = [0,11,0,0,18,0,0,0,2,0,0,0];
const SO_RR   = [100,100,100,98,97,96,100,100,100,100,100,100];
const DIM     = [31,28,31,30,31,30,31,31,30,31,30,31];
function StockoutLab(){
  const [days,setDays] = useState(SO_DAYS);
  const [rr,setRr] = useState(SO_RR);
  const [adjust,setAdjust] = useState(true);
  const adj = SO_CONS.map((c,i)=>{
    const d = Math.min(DIM[i]-1, Math.max(0, parseFloat(days[i])||0));
    const r = Math.min(100, Math.max(1, parseFloat(rr[i])||100));
    if(!adjust) return c;
    return c / (r/100) / (1 - d/DIM[i]);
  });
  const rawAmc = SO_CONS.reduce((a,b)=>a+b,0)/12;
  const adjAmc = adj.reduce((a,b)=>a+b,0)/12;
  const setD = (i,v)=> setDays(d=> d.map((x,j)=> j===i? v : x));
  const setR = (i,v)=> setRr(d=> d.map((x,j)=> j===i? v : x));
  return <div className="sandbox">
    <h3>Consumption adjustment</h3>
    <p className="sub">Reported consumption understates demand whenever a facility was stocked out or a report did not arrive. QAT scales the figure up for both.</p>
    <div className="eq" style={{margin:'0 0 16px',boxShadow:'none'}}>
      Adjusted = actual ÷ reporting rate ÷ (1 − stockout rate)
      <small>Stockout rate is days out of stock divided by days in the month.</small></div>
    <div className="toggles"><label>
      <input type="checkbox" checked={adjust} onChange={e=>setAdjust(e.target.checked)} />
      <span>Apply the adjustment</span></label></div>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Reported</th><th>Days out</th><th>Reporting %</th>
        <th>Adjusted</th><th>Uplift</th></tr></thead>
      <tbody>{MO.map((m,i)=>
        <tr key={i} data-s={((parseFloat(days[i])||0)>0 || (parseFloat(rr[i])||100)<100)? 'under':''}>
          <td>{m}</td>
          <td>{nf(SO_CONS[i])}</td>
          <td><input type="text" inputMode="numeric" value={days[i]}
            aria-label={'Days out of stock in '+m}
            onChange={e=>setD(i,e.target.value)} style={{width:'58px'}} /></td>
          <td><input type="text" inputMode="numeric" value={rr[i]}
            aria-label={'Reporting rate in '+m}
            onChange={e=>setR(i,e.target.value)} style={{width:'58px'}} /></td>
          <td>{nf(adj[i])}</td>
          <td style={{color: adj[i]>SO_CONS[i]+1? 'var(--under)':'var(--ink3)'}}>
            {adj[i]>SO_CONS[i]+1? '+'+Math.round((adj[i]/SO_CONS[i]-1)*100)+'%' : '\u2014'}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="readout">
      <div><span>Raw annual average</span><b>{nf(rawAmc)}</b></div>
      <div><span>Adjusted average</span><b>{nf(adjAmc)}</b></div>
      <div><span>Difference</span><b>{((adjAmc/rawAmc-1)*100).toFixed(1)}%</b></div>
    </div>
    <p className="verdict">Adjusted consumption is always at or above the reported figure, because both divisors are fractions. Two affected months can move the annual average by several percent, and that average is what every extrapolation method is fitted to. Extrapolating unadjusted history projects past stockouts forward as though they were demand.</p>
  </div>;
}

/* ============================ suggested shipment simulator ============================ */
function SuggestLab(){
  const [min,setMin] = useState(3);
  const [ri,setRi] = useState(2);
  const [lead,setLead] = useState(4);
  const max = min+ri;
  const cons = [10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000];
  const rows = project({opening:75000, consumption:cons, shipments:new Array(12).fill(0),
    adjustments:null, min:min, reorder:ri});
  const mos = rows.map(r=> r.mos===null? 0 : r.mos);
  const sugg = [];
  rows.forEach((r,i)=>{
    if(!r.amc || r.amc<=0) return;
    const below = k => k<12 && mos[k] < min;
    const stockout = r.close<=0;
    let target = null;
    if(stockout) target = (below(i+1) && below(i+2)) ? 'maximum' : 'minimum';
    else if(mos[i]<min && below(i+1) && below(i+2)) target = 'maximum';
    if(!target) return;
    const lvl = target==='maximum'? max : min;
    const qty = Math.max(0, lvl*r.amc - r.close);
    const place = i - lead;
    sugg.push({when:MO[i], target, qty, place: place<0? null : MO[place], emergency: place<0});
  });
  return <div className="sandbox">
    <h3>Suggested shipment simulator</h3>
    <p className="sub">Opening stock 75,000, consumption flat at 10,000 a month, no shipments entered. QAT applies its own rules and proposes orders — including where in the calendar to put them.</p>
    <div className="ctrl"><label><span>Minimum, in months</span>
      <input type="range" min="1" max="6" value={min} onChange={e=>setMin(+e.target.value)} />
      <span className="val">{min}</span></label></div>
    <div className="ctrl"><label><span>Reorder interval</span>
      <input type="range" min="1" max="6" value={ri} onChange={e=>setRi(+e.target.value)} />
      <span className="val">{ri}</span></label></div>
    <div className="ctrl"><label><span>Distribution lead time</span>
      <input type="range" min="0" max="8" value={lead} onChange={e=>setLead(+e.target.value)} />
      <span className="val">{lead} mo</span></label></div>
    <p className="tinylabel">Maximum works out at {max} months</p>
    <Chart opts={{values:mos, min:min, max:max, top:Math.max(10,max+3)}}/>
    <table className="plantable">
      <thead><tr><th>Trigger month</th><th>MOS</th><th>Top up to</th><th>Quantity</th><th>Place in</th></tr></thead>
      <tbody>{sugg.length? sugg.map((s,i)=>
        <tr key={i}>
          <td>{s.when}</td>
          <td>{mos[MO.indexOf(s.when)].toFixed(1)}</td>
          <td>{s.target}</td>
          <td>{nf(s.qty)}</td>
          <td style={{color: s.emergency? 'var(--under)':'var(--ink)'}}>
            {s.emergency? 'emergency' : s.place}</td>
        </tr>) : <tr><td colSpan="5" style={{textAlign:'left',color:'var(--ink3)'}}>
          No suggestion triggers with these settings.</td></tr>}
      </tbody>
    </table>
    <p className="verdict">Increasing the minimum produces earlier and larger suggestions. Increasing the lead time moves the order month earlier; where it falls before the start of the plan, QAT flags the suggestion as an emergency shipment.</p>
  </div>;
}

/* ============================ QAT-style dual-axis graph ============================ */
const SHIP_COL = {received:'#0B2C6B', arrived:'#2FA894', submitted:'#1B7FD4',
                  onhold:'#5A5A5A', planned:'#A8C8F0', suggested:'#E8E8E8'};
const SHIP_NAME = {received:'Received', arrived:'Shipped & arrived', submitted:'Submitted & approved',
                   onhold:'On-hold', planned:'Planned'};
function qatGraph(o){
  const W=680,H=300,L=52,R=44,T=18,B=46;
  const pw=W-L-R, ph=H-T-B, n=o.months.length;
  const qMax = Math.max(Math.max.apply(null,o.stock), Math.max.apply(null,o.ships.map(s=>s.qty).concat([1])))*1.12;
  const mMax = Math.max(o.max+2, Math.max.apply(null,o.mos.concat([1]))+1);
  const x=i=>L+(pw/n)*(i+0.5);
  const yq=v=>T+ph-(v/qMax)*ph;
  const ym=v=>T+ph-(v/mMax)*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Supply plan graph">';
  // stock area
  let area='M'+L+','+(T+ph);
  o.stock.forEach((v,i)=> area+='L'+x(i)+','+yq(v));
  area+='L'+(L+pw)+','+(T+ph)+'Z';
  s+='<path d="'+area+'" fill="#D6D6D6" opacity=".85"/>';
  // shipment bars
  if(o.showShips!==false) o.ships.forEach(sh=>{
    const bw=Math.min(24,pw/n*0.55);
    s+='<rect x="'+(x(sh.i)-bw/2)+'" y="'+yq(sh.qty)+'" width="'+bw+'" height="'+(T+ph-yq(sh.qty))
      +'" fill="'+(SHIP_COL[sh.status]||'#999')+'"/>';
  });
  // min / max on months axis
  [[o.min,'Min MOS'],[o.max,'Max MOS']].forEach(d=>{
    s+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+ym(d[0])+'" y2="'+ym(d[0])
      +'" stroke="#43C3D8" stroke-width="1.6" stroke-dasharray="7 5"/>';
  });
  // consumption line
  let cd='';
  o.cons.forEach((v,i)=> cd+=(i?'L':'M')+x(i)+','+yq(v));
  s+='<path d="'+cd+'" fill="none" stroke="#BA0C2F" stroke-width="2.2"/>';
  o.actualTo!==undefined && o.cons.forEach((v,i)=>{ if(i<=o.actualTo)
    s+='<circle cx="'+x(i)+'" cy="'+yq(v)+'" r="3.2" fill="#BA0C2F"/>'; });
  // MOS line
  if(o.showMos!==false){
    let md='';
    o.mos.forEach((v,i)=> md+=(i?'L':'M')+x(i)+','+ym(v));
    s+='<path d="'+md+'" fill="none" stroke="#118B70" stroke-width="2.2"/>';
  }
  // expiry triangles
  (o.expired||[]).forEach(i=>{
    const px=x(i), py=yq(o.cons[i])-2;
    s+='<polygon points="'+px+','+(py-11)+' '+(px+8)+','+(py+3)+' '+(px-8)+','+(py+3)
      +'" fill="#F48521" stroke="#C25E0A" stroke-width="1"/>';
  });
  // selection
  if(o.sel!==undefined && o.sel!==null){
    s+='<rect x="'+(x(o.sel)-pw/n/2)+'" y="'+T+'" width="'+(pw/n)+'" height="'+ph
      +'" fill="rgba(0,47,108,.09)"/>';
  }
  // axes
  for(let k=0;k<=4;k++){ const v=qMax*k/4;
    s+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+yq(v)+'" y2="'+yq(v)+'" stroke="#EDEDED"/>';
    s+='<text class="axlabel" x="'+(L-6)+'" y="'+(yq(v)+4)+'" text-anchor="end">'+nf(v)+'</text>'; }
  for(let k=0;k<=4;k++){ const v=mMax*k/4;
    s+='<text class="axlabel" x="'+(L+pw+7)+'" y="'+(ym(v)+4)+'">'+(Math.round(v*10)/10)+'</text>'; }
  s+='<text class="axlabel" x="'+(L-40)+'" y="'+(T+ph/2)+'" transform="rotate(-90 '+(L-40)+' '+(T+ph/2)+')" text-anchor="middle">Quantity</text>';
  s+='<text class="axlabel" x="'+(L+pw+34)+'" y="'+(T+ph/2)+'" transform="rotate(90 '+(L+pw+34)+' '+(T+ph/2)+')" text-anchor="middle">Months of Stock</text>';
  o.months.forEach((m,i)=>{ if(i%2===0)
    s+='<text class="mlabel '+(o.sel===i?'sel':'')+'" x="'+x(i)+'" y="'+(H-26)+'" text-anchor="middle">'+m+'</text>'; });
  o.months.forEach((m,i)=>
    s+='<rect class="hitbox" data-pick="'+i+'" x="'+(x(i)-pw/n/2)+'" y="'+T+'" width="'+(pw/n)+'" height="'+ph+'"/>');
  return s+'</svg>';
}

const GD_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GD = (function(){
  const cons=[15900,16200,16000,16300,16100,16400,16200,16500,16300,16600,16400,16700];
  const ships=[{i:1,qty:95000,status:'received'},{i:4,qty:70000,status:'submitted'},
               {i:8,qty:60000,status:'planned'}];
  let bal=180000; const stock=[], mos=[];
  const amc = i => { let t=0,c=0; for(let k=i-3;k<=i+2;k++){ if(k<0||k>=12) continue; t+=cons[k]; c++; } return t/c; };
  for(let i=0;i<12;i++){
    const sh = ships.filter(s=>s.i===i).reduce((a,s)=>a+s.qty,0);
    bal = Math.max(0, bal + sh - cons[i]);
    stock.push(bal); mos.push(bal/amc(i));
  }
  return {cons, ships, stock, mos, min:4, max:7, expired:[10], actualTo:5};
})();

function UnmetLab(){

  const days = 30;
  const inStock = days - out;

  const truth = unmet===null ? null : actual+unmet;
  return <div className="sandbox">
    <h3>Unmet demand calculator</h3>
    <p className="sub">The case QAT handles least visibly: a month where reported consumption is low because the shelf was empty, not because demand was low.</p>
    <div className="ctrl"><label><span>Reported consumption</span>
      <input type="range" min="500" max="12000" step="100" value={actual}
        onChange={e=>setActual(+e.target.value)} /><span className="val">{nf(actual)}</span></label></div>

      <input type="range" min="0" max="29" value={out}

    <div className="chain">
      <div className="step"><span>Days with stock available</span><b>{inStock}</b></div>
      <div className="step"><span>Consumption per available day</span><b>{rate===null?'—':nf(rate)}</b></div>
      <div className="step"><span>Unmet demand ({out} days x rate)</span><b>{unmet===null?'—':nf(unmet)}</b></div>
      <div className="step out"><span>True monthly demand</span><b>{truth===null?'—':nf(truth)}</b></div>
