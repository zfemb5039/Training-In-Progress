<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAT eLearning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
:root{
  --navy:#002F6C; --tint:#b3d4ff; --tint-soft:#e2eefc;
  --paper:#F4F7FB; --card:#FFFFFF;
  --ink:#002F6C; --ink2:#3F5F8A; --ink3:#8199B8;
  --rule:#CFDCEC; --rule2:#E6EEF8;
  --under:#F48521; --low:#EDB944; --ok:#118B70; --over:#EDB944; --out:#BA0C2F;
  --error:#BA0C2F; --na:#BFBFBF;
  --sans:"Gill Sans","Gill Sans MT","Gill Sans Nova",Cabin,Calibri,"Trebuchet MS",sans-serif;
  --serif:"Gill Sans","Gill Sans MT","Gill Sans Nova",Cabin,Calibri,"Trebuchet MS",sans-serif;
  --shadow:0 1px 2px rgba(0,47,108,.05), 0 6px 18px -8px rgba(0,47,108,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
input[type=range]{accent-color:var(--navy)}
input[type=checkbox]{accent-color:var(--navy)}
.shell{max-width:1320px;margin:0 auto;padding:0 28px 100px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);padding:0}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:13px 28px 12px}
.wordmark{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:24px;color:#fff}
.wordmark span{color:var(--tint);font-weight:500;margin-left:2px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{font-size:13.5px;font-weight:600;border:0;background:rgba(255,255,255,.1);color:var(--tint);padding:7px 15px;border-radius:999px;transition:background .15s,color .15s}
.tab:hover{background:rgba(255,255,255,.2);color:#fff}
.tab[data-on="1"]{background:#fff;color:var(--navy)}
.meterwrap{background:var(--navy)}
.meter{height:4px;background:rgba(255,255,255,.22)}
.meter i{display:block;height:100%;background:var(--tint);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- layout ---------- */
.grid{display:grid;gap:34px;margin-top:34px}
@media(min-width:900px){.grid{grid-template-columns:240px minmax(0,1fr);gap:60px}}
@media(min-width:1500px){.grid{grid-template-columns:260px minmax(0,1fr);gap:76px}}

/* ---------- sidebar ---------- */
.rail{font-family:var(--sans);font-size:14px}
@media(min-width:900px){.rail{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto}}
.railgroup{margin-bottom:24px}
.railtitle{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.railtitle b{color:var(--ink2);font-weight:700}
.railitems{list-style:none;margin:0;padding:0}
.railitems li{position:relative;padding-left:24px}
.railitems li::before{content:"";position:absolute;left:5px;top:20px;bottom:-2px;width:1.5px;background:var(--rule)}
.railitems li:last-child::before{display:none}
.railitems li[data-state="done"]::before{background:var(--ok);opacity:.4}
.dot{position:absolute;left:0;top:12px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid var(--rule);transition:all .18s}
li[data-state="done"] .dot{background:var(--ok);border-color:var(--ok)}
li[data-state="now"] .dot{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 4px var(--tint)}
.node{background:none;border:0;padding:5px 0 9px;text-align:left;color:var(--ink3);font:inherit;width:100%;line-height:1.35;transition:color .15s}
.node:hover{color:var(--ink2)}
li[data-state="done"] .node{color:var(--ink2)}
li[data-state="now"] .node{color:var(--ink);font-weight:600}
.mins{display:block;font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:2px}

/* ---------- lesson prose ---------- */
.kicker{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6C6364;margin:0 0 9px}
h1{font-family:var(--sans);font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:0 0 20px;font-size:34px;color:var(--navy)}
h2{font-family:var(--sans);font-weight:600;letter-spacing:-.015em;font-size:20px;margin:36px 0 10px;color:var(--navy)}
p{margin:0 0 16px;max-width:68ch}
.lede{font-size:20px;color:var(--ink2);line-height:1.5}
.blist{max-width:68ch;margin:0 0 16px;padding-left:22px}
.blist li{margin-bottom:8px}
.blist li::marker{color:var(--over)}
.defn{border-left:3px solid var(--navy);padding:3px 0 3px 17px;margin:22px 0;max-width:68ch}
.defn b{font-family:var(--sans);font-size:15px;display:block;margin-bottom:3px}
.note{background:var(--tint-soft);border:1px solid var(--tint);border-radius:10px;padding:15px 18px;margin:22px 0;max-width:68ch;font-size:16.5px}
.note b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--navy)}
.eq{font-family:var(--sans);font-weight:600;font-size:16px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--over);border-radius:8px;padding:14px 18px;margin:20px 0;max-width:68ch;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.eq small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px;margin-top:7px;line-height:1.45}
table{border-collapse:collapse;font-family:var(--sans);font-size:14.5px;margin:20px 0;font-variant-numeric:tabular-nums;width:100%;max-width:880px}
th,td{padding:9px 14px 9px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule2)}
th{font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);border-bottom:1.5px solid var(--rule);padding-top:0}
tbody tr:last-child td{border-bottom:1px solid var(--rule)}
.fig{margin:24px 0;max-width:880px}
.fig figcaption{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45}
svg{display:block;width:100%;height:auto}

/* ---------- exercises ---------- */
.ex{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:24px;margin:28px 0 0;max-width:880px;box-shadow:var(--shadow)}
.ex-tag{margin:0 0 12px;display:flex;gap:8px;align-items:center}
.ex-tag i{font-style:normal;background:var(--tint-soft);border:1px solid var(--tint);color:var(--navy);border-radius:999px;padding:3px 11px;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ex-q{font-family:var(--sans);font-size:16.5px;font-weight:500;line-height:1.5;margin:0 0 18px;color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font-size:15.5px;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:9px;padding:12px 15px;color:var(--ink);line-height:1.42;transition:border-color .13s,background .13s,transform .13s;font-family:var(--sans)}
.opt:hover:not(:disabled){border-color:var(--over);background:var(--tint-soft)}
.opt[data-mark="right"]{border-color:var(--ok);background:rgba(17,139,112,.10);font-weight:600}
.opt[data-mark="wrong"]{border-color:var(--error);background:rgba(186,12,47,.06)}
.opt[data-mark="chosen"]{border-color:var(--navy);background:var(--tint-soft)}
.opt:disabled{cursor:default}
.seqrow{display:flex;gap:13px;align-items:flex-start}
.badge{font-family:var(--sans);font-weight:700;font-size:13px;min-width:22px;height:22px;border-radius:6px;background:var(--rule);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:0}
.badge.set{background:var(--navy);color:#fff}
.numrow{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
input[type=text]{font-size:16px;font-variant-numeric:tabular-nums;padding:10px 12px;width:146px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--navy);background:#fff}
.unit{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.btn{font-size:15px;font-weight:600;padding:11px 22px;border-radius:9px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:#00214d}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--rule);font-weight:500}
.btn.ghost:hover{border-color:var(--navy);background:var(--tint-soft)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{background:var(--navy)}
.btn.ghost:disabled:hover{background:transparent}
.feedback{font-family:var(--sans);font-size:15px;line-height:1.55;margin-top:18px;padding:2px 0 2px 15px;border-left:3px solid var(--rule)}
.feedback[data-tone="right"]{border-color:var(--ok)}
.feedback[data-tone="wrong"]{border-color:var(--low)}
.feedback b{display:block;margin-bottom:4px}
.actions{display:flex;gap:11px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hintline{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.foot{display:flex;gap:12px;margin-top:40px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:24px}

/* ---------- classify ---------- */
.buckets{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:620px){.buckets{grid-template-columns:1fr 1fr}}
.bucket{border:1.5px dashed var(--rule);border-radius:10px;padding:13px;min-height:82px;background:var(--paper)}
.bucket h4{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--ink2)}
.chip{font-family:var(--sans);font-size:13.5px;font-weight:500;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 13px;margin:0 6px 7px 0;color:var(--ink);transition:all .13s}
.chip:hover:not(:disabled){border-color:var(--over)}
.chip[data-mark="right"]{border-color:var(--ok);background:rgba(17,139,112,.11)}
.chip[data-mark="wrong"]{border-color:var(--error);background:rgba(186,12,47,.07)}
.pool{margin-bottom:14px}

/* ---------- data tables ---------- */
.plantable{font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums;width:100%;max-width:100%;border-collapse:collapse}
.plantable th{font-size:10.5px;text-align:right;padding:0 9px 7px;border-bottom:1.5px solid var(--rule);color:var(--navy);letter-spacing:.05em;text-transform:uppercase}
.plantable th:first-child{text-align:left}
.plantable td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--rule2)}
.plantable td:first-child{text-align:left;color:var(--ink2);font-size:13.5px;font-weight:500}
.plantable input{width:94px;text-align:right;padding:5px 8px;font-size:14px;border-radius:6px}
.mos{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:700;font-size:13.5px}
.mos[data-s="under"]{background:rgba(244,133,33,.18);color:#A2510C}
.mos[data-s="ok"]{background:rgba(17,139,112,.14);color:#0B6152}
.mos[data-s="over"]{background:rgba(237,185,68,.28);color:#7D5E08}
.mos[data-s="out"]{background:var(--out);color:#fff}

/* ---------- widgets ---------- */
.sandbox{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--navy);border-radius:4px 4px 13px 13px;padding:22px;margin:28px 0;max-width:880px;box-shadow:var(--shadow)}
.sandbox h3{font-family:var(--sans);font-size:16.5px;margin:0 0 5px;color:var(--navy);letter-spacing:-.01em}
.sandbox .sub{font-family:var(--sans);font-size:13.5px;color:var(--ink2);margin:0 0 18px;line-height:1.5;max-width:66ch}
.ctrl{font-family:var(--sans);font-size:14px;margin-bottom:13px}
.ctrl label{display:flex;gap:12px;align-items:center;justify-content:space-between}
.ctrl label>span:first-child{color:var(--ink2);flex:0 0 auto}
.ctrl input[type=range]{flex:1;min-width:90px}
.ctrl .val{min-width:66px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);flex:none}
.toggles{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.toggles label{display:flex;gap:10px;align-items:flex-start;font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--ink2)}
.toggles input{margin-top:3px}
.readout{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--sans);margin-top:18px;border-top:1px solid var(--rule2);padding-top:14px}
.readout div span{display:block;color:var(--ink3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.readout div b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.months{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}
.mcell{font-family:var(--sans);font-size:11px;border:1.5px solid var(--rule);border-radius:7px;padding:6px 7px;min-width:62px;text-align:center;background:var(--paper);color:var(--ink3);transition:all .15s}
.mcell b{display:block;font-size:13.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.mcell[data-in="1"]{border-color:var(--over);background:var(--tint-soft)}
.mcell[data-in="1"] b{color:var(--navy)}
.mcell[data-null="1"] b{color:var(--error)}
.mcell[data-now="1"]{box-shadow:0 0 0 2px var(--navy)}
.mtoggle{cursor:pointer}
.mcell[data-off="1"]{opacity:.4;text-decoration:line-through}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
.mbox{border:1.5px solid var(--rule);border-radius:10px;padding:14px;font-family:var(--sans)}
.mbox h5{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.mbox .row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums;font-weight:600}
.mbox .row span{color:var(--ink3);font-weight:400}
.mbox[data-win="1"]{border-color:var(--ok);background:rgba(17,139,112,.06)}
.verdict{font-family:var(--sans);font-size:14px;color:var(--ink2);margin-top:16px;border-top:1px solid var(--rule2);padding-top:14px;line-height:1.5;max-width:70ch}
.chain{font-family:var(--sans);font-size:14px;margin:18px 0;border-top:1.5px solid var(--rule)}
.chain .step{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.chain .step span{color:var(--ink2)}
.chain .step b{font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;color:var(--navy)}
.chain .step.out{background:var(--tint-soft);margin:0 -10px;padding:11px 10px;border-radius:8px;border-bottom:0}
.chain .step.out b{font-size:21px}
.seg{display:flex;gap:7px;margin:6px 0 16px;flex-wrap:wrap}
.seg button{font-family:var(--sans);font-size:13.5px;font-weight:500;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink2);border-radius:8px;padding:8px 14px;transition:all .14s}
.seg button:hover{border-color:var(--over)}
.seg button[data-on="1"]{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.tinylabel{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:18px 0 4px}
.plantable input.ship{border-color:var(--over);background:#fff}
.plantable tr[data-s="under"] td{background:rgba(244,133,33,.08)}
.plantable tr[data-s="out"] td{background:rgba(186,12,47,.08)}
.plantable tr[data-s="over"] td{background:rgba(237,185,68,.14)}
.timeline{display:flex;margin:18px 0;border-radius:8px;overflow:hidden;font-family:var(--sans);font-size:11px;font-weight:600;min-height:38px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:4px 2px;line-height:1.2}

.shot{border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#fff;max-width:880px}
.shot img{width:100%;display:block}

@media(max-width:640px){
  table, .plantable{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .metrics{grid-template-columns:1fr}
  .readout{gap:18px}
  .ctrl label{flex-wrap:wrap}
  .ctrl label>span:first-child{flex:1 0 100%}
}

.chip{touch-action:none;-webkit-user-select:none;user-select:none}
.chip[data-dragging="1"]{opacity:.35}
.pool{min-height:46px;border:1.5px dashed transparent;border-radius:10px;padding:7px 7px 1px;
  margin-bottom:14px;transition:border-color .13s,background .13s}
.pool[data-over="1"]{border-color:var(--navy);background:var(--tint-soft)}
.poolempty{font-family:var(--sans);font-size:13px;color:var(--ink3)}
.bucket{transition:border-color .13s,background .13s}
.bucket[data-over="1"]{border-color:var(--navy);border-style:solid;background:var(--tint-soft)}
.floatchip{position:fixed;z-index:130;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--sans);font-size:13.5px;font-weight:500;background:var(--navy);color:#fff;
  border-radius:999px;padding:7px 14px;box-shadow:0 8px 20px -4px rgba(0,47,108,.45)}

/* ---------- screenshot lightbox ---------- */
button.shot{padding:0;border:1px solid var(--rule);cursor:zoom-in;display:block;width:100%;text-align:left}
button.shot:hover{border-color:var(--over)}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,18,42,.9);display:flex;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;width:auto;border-radius:8px;background:#fff}
.lbclose{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;background:rgba(255,255,255,.14);
  color:#fff;border:0;border-radius:8px;width:42px;height:42px}
.lbclose:hover{background:rgba(255,255,255,.28)}
.lbhint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--tint);
  font-family:var(--sans);font-size:12.5px}
.skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--navy);font-family:var(--sans);
  font-size:14px;font-weight:600;padding:10px 16px;border-radius:0 0 8px 0;z-index:200}
.skip:focus{left:0}
.exnum{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);margin-left:auto}

@media print{
  .top,.rail,.tabs,.foot,.skip,.actions,.seg,.ctrl input[type=range],.lightbox{display:none!important}
  body{background:#fff;font-size:11pt}
  .grid{display:block}
  .ex,.sandbox,.note,.eq,.tcard{break-inside:avoid;box-shadow:none}
  h1{font-size:20pt}h2{font-size:14pt}
  a[href]:after{content:""}
}

/* ---------- glossary ---------- */
.gsearch{width:100%;max-width:440px;font-size:16px;padding:12px 16px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card)}
.gsearch:focus{outline:none;border-color:var(--navy)}
.gitem{border-bottom:1px solid var(--rule2);padding:17px 0;max-width:76ch}
.gitem h3{font-family:var(--sans);font-size:15.5px;margin:0 0 5px;color:var(--navy)}
.gitem p{font-size:17px;margin:0;color:var(--ink2)}
.gcount{font-family:var(--sans);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:18px 0 4px}

/* ---------- chart text ---------- */
.mlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.mlabel.sel{fill:var(--navy);font-weight:700}
.axlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.bandlabel{font-family:var(--sans);font-size:10.5px;font-weight:700}
.hitbox{fill:transparent;cursor:pointer}

/* ---------- home + results ---------- */
.hero h1{font-size:clamp(34px,6vw,54px);max-width:17ch;margin-bottom:22px}
.score{font-family:var(--sans);font-size:68px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:0;color:var(--navy)}

.tcard{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--navy);border-radius:4px 4px 13px 13px;padding:20px;text-align:left;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}

<script type="text/babel" data-presets="react">
const {useState, useMemo, useRef, useEffect} = React;

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nf = n => Math.round(n).toLocaleString('en-US');

/* ============================ chart builder ============================ */
function chartSVG(o){
  const v=o.values, months=o.months||MO;
  const W=660,H=240,L=36,R=12,T=16,B=30;
  const pw=W-L-R, ph=H-T-B, top=o.top||Math.max(o.max+3, Math.ceil(Math.max.apply(null,v))+1);
  const x=i=>L+(pw/(v.length-1))*i;
  const y=m=>T+ph-(Math.max(0,Math.min(top,m))/top)*ph;
  const col=m=>m<0.05?'var(--out)':(m<o.min?'var(--under)':(m>o.max?'var(--over)':'var(--ok)'));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Months of stock by month">';
  s+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+(y(o.max)-T)+'" fill="rgba(237,185,68,.14)"/>';
  s+='<rect x="'+L+'" y="'+y(o.min)+'" width="'+pw+'" height="'+(T+ph-y(o.min))+'" fill="rgba(244,133,33,.10)"/>';
  [[o.min,'min','var(--under)'],[o.max,'max','var(--over)']].forEach(function(d){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(d[0])+'" y2="'+y(d[0])+'" stroke="'+d[2]+'" stroke-width="1" stroke-dasharray="4 3"/>';
    s+='<text class="bandlabel" x="'+(L+4)+'" y="'+(y(d[0])-5)+'" fill="'+d[2]+'">'+d[1]+' '+d[0]+' MOS</text>';
  });
  for(let k=0;k<=5;k++){const m=top*k/5;
    s+='<text class="axlabel" x="'+(L-7)+'" y="'+(y(m)+4)+'" text-anchor="end">'+(Math.round(m*10)/10)+'</text>';}
  s+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--rule)"/>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="var(--rule)"/>';
  const path=v.map((m,i)=>(i?'L':'M')+x(i)+','+y(m)).join(' ');
  if(o.ghost){
    const gp=o.ghost.map((m,i)=>(i?'L':'M')+x(i)+','+y(m)).join(' ');
    s+='<path d="'+gp+'" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".65"/>';
  }
  s+='<path d="'+path+'" fill="none" stroke="var(--ink)" stroke-width="2.25" stroke-linejoin="round" class="'+(o.animate?'draw':'')+'"/>';
  const bw=pw/(v.length-1);
  v.forEach(function(m,i){
    const sel=o.selected===i, ans=o.reveal===i;
    if(o.pickable) s+='<rect x="'+(x(i)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+ph+'" fill="'+((sel||ans)?'rgba(20,49,44,.08)':'transparent')+'"/>';
    s+='<circle cx="'+x(i)+'" cy="'+y(m)+'" r="'+((sel||ans)?5.5:3.5)+'" fill="'+(ans?'var(--ok)':(sel?'var(--ink)':col(m)))+'" stroke="var(--card)" stroke-width="1.5"/>';
    s+='<text class="mlabel '+((sel||ans)?'sel':'')+'" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+months[i]+'</text>';
    if(o.pickable) s+='<rect class="hitbox" data-pick="'+i+'" x="'+(x(i)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+ph+'"/>';
  });
  return s+'</svg>';
}

/* ============================ QAT calculation engine ============================ */
// AMC per QAT default: mean of the 3 previous months, the current month, and 2 future
// months of consumption. Missing months are null (excluded), not zero.
function amcAt(consumption, i, back, fwd){
  back = back===undefined?3:back; fwd = fwd===undefined?2:fwd;
  let sum=0,n=0;
  for(let k=i-back;k<=i+fwd;k++){
    if(k<0||k>=consumption.length) continue;
    const c=consumption[k];
    if(c===null||c===undefined) continue;
    sum+=c;n++;
  }
  return n? sum/n : null;
}

// Month-by-month projection. Stock never goes negative; the shortfall is unmet demand.
function project(opts){
  const {opening, consumption, shipments, adjustments, min, reorder} = opts;
  const max = min + reorder;
  const rows=[]; let bal=opening;
  for(let i=0;i<consumption.length;i++){
    const open=bal;
    const ship=(shipments[i]||0);
    const adj=(adjustments&&adjustments[i])||0;
    const demand=consumption[i]||0;
    let available=open+ship+adj;
    let consumed=Math.min(demand,Math.max(0,available));
    let unmet=Math.max(0,demand-Math.max(0,available));
    bal=Math.max(0,available-consumed);
    const amc=amcAt(consumption,i);
    rows.push({month:MO[i%12],open,ship,adj,consumption:demand,consumed,unmet,close:bal,
      amc, mos: (amc&&amc>0)? bal/amc : null, min, max});
  }
  return rows;
}
function statusOf(mos,min,max){
  if(mos===null) return 'na';
  if(mos<0.05) return 'out';
  if(mos<min) return 'under';
  if(mos>max) return 'over';
  return 'ok';
}

const FC = [
{
 id:'fc1', title:'What QAT is, and how it is organised', minutes:7,
 body:[
  {t:'p',cls:'lede',c:'QAT is a cloud-based tool for country-led forecasting and supply planning, built for any health commodity. It replaced Quantimed for forecasting and PipeLine for supply planning, and it is a recognised digital public good.'},
  {t:'p',c:'The two modules arrived separately. Supply Planning launched in December 2020; Forecasting followed in June 2022. As of May 2026, 45 countries had been trained on QAT, 34 of them on both modules.'},
  {t:'h',c:'Why a forecast exists'},
  {t:'p',c:'The forecast is not the end product. Forecasted consumption feeds the supply plan, which maintains stock levels, avoids stockouts and sets the procurement budget. The final unit of a forecast is therefore always a product quantity, whatever the forecast started from.'},
  {t:'table',head:['Level','What it is'],rows:[
    ['Realm','A world of shared master data — product catalogue, funder names, procurement agent names. The Global Health Realm is the one in use today.'],
    ['Program','One country, one or more technical areas, one region, one organisation. Note that a forecasting program and a supply planning program are separate; they are not the same object.'],
    ['Region','Sub-national levels inside a program. If you plan nationally, leave it as national or central.'],
    ['Version','A saved state of a program. The copy on your machine is the local version; the copy on the server is read-only.']
  ]},
  {t:'h',c:'Working offline'},
  {t:'p',c:'QAT is a progressive web app, so you can work without a connection — but only after downloading the program while online. Master data syncs on online login or manual sync. Full forecast data is a deliberate download-then-upload cycle, and some features, including parameter optimisation, only run online.'},
  {t:'note',b:'Local and server versions',c:'Both modules show your Local version, which is editable, and the Server version, which is the last upload and view-only. Each upload creates a new numbered version on the server.'},
  {t:'p',c:'If master data is wrong — a missing product, a funder that should exist, a user role — that is a ticket to a realm or application administrator, not something you fix inside your own program.'}
 ],
 exercises:[
  {type:'mcq', tag:'Recall',
   q:'Which combination defines a QAT program?',
   options:['One product, one funder, one year','One country, one or more technical areas, one region, one organisation','One realm and one procurement agent','One forecast and one supply plan'],
   answer:1,
   explain:'A program is scoped by country, technical area(s), region and organisation. Note that a forecasting program and a supply planning program are distinct, which matters when importing consumption between them.'},
  {type:'classify', tag:'Sort',
   q:'Sort each item into where it is controlled.',
   buckets:[{id:'master',label:'Master data — raise a ticket'},{id:'prog',label:'Program settings — you or your admin'}],
   items:[
    {text:'Product catalogue',bucket:'master'},
    {text:'Procurement agent names',bucket:'master'},
    {text:'Days in month for stockout rate',bucket:'prog'},
    {text:'Freight percentage',bucket:'prog'},
    {text:'Funder names',bucket:'master'},
    {text:'Which products use the consumption method',bucket:'prog'}
   ],
   explain:'Master data is shared across the realm, so changes go through a ticket. Version settings and planning unit settings belong to your program.'}
 ]
},
{
 id:'fc2', title:'Units: forecasting, planning, reporting, equivalency', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'QAT keeps four different units for the same product. Confusing them is one of the most common sources of a quantification that comes out wildly wrong.'},
  {t:'table',head:['Unit','What it is'],rows:[
   ['Forecasting unit (FU)','The base unit used for the forecast period — tablets, tests, vials, single condoms.'],
   ['Planning unit (PU)','The product as planned and ordered, described up to primary packaging — a bottle of 60 tablets, a pack of 3,000 condoms.'],
   ['Alternate reporting unit (ARU)','The unit your country actually reports in, with a multiplier to the planning unit.'],
   ['Equivalency unit (EU)','A standardised unit that lets different strengths or pack sizes be compared and aggregated.']
  ]},
  {t:'h',c:'Conversion factors'},
  {t:'p',c:'The conversion factor is the number of forecasting units in a planning unit.'},
  {t:'table',head:['Planning unit','Forecasting unit','Factor'],rows:[
   ['Abacavir 300 mg tablet, 60 tablets','Abacavir 300 mg tablet','60'],
   ['Male condom, 3,000 pieces','Male condom','3,000'],
   ['Artesunate 120 mg vial, 1 set','Artesunate 120 mg vial','1']
  ]},
  {t:'p',c:'A factor of 1 is perfectly normal where the planning unit and forecasting unit are the same thing.'},
  {t:'note',b:'Let QAT do the conversion',c:'On the data entry screen a Data entered in setting lets you paste figures in whichever unit your LMIS reports — singles, bottles, or a unit you define — and QAT converts to the planning unit. A Show everything in PUs checkbox switches the whole table. Converting by hand outside the tool is where errors enter.'},
  {t:'widget',kind:'units'},
  {t:'note',b:'Purpose of equivalency units',c:'Different pack sizes cannot be added directly. Equivalency units and their conversion factors are what make one aggregate figure possible across presentations. ARUs cannot be used together with EUs.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'The planning unit is a bottle of 30 tablets. Your LMIS reports in boxes of 20 bottles, and the warehouse reports 340 boxes. How many planning units is that?',
   answer:6800, tol:0, unit:'bottles',
   hint:'Multiply the reported quantity by the conversion factor.',
   explain:'340 x 20 = 6,800 planning units. Enter data in the unit your staff count in and let QAT convert.'},
  {type:'mcq', tag:'Recall',
   q:'A planning unit is a pack of 3,000 condoms and the forecasting unit is a single condom. What is the conversion factor?',
   options:['1','30','3,000','Cannot be determined'],
   answer:2,
   explain:'The conversion factor is the number of forecasting units in one planning unit, so 3,000.'}
 ]
},
{
 id:'fc3', title:'Two routes to a forecast', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'QAT offers two forecasting methods, and a planning unit can use either or both. Which one fits depends on what data exists and how far the chain is from the product.'},
  {t:'table',head:['Approach','Starts from','When it fits'],rows:[
   ['Consumption forecast','Historical actual consumption','A mature, stable program with full supply and reliable data, where the past is expected to predict the future'],
   ['Tree forecast','Demographic, morbidity or service data','No usable consumption history, a new product, or demand driven by patient numbers, campaigns or targets']
  ]},
  {t:'p',c:'A tree works down a chain: what share of the population are patients, how many services per patient, how much product per patient or per service. A consumption forecast skips that chain entirely because the data is already expressed in products.'},
  {t:'h',c:'Selecting the method per product'},
  {t:'p',c:'The choice is recorded per planning unit on the Update Planning Units screen. If a product does not appear where you expect it — in a consumption import, or in the list to compare — that screen is the first place to check.'},
  {t:'note',b:'Limits of the consumption method',c:'It requires consumption data that genuinely represents demand, and it can perpetuate irrational use: if the wrong product was dispensed for two years, extrapolating that history forecasts more of the same.'},
  {t:'h',c:'Comparing the two'},
  {t:'p',c:'Building both for the same product is normal practice. A material difference indicates either that the service data overstates coverage, or that the consumption history was suppressed by stockouts or reporting gaps. Either finding should be resolved before a version is selected.'},
  {t:'widget',kind:'tree'}
 ],
 exercises:[
  {type:'mcq', tag:'Judgement',
   q:'A country is introducing a product that has never been issued before. Which approach fits?',
   options:['Consumption forecast on a short window','A tree forecast from demographic, morbidity or service data','Copy a similar product\u2019s consumption','Wait six months for actuals'],
   answer:1,
   explain:'With no consumption history there is nothing to extrapolate. A tree converts the underlying driver into commodity quantities.'},
  {type:'mcq', tag:'Recall',
   q:'True or false: a consumption forecast requires converting patient or population figures into products.',
   options:['True — every forecast starts from population','False — consumption data is already expressed in products'],
   answer:1,
   explain:'False. This is the main advantage of the consumption method: the data is already in commodities, so it needs far fewer assumptions than a tree.'},
  {type:'mcq', tag:'Apply',
   q:'A product does not appear in the list when you try to import consumption from the supply plan. What is the most likely cause?',
   options:['The supply plan version is too old','The planning unit is not in the forecast program, or the consumption method was not selected for it','The conversion factor is missing','The product has no actuals'],
   answer:1,
   explain:'Check Program Management, then Update Planning Units. A product must exist in the forecast program and have the consumption method selected before it can be matched on import.'}
 ]
},
{
 id:'fc4', title:'Consumption data: input and adjustment', minutes:11,
 body:[
  {t:'p',cls:'lede',c:'A consumption forecast has three steps, in this order: input or import the data, adjust it, then extrapolate. QAT\u2019s menus follow the same sequence.'},
  {t:'h',c:'Getting the data in'},
  {t:'p',c:'Three routes. Import from a supply planning program, which should be the usual case; type records in manually; or paste a block from Excel. On import you choose the forecast program, the date range, then the supply plan program and version, and QAT matches planning units. Unmatched products are set to Do not import, and a checkbox does that for all of them at once.'},
  {t:'note',b:'Import uses actuals only',c:'QAT will not extrapolate forecast consumption pulled from a supply plan — only actual consumption. You could type forecast figures in by hand, but that is forecasting on a forecast, and it is not recommended.'},
  {t:'h',c:'Time series requirements'},
  {t:'p',c:'Before extrapolating, the series should be in equal increments, in one consistent unit, and ideally 24 months or more. It may need adjusting for missing records, data entry errors, reporting rate and stockouts.'},
  {t:'note',b:'A blank cell is not a zero',c:'A false zero drags the average down and distorts every method that follows. QAT treats a blank as missing, and offers interpolation to estimate it from the records either side.'},
  {t:'h',c:'The adjustment arithmetic'},
  {t:'eq',c:'Adjusted consumption = actual consumption ÷ reporting rate ÷ (1 − stockout rate)',
   note:'Reporting rate defaults to 100%, stockout days to 0. Stockout rate = days stocked out ÷ days in month, and the days in a month can be changed in version settings.'},
  {t:'p',c:'Dividing by the reporting rate scales up for facilities that did not report. Dividing by one minus the stockout rate scales up for days when nothing could be issued. Unless reporting is 100% and stockouts are zero, adjusted consumption is always higher than reported.'},
  {t:'widget',kind:'stockout'},
  {t:'img',src:'fcadjust',alt:'The QAT data entry and adjustment screen before adjustment, after stockout and reporting adjustment, and after interpolation',
   cap:'The same series three times: as reported, after adjusting for stockout days and reporting rate, and after interpolating deleted months. The graph and summary table only refresh when you submit.'},
  {t:'note',b:'Choose the denominator deliberately',c:'Reporting rate is reports received over reports expected — but expected means the facilities that actually provide the service. For a product offered at ten hospitals and thirty of ninety health centres, the denominator is forty, not one hundred. Weighting by facility size has to be done outside QAT; the tool takes one rate per month per product.'},
  {t:'p',c:'A Data Check button reports gaps in the series and planning units with fewer than 24 months of actuals. Run it before extrapolating rather than after.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'In May, Product A consumed 1,000 units. It was out of stock for 5 days of the 31-day month, and the reporting rate was 98%. What is the adjusted consumption?',
   answer:1217, tol:8, unit:'units',
   hint:'Stockout rate is 5 ÷ 31. Divide the actual by the reporting rate, then by one minus the stockout rate.',
   explain:'Stockout rate is 5 ÷ 31 = 16.13%. So 1,000 ÷ 0.98 ÷ (1 − 0.1613) = 1,217 units. Both divisions push the figure up, which is the point: unless reporting was complete and nothing stocked out, true demand exceeded what the records show.'},
  {type:'mcq', tag:'Apply',
   q:'A COVID vaccine is offered at all 10 hospitals and at 30 of the 90 health centres. Twenty health centres reported this month, along with all the hospitals. What reporting rate should you enter?',
   options:['(10+20+35) ÷ 100 = 65%','(10+20) ÷ 40 = 75%','(10+20) ÷ 30 = 100%','100%, since all hospitals reported'],
   answer:1,
   explain:'Expected reports come only from facilities that provide the service: 10 hospitals plus 30 health centres, so 40. Thirty of those reported, giving 75%. Counting all 100 facilities understates the rate and over-adjusts the consumption.'},
  {type:'mcq', tag:'Recall',
   q:'What are the three adjustments you can make to consumption data in QAT?',
   options:['Reporting rate, stockouts, and interpolating missing records','Reporting rate, seasonality, and trend','Stockouts, expiry, and losses','Conversion factor, reporting rate, and price'],
   answer:0,
   explain:'Reporting rate, stockout days, and interpolation for missing records. Seasonality and trend are detected by the extrapolation methods, not entered as adjustments.'},
  {type:'mcq', tag:'Recall',
   q:'You paste twelve months of data into the adjustment screen and the graph does not change. Why?',
   options:['The data was rejected','The graph and summary table only update after you submit','The unit conversion has not been set','The date range excludes those months'],
   answer:1,
   explain:'Nothing recalculates on the graph until you submit. It is worth submitting after each change so you can see the effect, rather than making several edits and losing track of which one moved the series.'}
 ]
},
{
 id:'fc5', title:'Extrapolation: the five methods', minutes:12,
 body:[
  {t:'p',cls:'lede',c:'QAT has five extrapolation models, ordered from simple to complex. Each one estimates some combination of four components in the series: base or level, trend, season, and random variation.'},
  {t:'table',head:['Method','Minimum data','Detects','Confidence interval'],rows:[
   ['Moving average','3 months','Neither trend nor seasonality','No'],
   ['Semi-averages','3 months','Trend','No'],
   ['Linear regression','3 months','Trend','Yes'],
   ['Triple exponential smoothing (TES, Holt-Winters)','24 months','Trend and seasonality','Yes'],
   ['ARIMA','14 months','Trend and seasonality','Yes']
  ]},
  {t:'p',c:'Moving average takes a shifting window, dropping the oldest month as each new one arrives; more months in the window means a smoother line. Without new data it flattens out, so it shows no trend over a long forecast. Semi-averages splits the history in half, takes the mean of each half, and draws a line between the two midpoints. Linear regression fits the line that minimises the sum of squared differences between forecast and actual.'},
  {t:'h',c:'TES and ARIMA'},
  {t:'p',c:'TES weights older data at exponentially decreasing weights, controlled by three parameters: alpha for the base, beta for the trend, gamma for the seasonal component. Higher values give more weight to recent data. ARIMA combines an auto-regressive part, where each point is influenced by its previous values, with a moving average part, integrated through differencing so that trend and seasonality can be detected in a non-stationary series.'},
  {t:'note',b:'Optimisation, online only',c:'QAT can search the parameter space for you. For TES it runs 125 iterations, testing alpha, beta and gamma against the values 0, 0.2, 0.4, 0.8 and 1, and displays whichever combination gives the lowest RMSE. For ARIMA it runs 24 iterations across p (0 or 1), d (0, 1 or 2) and q (0, 1, 2 or 3), again keeping the lowest RMSE. Neither runs offline.'},
  {t:'h',c:'Matching method to data pattern'},
  {t:'table',head:['Data pattern','Methods that fit','Example'],rows:[
   ['Neither trend nor seasonality','Moving average','A stable post-introduction product'],
   ['Trend, no seasonality','Semi-averages, linear regression','A contraceptive implant scaling up, a regimen phasing in'],
   ['Seasonality, no trend','ARIMA, TES','An antimalarial in an endemic setting'],
   ['Both trend and seasonality','ARIMA, TES','An antimalarial in an elimination setting, campaign products']
  ]},
  {t:'widget',kind:'extrap'},
  {t:'img',src:'fcmethods',alt:'The QAT compare and select graph showing adjusted actuals against ARIMA, linear regression, moving averages, semi-averages and TES Holt-Winters, plus several named tree forecasts',
   cap:'The same history, five methods. Adjusted actuals in grey to the left; from mid-2022 each method carries the series forward differently. The flat horizontal lines are tree forecasts producing one figure a month.'},
  {t:'note',b:'Data quality before extrapolation',c:'Sophisticated models are more sensitive to problems in the data. With weak data — gaps, low reporting, fewer than 24 months — a simpler method over a short forecast period produces better results, because a complex method will amplify the error rather than see through it.'},
  {t:'h',c:'Bulk extrapolation'},
  {t:'p',c:'Bulk extrapolation runs several planning units at once and sends the results straight to the Compare and Select screen, so you do not save them one product at a time. The trade-offs: one date range for everything, no choice of method in the pop-up, and you still have to select the final forecast yourself.'},
  {t:'p',c:'One more thing to remember on the extrapolation screen: extrapolate and then save. Running it is not the same as keeping it.'}
 ],
 exercises:[
  {type:'classify', tag:'Match',
   q:'Match each method to whether it can detect seasonality.',
   buckets:[{id:'yes',label:'Detects seasonality'},{id:'no',label:'Does not'}],
   items:[
    {text:'Moving average',bucket:'no'},
    {text:'Semi-averages',bucket:'no'},
    {text:'Linear regression',bucket:'no'},
    {text:'TES (Holt-Winters)',bucket:'yes'},
    {text:'ARIMA',bucket:'yes'}
   ],
   explain:'Only TES and ARIMA model a seasonal component. Semi-averages and linear regression detect a trend but not a season; moving average detects neither.'},
  {type:'mcq', tag:'Judgement',
   q:'True or false: the weaker the data, the more complex the extrapolation model you need.',
   options:['True — complex models handle noise better','False — simpler methods over short periods produce better results with weak data'],
   answer:1,
   explain:'False. Complex methods amplify error in poor data. With gaps, low reporting or a short history, a simple method over a short forecast horizon is the more defensible choice.'},
  {type:'mcq', tag:'Judgement',
   q:'True or false: you must always select the extrapolation method with the lowest error.',
   options:['True — the metrics decide','False — choose based on the pattern in your data, and record the justification'],
   answer:1,
   explain:'False. Poor data quality can cause TES to detect seasonality that is not there, and it may still post the lowest error. Choose on the pattern you can defend and write the justification in the notes.'},
  {type:'mcq', tag:'Read the screen', img:'fcmethods',
   q:'On the graph above, two forecasts appear as flat horizontal lines across the whole period. What are they?',
   options:['Moving averages, which flatten without new data','Tree forecasts, which produce a set quantity per month rather than following the history',
            'Confidence intervals','The min and max stock levels'],
   answer:1,
   explain:'The flat lines are named tree forecasts. A tree derives its quantity from patient or population figures, so unless those are modelled to change it holds the same value every month — quite unlike the consumption methods, which are fitted to the shape of the history beside them.'},
  {type:'num', tag:'Calculate',
   q:'Consumption was 10 in January, 30 in February and 50 in March. Using a three-month moving average, what is the forecast for April?',
   answer:30, tol:0, unit:'units',
   hint:'Sum the three months in the window and divide by three.',
   explain:'(10 + 30 + 50) ÷ 3 = 30. May would then use February, March and the April forecast: (30 + 50 + 30) ÷ 3 = 36.7. Notice the series flattening — without new actuals a moving average carries no trend.'}
 ]
},
{
 id:'fc6', title:'Tree forecasts: nodes and structure', minutes:12,
 body:[
  {t:'p',cls:'lede',c:'A tree converts population, morbidity or service figures into product quantities. It is built from nodes, each of which is one box on the screen, and the icon in the top right of the box tells you what kind it is.'},
  {t:'img',src:'fctree',alt:'A QAT forecasting tree showing aggregation, number, percentage, forecasting unit and planning unit nodes across five named levels',
   cap:'Five node types across five named levels. Note the sum-of-children figure under each node, and the 200% in red — a validation error, because two regimens each claiming 100% of the parent cannot both be right.'},
  {t:'table',head:['Node type','Value is defined','Can have children'],rows:[
   ['Aggregation','As the sum of its children','Aggregation or number nodes'],
   ['Number','At the node itself, by you','Percentage or unit nodes'],
   ['Percentage','As a percentage of its parent','Percentage or unit nodes'],
   ['Forecasting unit','As a percentage of the parent, plus dosing parameters','Planning unit node'],
   ['Planning unit','As a percentage of the parent, plus the conversion factor','None — this is the bottom']
  ]},
  {t:'p',c:'An aggregation node is not typed in; change it by changing its children. A number node is where you assert a figure — a patient count, a population. A percentage node claims a share of its parent. The two unit nodes at the bottom are where the chain finally becomes a product.'},
  {t:'h',c:'Levels and validation'},
  {t:'p',c:'Levels can be named down the left — category, conditions, regimens, and so on — and branches reordered. Each node shows the sum of its children as a percentage, and that figure is your first validation check: children of a percentage node should total 100%, and anything else is a structural error even if every individual number looks plausible.'},
  {t:'note',b:'Templates',c:'Three kinds, from smallest to largest: a usage template, which is a dosing rate for a product and can be managed at program level; a branch template, a subset of nodes to drop into an existing tree; and a full tree template. Branch and tree templates are managed at realm level. Templates arrive with zeros at every level except the unit nodes, so they are a structure to customise rather than a forecast to accept.'},
  {t:'p',c:'If a tree template would help the wider QAT community, it can be requested through the ticketing helpdesk.'}
 ],
 exercises:[
  {type:'mcq', tag:'Recall',
   q:'How many node types does a QAT tree have?',
   options:['Three','Four','Five','Six'],
   answer:2,
   explain:'Aggregation, number, percentage, forecasting unit and planning unit.'},
  {type:'mcq', tag:'Apply',
   q:'You want to change the value of an aggregation node showing 5,432 patients. How?',
   options:['Type the new figure into the node','Change its children, since the node is their sum',
            'Change its parent percentage','Aggregation nodes cannot change'],
   answer:1,
   explain:'An aggregation node is defined as the sum of its children and is never typed in directly. If the total is wrong, one of the children below it is wrong.'},
  {type:'mcq', tag:'Read the screen', img:'fctree',
   q:'On the tree above, one node reports a sum of children of 200%. What does that tell you?',
   options:['The forecast will be twice as large as intended, and the structure is wrong',
            'The node is correctly modelling two products','The percentages will be normalised automatically',
            'The node needs an aggregation parent'],
   answer:0,
   explain:'Two child nodes each claiming 100% of the same parent double-counts the patients. QAT flags the total in red but will still calculate, so the sum-of-children figure is a check you have to read rather than rely on being blocked by.'},
  {type:'classify', tag:'Sort',
   q:'Sort each node type by whether you type its value in directly.',
   buckets:[{id:'typed',label:'You enter the value'},{id:'derived',label:'QAT derives it'}],
   items:[
    {text:'Number node',bucket:'typed'},
    {text:'Aggregation node',bucket:'derived'},
    {text:'Percentage node — the percentage',bucket:'typed'},
    {text:'Percentage node — the resulting quantity',bucket:'derived'},
    {text:'Planning unit node — the quantity',bucket:'derived'}
   ],
   explain:'You assert numbers and percentages. QAT derives every quantity that follows from them, including aggregations and the final product figures.'}
 ]
},
{
 id:'fc7', title:'Dosing, discrete usage and change over time', minutes:12,
 body:[
  {t:'p',cls:'lede',c:'Two products can sit at the same place on a tree and behave completely differently, because dosing is specified at the forecasting unit node.'},
  {t:'table',head:['','Continuous','Discrete'],rows:[
   ['Clinical analogue','Chronic','Acute'],
   ['End date','None','Yes'],
   ['Usage','A rate — one tablet per patient per day, indefinitely','One course — one tablet per day for seven days'],
   ['Example','Antiretroviral treatment','Malaria or TB treatment']
  ]},
  {t:'h',c:'Three settings for discrete products'},
  {t:'list',items:[
   'Lag delays consumption relative to the levels above it. Patients are still counted, but product use starts later — useful where treatment begins at a certain point in pregnancy, or where products A, B and C are used in succession.',
   'Single use determines whether the product is used once with no frequency, or has a frequency in days, weeks, months or years.',
   'All in first month versus month by month decides how a multi-month course is dispensed.'
  ]},
  {t:'eq',c:'All in first month — the default — front-loads the whole course into the month the patient starts',
   note:'Month by month spreads it across the period instead. The annual total is identical; the monthly profile is not, which is what your supply plan sees.'},
  {t:'h',c:'Changes over time'},
  {t:'p',c:'Three mechanisms, available on different node types. Modeling lets you state a rate of change. Transfer links two nodes so a decrease in one becomes an increase in the other, which is how a regimen transition is built. Extrapolation uses historical data on the node to project change.'},
  {t:'eq',c:'Linear 5% a month on 100 patients adds 5 every month. Exponential 5% compounds.',
   note:'Over two years, linear reaches 220 and exponential reaches 322. The difference is not a rounding detail.'},
  {t:'h',c:'Seasonality and manual adjustment'},
  {t:'p',c:'A number node can carry a monthly seasonality index — positive for a rainy season, negative for a dry one — alongside a manual change.'},
  {t:'eq',c:'Number node value = (value without seasonality) x (1 + seasonality index) + manual change',
   note:'For a percentage node the index is applied to the percentage first, and the result multiplied by the parent value.'},
  {t:'img',src:'fcseason',alt:'The monthly data table on a number node, with columns for change from previous month, value without seasonality, seasonality index, manual change, and the resulting forecast',
   cap:'Monthly data on a number node. The index column is where you type the seasonal effect: three months at +20% and three at −20%, against a base that is itself drifting upward by 3.47 a month.'},
  {t:'h',c:'Annual targets'},
  {t:'p',c:'Dividing an annual target by twelve produces a stairstep: flat within a year, then a jump between December and January. Change does not happen that way. QAT instead assumes one twelfth of the annual figure is reached at the midpoint of each year and interpolates between midpoints, so the rate of change is spread across the second half of one year and the first half of the next.'}
 ],
 exercises:[
  {type:'mcq', tag:'Recall',
   q:'Where is a product defined as continuous or discrete?',
   options:['On the planning unit node','On the forecasting unit node','In version settings','On the parent number node'],
   answer:1,
   explain:'Dosing, including continuous versus discrete and all three discrete settings, lives on the forecasting unit node.'},
  {type:'mcq', tag:'Apply',
   q:'A patient receives one bottle a month for three months. Under the default dispensing setting, what does the forecast show for a patient starting in January?',
   options:['One bottle in January, one in February, one in March','Three bottles in January','Three bottles in March','One bottle in January only'],
   answer:1,
   explain:'All in first month is the default and front-loads the full course into the starting month — the same approach Quantimed used. Month by month spreads it instead. The annual total is the same either way, but the monthly profile handed to the supply plan is very different.'},
  {type:'mcq', tag:'Apply',
   q:'A tree shows patients on IPTp from January but the product quantity stays at zero until March, even though the node is 100% of its parent. What explains it?',
   options:['A validation error','A lag has been set on the forecasting unit node','The conversion factor is zero','Seasonality is negative'],
   answer:1,
   explain:'Lag delays product consumption while still counting the patients above it — here because treatment does not begin until a certain point in pregnancy.'},
  {type:'num', tag:'Calculate',
   q:'A number node would be 110,500 without seasonality. The month carries a seasonality index of +20% and no manual change. What is the node value?',
   answer:132600, tol:50, unit:'units',
   hint:'Multiply by one plus the index, then add the manual change.',
   explain:'110,500 x 1.20 + 0 = 132,600. For a percentage node the index is applied to the percentage instead: 20% x 1.20 = 24%, and that is then multiplied by the parent value.'},
  {type:'mcq', tag:'Judgement',
   q:'A population of 100 grows at 5% a month. Which modelling choice reaches 322 after two years rather than 220?',
   options:['Linear','Exponential','Transfer','Extrapolation'],
   answer:1,
   explain:'Linear adds a fixed 5 every month. Exponential compounds, so the increment itself grows. Over a long horizon the choice between them dominates the result.'}
 ]
},
{
 id:'fc8', title:'Comparing, selecting and validating', minutes:11,
 body:[
  {t:'p',cls:'lede',c:'The Compare and Select screen is where a forecast becomes the forecast. Every available version for a planning unit appears together — tree and consumption — and you choose.'},
  {t:'img',src:'fccompare',alt:'The QAT compare and select detailed table showing adjusted actuals beside ARIMA, linear regression, moving average and several named tree forecasts',
   cap:'Adjusted actuals in the second column, then each consumption method, then each named tree forecast. A method that produces one flat figure for every month is visible immediately in a table like this.'},
  {t:'h',c:'How to work the screen'},
  {t:'list',items:[
   'First check that every forecast you expect is listed. A missing one means going back to Manage Tree, or the extrapolation screen, or Update Planning Units.',
   'Select one forecast per planning unit — or several trees for the same unit where that is appropriate — and submit before changing product.',
   'Use the display checkboxes to keep the graph legible; too many series at once and it tells you nothing.',
   'Forecast error and the comparison against a consumption forecast only appear where actuals exist. For a new product, neither can be calculated.'
  ]},
  {t:'h',c:'Error metrics'},
  {t:'p',c:'QAT reports MAPE, WAPE, RMSE, MAE and R-squared. They are called best-fit metrics because they measure how closely a model reproduces the historical series, not how right it will turn out to be. Lower is better for all of them except R-squared, where closer to 1 is better.'},
  {t:'widget',kind:'error'},
  {t:'note',b:'Interpreting the two metrics together',c:'MAPE weights every month equally, so small months with large percentage errors dominate it. WAPE weights by volume. If MAPE is poor and WAPE is fine, the errors sit in low-volume months. WAPE is the more informative of the two where values are small or intermittent, and it is the accuracy metric carried through to the supply planning module.'},
  {t:'h',c:'Forecast validation'},
  {t:'p',c:'A validation screen checks whether the forecast is finished. It is the forecasting module\u2019s analogue of the QAT problem list, with one difference: it is a report rather than a list you can annotate, so nothing forces you to resolve anything.'},
  {t:'table',head:['Check','What it flags'],rows:[
   ['No forecast selected','Active planning units with nothing chosen'],
   ['Consumption forecast','Months missing actuals, and planning units with fewer than 24 months of actuals'],
   ['Tree forecast','Planning units not on any selected tree, branches missing a planning unit, and nodes whose children do not total 100%'],
   ['Notes','All assumptions and notes gathered together, which is the basis of a quantification report']
  ]},
  {t:'h',c:'The national view'},
  {t:'p',c:'The forecast summary can go beyond quantities into a gap analysis, but only if the supporting data is entered: opening stock, existing shipments, desired months of stock at the end of the period, price type and unit prices, and a freight percentage in version settings.'},
  {t:'eq',c:'Projected stock = stock + existing shipments − forecasted quantity',
   note:'Where the result is negative, QAT reports it as unmet demand and highlights it, the same convention the supply planning module uses.'},
  {t:'note',b:'Existing shipments, not planned ones',c:'The recommendation is to exclude planned shipments from the existing shipment quantity, since they are not yet confirmed and can change. And if you leave the desired closing months of stock blank, the analysis will happily consume your stock to nothing by the end of the period.'}
 ],
 exercises:[
  {type:'mcq', tag:'Apply',
   q:'On the Compare and Select screen for a newly introduced product, forecast error is blank. Why?',
   options:['The forecast has not been saved','Error needs actual consumption to compare against, and there is none',
            'Tree forecasts do not produce error metrics','The date range is wrong'],
   answer:1,
   explain:'Every error metric compares a model against history. With no actuals there is nothing to compare, and the consumption forecast column will be empty for the same reason.'},
  {type:'num', tag:'Calculate',
   q:'Opening stock is 10,000, existing shipments are 5,000, and the forecast for the period is 31,481. What does the national view report?',
   answer:-16481, tol:2, unit:'units',
   hint:'Stock plus existing shipments less the forecast. The answer is negative.',
   explain:'10,000 + 5,000 − 31,481 = −16,481. A negative projected stock is reported as unmet demand and highlighted, so the gap is expressed as the quantity you would need to procure rather than as a negative balance.'},
  {type:'mcq', tag:'Recall',
   q:'Which validation check is specific to tree forecasts?',
   options:['Months missing actual consumption','Planning units with fewer than 24 months of actuals',
            'Nodes whose children do not total 100%','Active planning units with no forecast selected'],
   answer:2,
   explain:'The children-do-not-total-100% check, along with branches missing a planning unit and planning units absent from any selected tree. The 24-month and missing-actuals checks belong to the consumption method.'},
  {type:'mcq', tag:'Judgement',
   q:'Two forecast versions are close on RMSE, but one is a TES model showing a strong seasonal swing that nobody in the room recognises in the product. What is the defensible choice?',
   options:['The TES model, because the metric supports it','The simpler model, with the reasoning recorded in the notes',
            'Average the two','Re-run the optimisation until they agree'],
   answer:1,
   explain:'A metric measures fit to history, not plausibility. Where a complex model finds a pattern that the programme cannot explain, the simpler model is the more defensible selection — and the justification belongs in the notes, which the validation screen collects for the quantification report.'}
 ]
},
{
 id:'fc9', title:'Versions, conflicts, and into the supply plan', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'Every upload creates a new numbered version of the forecast on the server. That is what makes collaboration possible, and it is also what creates conflicts.'},
  {t:'h',c:'What happens when two people work at once'},
  {t:'p',c:'Both download version 1, both work locally, and the second to upload has to be reconciled against the first. QAT sorts the differences into three kinds.'},
  {t:'table',head:['Situation','Outcome'],rows:[
   ['Only the local copy changed — version settings, a consumption import','Applied without a conflict'],
   ['Both changed, but different objects — user A added one tree, user B added another','Both kept'],
   ['Both changed the same object — the same planning unit, or the selected forecast for it','A conflict you resolve, by right-clicking the item']
  ]},
  {t:'img',src:'fcconflict',alt:'The QAT resolve conflicts dialog, with green cells marking values changed locally and blue cells marking values changed on the server, and buttons to accept either version',
   cap:'The resolve conflicts dialog. Green marks what changed in your local version, blue what changed on the server. You accept one side or the other per conflicting row.'},
  {t:'p',c:'The practical lesson is the same as in any shared file: agree who holds the pen for which products before the workshop starts, rather than reconciling afterwards. Version comparison lets you see what changed between two versions when you need to.'},
  {t:'h',c:'Into the supply plan'},
  {t:'list',items:[
   'Build and compare forecast versions; select one per planning unit.',
   'Quantities convert from forecasting units to planning units on the way through.',
   'The selected forecast becomes the forecast consumption line in the supply plan, shown in purple italics.',
   'Actual consumption, once entered, displaces the forecast for that month.'
  ]},
  {t:'note',b:'Recommended practice',c:'Use templates where they exist, but update them rather than accepting the zeros. Validate against several sources: the numbers on the tree, the tree validation screen, the month dropdown, the sum-of-children percentages, the node graphs, modeling validation and product validation. Add notes recording sources and assumptions. QAT will not tell you when a figure makes no sense.'},
  {t:'p',c:'The supply planning track picks up from here: what the module does with the forecast you just handed it.'}
 ],
 exercises:[
  {type:'mcq', tag:'Apply',
   q:'User A uploads version 2 after adding a demographic tree. User B, working from version 1, added a morbidity tree and now uploads. What happens to the trees?',
   options:['Only user B\u2019s tree survives','Only user A\u2019s tree survives','Both trees are kept','User B is blocked from uploading'],
   answer:2,
   explain:'Different objects, so no conflict — both trees end up in the merged version. A conflict arises only where both users changed the same thing, such as the selected forecast for the same planning unit.'},
  {type:'mcq', tag:'Recall',
   q:'You entered actual consumption for March in the supply plan, and the forecast for March was different. What shows on the supply planning screen?',
   options:['The forecast, in purple italics','The actual, in plain black','Both, in separate rows','Whichever is higher'],
   answer:1,
   explain:'For a single-region program the actual displaces the forecast once it exists. The greater-of rule applies only to multi-region programs aggregating across regions.'},
  {type:'seq', tag:'Sequence',
   q:'Put the consumption forecasting workflow in order.',
   items:['Extrapolate and save','Import or enter the data','Select the final forecast','Adjust for reporting rate, stockouts and gaps'],
   order:[1,3,0,2],
   explain:'Input or import, adjust, extrapolate, then select. QAT\u2019s menus follow the same sequence, and skipping the adjustment step means extrapolating a series that understates demand.'}
 ]
}
];

{
 id:'sp3', title:'AMC and months of stock', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'Average monthly consumption is the denominator under almost everything else, and QAT calculates it differently from how most planners expect.'},
  {t:'eq',c:'Default AMC = mean of the 3 previous months, the current month, and 2 future months',
   note:'The legend shows the window as months in past / months in future. A program administrator can widen it to 12 months either side, so always read the legend rather than assuming the default.'},
  {t:'p',c:'Looking forward matters. Because future months are forecast rather than actual, a change in the forecast moves the AMC, which moves months of stock, which moves the stock status colour — before any real consumption has happened. That is intentional: it makes the plan respond to a coming change in demand rather than lagging it.'},
  {t:'note',b:'Missing is not zero',c:'A month with no consumption data inside the window is treated as null and dropped from the average, never counted as zero. For a newly added product, past months are simply ignored until data exists. A zero would reduce the AMC and consequently every order quantity sized from it.'},
  {t:'p',c:'Widen the window below and watch what happens when it reaches the month with no data.'},
  {t:'widget',kind:'amc'},
  {t:'widget',kind:'region'},
  {t:'eq',c:'Months of stock = ending balance ÷ AMC',
   note:'Recalculated for every month of the horizon, not once for the plan.'},
  {t:'p',c:'MOS is what makes forty products comparable on one screen, and it is the row QAT colours against min and max:'},
  {t:'table',head:['Colour','Status'],rows:[
   ['Dark red','Stocked out'],['Orange','Below minimum'],['Green','Stocked to plan'],
   ['Amber','Above maximum'],['Grey','Not available — usually a missing AMC']
  ]},
  {t:'note',b:'Interpreting an N/A value',c:'An N/A months of stock means QAT could not compute an AMC. The product is not fine and it is not understocked; you simply cannot tell, and no shipment will be suggested either.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'Consumption for the AMC window reads: 4,200 / no data / 4,500 / 4,400 / 4,300 / 4,600. Using QAT\u2019s treatment of missing months, what is the AMC?',
   answer:4400, tol:1, unit:'packs / month',
   hint:'The month with no data is null, not zero. Divide by the number of months that actually have data.',
   explain:'The five months with data total 22,000, so the AMC is 4,400. Had the blank been treated as zero, the average would have dropped to 3,667 — about 17% lower, and every order sized from it would have been short.'},
  {type:'num', tag:'Calculate',
   q:'The ending balance for the month is 22,000 packs and the AMC is 4,400. What is the months of stock?',
   answer:5, tol:0.05, unit:'months',
   explain:'22,000 ÷ 4,400 = 5.0 months. It is the ending balance, not a mid-month snapshot, that QAT divides.'},
  {type:'mcq', tag:'Apply',
   q:'A planner raises the forecast for the next two months. Nothing else changes. What happens to this month\u2019s months of stock?',
   options:['Nothing, because the forecast is in the future','It falls, because the AMC window includes future months',
            'It rises, because higher demand means more stock is ordered','It is only recalculated after the month closes'],
   answer:1,
   explain:'The default window reaches two months forward, so a higher forecast lifts the AMC, and a higher AMC divided into the same balance gives fewer months of stock. The plan reacts before the demand arrives.'}
 ]
},
{
 id:'sp4', title:'Minimum, maximum and planning methods', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'Minimum and maximum levels are the guardrails of the plan. The minimum is set per planning unit at the program level; the maximum is calculated, not typed.'},
  {t:'eq',c:'Max MOS = Min MOS + Reorder Interval',
   note:'The reorder interval is the number of months between shipments. A program with a min of 9 and an interval of 6 has a max of 15 — those are realistic numbers for a product shipped twice a year.'},
  {t:'h',c:'Plan by MOS, or plan by quantity'},
  {t:'p',c:'Not every product should be planned in months. QAT offers two methods, chosen per planning unit.'},
  {t:'table',head:['','Plan by MOS','Plan by quantity'],rows:[
   ['Suits','High-volume products, minimal expiry, shipments mostly replacing consumption','Low-volume, high-expiry products held for emergencies'],
   ['Examples','Most ACTs, ARVs, contraceptives, RDTs','Calcium gluconate for pre-eclampsia, anti-venom, severe malaria treatment in an elimination setting'],
   ['Minimum','Set in months of stock','Set as a quantity — e.g. 2 units per facility x 2,000 facilities'],
   ['Maximum','Min MOS + reorder interval','Min quantity + (reorder interval x AMC)'],
   ['Colour-coded row','Months of stock','Ending balance']
  ]},
  {t:'note',b:'Rationale for the two methods',c:'For an emergency product you might hold twelve months of stock and expect to discard most of it. Months of stock would read as overstocked every month and the colour would carry no information. A fixed quantity floor is the appropriate target.'},
  {t:'h',c:'Lead time segments'},
  {t:'p',c:'QAT maps lead time to the shipment lifecycle: planned to submitted, submitted to approved, approved to shipped, shipped to arrived by sea, shipped to arrived by air, and arrived to received. They are set per product, procurement agent, or program. Splitting them is what lets QAT judge whether a shipment date is physically achievable at all.'},
  {t:'widget',kind:'leadtime'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'A planning unit has a minimum of 9 months and a reorder interval of 6. What is the maximum?',
   answer:15, tol:0, unit:'months',
   explain:'9 + 6 = 15 months. A wide band like this is normal where a product arrives in two big shipments a year — the max has to accommodate a full interval of cover on arrival.'},
  {type:'num', tag:'Calculate',
   q:'A product is planned by quantity. The minimum is 4,000 units, the reorder interval is 2 months, and the AMC is 1,500 units per month. What is the maximum quantity?',
   answer:7000, tol:0, unit:'units',
   hint:'Min quantity + reorder interval x AMC.',
   explain:'4,000 + (2 x 1,500) = 7,000 units. The maximum moves whenever the AMC moves, even though the minimum is a fixed number.'},
  {type:'mcq', tag:'Judgement',

   options:['Plan by MOS, with a high minimum','Plan by quantity','Plan by MOS, with the reorder interval set to 12','Neither — exclude it from the supply plan'],
   answer:1,
   explain:'This is the textbook plan-by-quantity case: high stock relative to consumption, high expiry, and shipments replacing expired product rather than consumed product.'},
  {type:'seq', tag:'Sequence',
   q:'Put QAT\u2019s lead time segments in the order a shipment passes through them.',
   items:['Approved to shipped','Planned to submitted','Arrived to received','Submitted to approved','Shipped to arrived'],
   order:[1,3,0,4,2],
   explain:'Planned to submitted, submitted to approved, approved to shipped, shipped to arrived at port, arrived to received at destination.'},
